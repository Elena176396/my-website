// 分析四柱地支关系
function analyzeZhi(branches) {
  // branches = [yZi, mZi, dZi, hZi] (地支索引0-11)
  const raw = [];
  const pairs = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
  const triples = [[0,1,2],[0,1,3],[0,2,3],[1,2,3]];

  // 六合
  for (const [i,j] of pairs) {
    for (const [a,b,wx,desc] of LIU_HE) {
      if ((branches[i]===a && branches[j]===b)||(branches[i]===b && branches[j]===a)) {
        raw.push({type:'六合',color:'teal',i,j,key:`六合-${Math.min(branches[i],branches[j])}-${Math.max(branches[i],branches[j])}`,
          title:`${DZ[branches[i]]}${DZ[branches[j]]}合 (${SX[branches[i]]}${SX[branches[j]]})`,desc});
      }
    }
  }

  // 六冲
  for (const [i,j] of pairs) {
    for (const [a,b,desc] of LIU_CHONG) {
      if ((branches[i]===a && branches[j]===b)||(branches[i]===b && branches[j]===a)) {
        raw.push({type:'六冲',color:'red',i,j,key:`六冲-${Math.min(branches[i],branches[j])}-${Math.max(branches[i],branches[j])}`,
          title:`${DZ[branches[i]]}${DZ[branches[j]]}冲 (${SX[branches[i]]}${SX[branches[j]]})`,desc});
      }
    }
  }

  // 三合
  for (const [idxs,name,desc] of SAN_HE) {
    for (const [i,j,k] of triples) {
      const s = new Set([branches[i],branches[j],branches[k]]);
      if (idxs.every(x=>s.has(x))) {
        raw.push({type:'三合',color:'purple',pillarsList:[[i,j,k]],key:`三合-${name}`,title:name,desc,tri:true});
      }
    }
  }

  // 半合 (只在没有三合时才报)
  const has3he = raw.some(r=>r.type==='三合');
  if (!has3he) {
    for (const [i,j] of pairs) {
      for (const [idxs,name] of BAN_HE) {
        if ((branches[i]===idxs[0]&&branches[j]===idxs[1])||(branches[i]===idxs[1]&&branches[j]===idxs[0])) {
          raw.push({type:'半合',color:'purple',i,j,key:`半合-${Math.min(branches[i],branches[j])}-${Math.max(branches[i],branches[j])}`,
            title:`${DZ[branches[i]]}${DZ[branches[j]]}${name}`,desc:'三合局中出现两支，力量减半但方向一致'});
        }
      }
    }
  }

  // 相害
  for (const [i,j] of pairs) {
    for (const [a,b,desc] of XIANG_HAI) {
      if ((branches[i]===a && branches[j]===b)||(branches[i]===b && branches[j]===a)) {
        raw.push({type:'相害',color:'amber',i,j,key:`相害-${Math.min(branches[i],branches[j])}-${Math.max(branches[i],branches[j])}`,
          title:`${DZ[branches[i]]}${DZ[branches[j]]}害 (${SX[branches[i]]}${SX[branches[j]]})`,desc});
      }
    }
  }

  // 三刑
  for (const [idxs,desc] of SAN_XING) {
    for (const [i,j,k] of triples) {
      const s = new Set([branches[i],branches[j],branches[k]]);
      if (idxs.every(x=>s.has(x))) {
        raw.push({type:'三刑',color:'coral',pillarsList:[[i,j,k]],key:'三刑',title:'三刑',desc,tri:true});
      }
    }
  }

  // 二刑 (子卯)
  for (const [i,j] of pairs) {
    for (const [a,b,desc] of ER_XING) {
      if ((branches[i]===a && branches[j]===b)||(branches[i]===b && branches[j]===a)) {
        raw.push({type:'相刑',color:'coral',i,j,key:`相刑-${Math.min(branches[i],branches[j])}-${Math.max(branches[i],branches[j])}`,
          title:`${DZ[branches[i]]}${DZ[branches[j]]}刑`,desc});
      }
    }
  }

  // 自刑
  for (const [i,j] of pairs) {
    if (branches[i]===branches[j] && ZI_XING.includes(branches[i])) {
      raw.push({type:'自刑',color:'gray',i,j,key:`自刑-${branches[i]}`,
        title:`${DZ[branches[i]]}${DZ[branches[j]]}自刑`,desc:'同支相见，自我内耗、反复纠结'});
    }
  }

  // === 去重合并: 相同 key 的关系合并成一条，列出所有涉及的柱 ===
  const merged = {};
  for (const item of raw) {
    if (!merged[item.key]) {
      merged[item.key] = { type:item.type, color:item.color, title:item.title, desc:item.desc, pairSets: [] };
    }
    if (item.tri) {
      merged[item.key].pairSets.push(item.pillarsList[0]);
    } else {
      merged[item.key].pairSets.push([item.i, item.j]);
    }
  }

  // 生成柱标签
  return Object.values(merged).map(m => {
    const labels = m.pairSets.map(set => set.map(x=>PILLAR_NAMES[x]).join(m.pairSets[0].length===3?'':'↔'));
    return { type:m.type, color:m.color, title:m.title, desc:m.desc, pillars: labels.join('、') };
  });
}

// ═══════════ 计算引擎 ═══════════

function jdn(y, m, d) {
  const a = Math.floor((14 - m) / 12);
  const yr = y + 4800 - a;
  const mo = m + 12 * a - 3;
  return d + Math.floor((153 * mo + 2) / 5) + 365 * yr + Math.floor(yr / 4) - Math.floor(yr / 100) + Math.floor(yr / 400) - 32045;
}

// 获取节气月份 (返回1-12, 寅月=1)
function getSolarMonth(y, m, d) {
  // 找到当前日期落在哪两个节气之间
  for (let i = 11; i >= 0; i--) {
    const [jm, jd] = JQ[i];
    if (m > jm || (m === jm && d >= jd)) {
      return (i % 12) + 1; // 寅月=1, ..., 丑月=12
    }
  }
  // 1月6日之前属于上一年的丑月(12)
  return 12;
}

// 获取节气对应的Date用于大运计算
function getJieqiDate(y, monthIdx) {
  // monthIdx: 0=小寒, 1=立春, ..., 11=大雪
  const [m, d] = JQ[monthIdx];
  return new Date(y, m - 1, d);
}

// 农历转公历 (简化版)
function lunarToSolar(ly, lm, ld, isLeapMonth = false) {
  if (ly < 1900 || ly > 2050) return null;
  const info = LD[ly - 1900];
  const leapM = (info >> 12) & 0xF;

  // 计算从农历正月初一到目标日期的天数
  let offset = 0;
  for (let i = 1; i < lm; i++) {
    if (leapM && i === leapM + 1) {
      // 这个位置是闰月
    }
    offset += (info & (1 << (i - 1))) ? 30 : 29;
  }
  // 如果目标月之前有闰月且闰月<=目标月
  if (leapM && leapM < lm) {
    offset += (info >> 16) & 1 ? 30 : 29;
  }
  if (isLeapMonth && leapM === lm) {
    offset += (info & (1 << (lm - 1))) ? 30 : 29;
  }
  offset += ld - 1;

  // 春节的公历日期
  const idx = ly - 1900;
  if (idx >= LNY_SOLAR.length) return null;
  const nys = LNY_SOLAR[idx];
  const nym = Math.floor(nys / 100);
  const nyd = nys % 100;

  const base = new Date(ly, nym - 1, nyd);
  base.setDate(base.getDate() + offset);
  return { y: base.getFullYear(), m: base.getMonth() + 1, d: base.getDate() };
}

// 完整排盘
function calcBaZi(year, month, day, scIdx, gender) {
  // === 年柱 ===
  // 年柱以立春为界
  const lichunM = JQ[1][0], lichunD = JQ[1][1]; // 立春 ≈ 2月4日
  const effYear = (month < lichunM || (month === lichunM && day < lichunD)) ? year - 1 : year;
  const yGi = ((effYear - 4) % 10 + 10) % 10;
  const yZi = ((effYear - 4) % 12 + 12) % 12;

  // === 月柱 ===
  const sm = getSolarMonth(year, month, day);
  // 月支: 寅(2) + (sm-1)
  const mZi = (sm + 1) % 12; // sm=1→寅(idx2), sm=8→酉(idx9)
  // 月干: 五虎遁 (年干idx*2 + sm + 1) % 10
  const mGi = (yGi * 2 + sm + 1) % 10;

  // === 日柱 ===
  const j = jdn(year, month, day);
  const dIdx60 = ((j + 49) % 60 + 60) % 60;
  const dGi = dIdx60 % 10;
  const dZi = dIdx60 % 12;

  // === 时柱 ===
  const hZi = scIdx;
  const ziStart = (dGi % 5) * 2;
  const hGi = (ziStart + hZi) % 10;

  // === 构建四柱 ===
  const pillars = {
    y: mkPillar(yGi, yZi),
    m: mkPillar(mGi, mZi),
    d: mkPillar(dGi, dZi),
    h: mkPillar(hGi, hZi),
  };

  // === 五行统计 (主气) ===
  const wx = { '金': 0, '木': 0, '水': 0, '火': 0, '土': 0 };
  [pillars.y, pillars.m, pillars.d, pillars.h].forEach(p => {
    wx[p.gw]++;
    wx[p.zw]++;
  });

  // === 日主 ===
  const dm = { g: TG[dGi], w: GW[TG[dGi]], yy: dGi % 2 === 0 ? '阳' : '阴' };

  // === 喜用神 / 忌神 (简化判定) ===
  const dmw = dm.w;
  const genMap = { '木': '水', '火': '木', '土': '火', '金': '土', '水': '金' };   // 生我(印)
  const drainMap = { '木': '火', '火': '土', '土': '金', '金': '水', '水': '木' };  // 我生(食伤)
  const keMap = { '木': '土', '火': '金', '土': '水', '金': '木', '水': '火' };      // 我克(财)
  const ctrlMap = { '木': '金', '火': '水', '土': '木', '金': '火', '水': '土' };    // 克我(官杀)
  const sameCount = wx[dmw] || 0;
  const genCount = wx[genMap[dmw]] || 0;
  const strength = sameCount + genCount;
  const weak = strength <= 2;

  // 身弱: 喜印(生我)+比劫(同我)，忌食伤/财/官杀
  // 身强: 喜食伤(我生)+财(我克)，忌印/比劫
  let favSet, avoidSet;
  if (weak) {
    favSet = [dmw, genMap[dmw]];
    avoidSet = [drainMap[dmw], keMap[dmw], ctrlMap[dmw]];
  } else {
    favSet = [drainMap[dmw], keMap[dmw]];
    avoidSet = [dmw, genMap[dmw]];
  }
  const xy = favSet[0]; // 主喜用神

  // === 缺 ===
  const ms = Object.keys(wx).filter(k => wx[k] === 0);

  // === 十神 ===
  const rl = [];
  [['年', pillars.y], ['月', pillars.m], ['时', pillars.h]].forEach(([name, p]) => {
    const key = dmw + p.gw;
    rl.push({ p: name, g: p.g, w: p.gw, r: SS_MAP[key] || '?' });
  });

  // === 大运 ===
  const yearYY = yGi % 2; // 0阳1阴
  const isMale = gender === '男';
  const forward = (yearYY === 0 && isMale) || (yearYY === 1 && !isMale);

  // 计算起运岁数: 到下一个/上一个节的天数 ÷ 3
  const currentJqIdx = JQ.findIndex(([jm, jd]) => {
    return month < jm || (month === jm && day < jd);
  });
  let startAge;
  if (forward) {
    const nextIdx = currentJqIdx >= 0 ? currentJqIdx : 0;
    const [nm, nd] = JQ[nextIdx];
    const nextY = nextIdx === 0 && month >= 12 ? year + 1 : year;
    const diff = Math.abs(jdn(nextY, nm, nd) - jdn(year, month, day));
    startAge = Math.max(1, Math.round(diff / 3));
  } else {
    const prevIdx = currentJqIdx > 0 ? currentJqIdx - 1 : 11;
    const [pm, pd] = JQ[prevIdx];
    const prevY = prevIdx === 11 && month <= 1 ? year - 1 : year;
    const diff = Math.abs(jdn(year, month, day) - jdn(prevY, pm, pd));
    startAge = Math.max(1, Math.round(diff / 3));
  }

  const dy = [];
  let dyGi = mGi, dyZi = mZi;
  for (let i = 0; i < 8; i++) {
    if (forward) { dyGi = (dyGi + 1) % 10; dyZi = (dyZi + 1) % 12; }
    else { dyGi = (dyGi + 9) % 10; dyZi = (dyZi + 11) % 12; }
    const dyGw = GW[TG[dyGi]], dyZw = ZW[DZ[dyZi]];
    const rel = SS_MAP[dmw + dyGw] || '';

    // 评分: 天干+地支五行，命中喜用+1，命中忌神-1
    let score = 0;
    [dyGw, dyZw].forEach(w => {
      if (favSet.includes(w)) score += 1;
      else if (avoidSet.includes(w)) score -= 1;
    });

    // 评级 + 白话
    let level, levelC, note;
    if (score >= 2) { level = '顺'; levelC = 'good'; }
    else if (score === 1) { level = '较顺'; levelC = 'good'; }
    else if (score === 0) { level = '平'; levelC = 'flat'; }
    else if (score === -1) { level = '较逆'; levelC = 'bad'; }
    else { level = '逆'; levelC = 'bad'; }

    // 具体走什么五行、对日主什么作用
    const favHit = [dyGw, dyZw].filter(w => favSet.includes(w));
    const avoidHit = [dyGw, dyZw].filter(w => avoidSet.includes(w));
    const parts = [];
    if (favHit.length) parts.push(`走${[...new Set(favHit)].join('')}，正好补${dm.g}${dmw}所需`);
    if (avoidHit.length) parts.push(`走${[...new Set(avoidHit)].join('')}，对${dmw}日主偏耗`);
    if (!parts.length) parts.push(`五行中和，无明显助力也无大碍`);
    note = parts.join('；');

    dy.push({
      s: startAge + i * 10,
      gz: TG[dyGi] + DZ[dyZi],
      w: dyGw + dyZw,
      rel,
      level, levelC, note, score,
    });
  }

  // === 属相 ===
  const sx = { name: SX[yZi], emoji: SX_E[yZi], zhi: DZ[yZi], idx: yZi };

  // === 地支关系 ===
  const zhiRel = analyzeZhi([yZi, mZi, dZi, hZi]);

  return { p: pillars, dm, wx, xy, ms, rl, dy, sx, zhiRel, weak, favSet, avoidSet };
}

function mkPillar(gi, zi) {
  const g = TG[gi], z = DZ[zi];
  const idx60 = find60(gi, zi);
  return { g, z, gw: GW[g], zw: ZW[z], c: CG[z] || [], n: idx60 >= 0 ? NY[idx60] : '' };
}

function find60(gi, zi) {
  for (let i = 0; i < 60; i++) { if (i % 10 === gi && i % 12 === zi) return i; }
  return -1;
}

// ═══════════ 生成分享图 ═══════════
const WXC_IMG = { '金':'#888780','木':'#639922','水':'#378ADD','火':'#E24B4A','土':'#BA7517' };
const WXC_BG  = { '金':'#F1EFE8','木':'#EAF3DE','水':'#E6F1FB','火':'#FCEBEB','土':'#FAEEDA' };
const RC_IMG  = { '比劫':'#A32D2D','食伤':'#854F0B','财星':'#3B6D11','官杀':'#185FA5','印星':'#534AB7' };

function genImage(r, meta) {
  const W = 750, pad = 40;
  const c = document.createElement('canvas');
  c.width = W;
  const ctx = c.getContext('2d');
  // 先画一遍量高度，再正式画
  const H = drawAll(ctx, r, meta, W, pad, true);
  c.height = H;
  ctx.fillStyle = '#FAFAF7'; ctx.fillRect(0, 0, W, H);
  drawAll(ctx, r, meta, W, pad, false);
  return c.toDataURL('image/png');
}

function drawAll(ctx, r, meta, W, pad, measure) {
  let y = pad;
  const cw = W - pad * 2;
  const cx = W / 2;

  function txt(text, x, ty, { size = 14, color = '#2C2C2A', weight = '400', align = 'center' } = {}) {
    if (!measure) { ctx.font = `${weight} ${size}px "PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(text, x, ty); }
  }
  function roundRect(x, ry, w, h, radius, fill, stroke) {
    if (measure) return;
    ctx.beginPath(); ctx.moveTo(x + radius, ry);
    ctx.lineTo(x + w - radius, ry); ctx.arcTo(x + w, ry, x + w, ry + radius, radius);
    ctx.lineTo(x + w, ry + h - radius); ctx.arcTo(x + w, ry + h, x + w - radius, ry + h, radius);
    ctx.lineTo(x + radius, ry + h); ctx.arcTo(x, ry + h, x, ry + h - radius, radius);
    ctx.lineTo(x, ry + radius); ctx.arcTo(x, ry, x + radius, ry, radius); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  }

  // 标题
  txt('八字五行排盘', cx, y + 24, { size: 22, weight: '600' });
  y += 40;
  txt(`${meta.cal}：${meta.year}年${meta.month}月${meta.day}日 ${SC[meta.sc].l}时 · ${meta.gender}`, cx, y + 14, { size: 13, color: '#888' });
  y += 34;

  // 四柱
  const pillars = [['年柱', r.p.y], ['月柱', r.p.m], ['日柱', r.p.d], ['时柱', r.p.h]];
  const pw = 120, ph = 110, pgap = 24;
  const pStartX = cx - (pw * 4 + pgap * 3) / 2;

  pillars.forEach(([label, p], i) => {
    const px = pStartX + i * (pw + pgap);
    const isDay = i === 2;
    roundRect(px, y, pw, ph, 10, '#fff', isDay ? '#534AB7' : '#ddd');
    if (!measure) { ctx.lineWidth = isDay ? 2 : 1; }
    // 天干
    txt(p.g, px + pw / 2, y + 38, { size: 28, weight: '600' });
    // 分割线
    if (!measure) { ctx.strokeStyle = '#eee'; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(px + 10, y + 52); ctx.lineTo(px + pw - 10, y + 52); ctx.stroke(); }
    // 地支
    txt(p.z, px + pw / 2, y + 84, { size: 28, weight: '600' });
    // 柱名
    txt(isDay ? `${label}·日主` : label, px + pw / 2, y + ph + 18, { size: 11, color: isDay ? '#534AB7' : '#888' });
    // 五行
    txt(`${p.gw}${p.zw}`, px + pw / 2, y + ph + 34, { size: 11, color: '#aaa' });
  });
  y += ph + 52;

  // 五行分布
  if (!measure) { ctx.strokeStyle = '#eee'; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); }
  y += 16;
  txt('五行分布', pad + 4, y + 13, { size: 12, weight: '500', color: '#888', align: 'left' });
  y += 28;

  const wxMax = Math.max(...Object.values(r.wx), 1);
  const wxOrder = Object.entries(r.wx).sort((a, b) => b[1] - a[1]).map(e => e[0]);
  const barH = 20, barGap = 6;
  wxOrder.forEach(wx => {
    const count = r.wx[wx];
    const miss = r.ms.includes(wx);
    txt(wx, pad + 14, y + 14, { size: 14, weight: '500', color: WXC_IMG[wx] });
    const bx = pad + 36, bw = cw - 100, fillW = wxMax > 0 ? (count / wxMax) * bw : 0;
    roundRect(bx, y, bw, barH, 4, '#f0efe8', null);
    if (fillW > 0) roundRect(bx, y, fillW, barH, 4, WXC_BG[wx], null);
    if (count > 0) txt(String(count), bx + fillW - 14, y + 14, { size: 11, weight: '500', color: WXC_IMG[wx] });
    const note = miss ? '缺' : count >= 3 ? '偏旺' : count === 1 ? '偏弱' : '';
    if (note) txt(note, W - pad - 4, y + 14, { size: 11, color: miss ? '#3B6D11' : '#888', align: 'right' });
    y += barH + barGap;
  });
  y += 8;

  // 关键信息
  const infoY = y;
  const thirdW = (cw - 16) / 3;
  const row1 = [
    [`属${r.sx.name} · ${r.p.y.g}${r.p.y.z}年`, '#2C2C2A'],
    [`日主: ${r.dm.g}${r.dm.w} · ${r.dm.yy}${r.dm.w}`, '#2C2C2A'],
    [`喜用神: ${r.xy}`, WXC_IMG[r.xy] || '#2C2C2A'],
  ];
  row1.forEach((info, i) => {
    const ix = pad + i * (thirdW + 8);
    roundRect(ix, infoY, thirdW, 30, 6, '#fff', '#eee');
    txt(info[0], ix + thirdW / 2, infoY + 19, { size: 12, weight: '500', color: info[1] });
  });
  const halfW = (cw - 12) / 2;
  const row2 = [`年命纳音: ${r.p.y.n}`, `日柱纳音: ${r.p.d.n}`];
  row2.forEach((info, i) => {
    const ix = pad + i * (halfW + 12);
    roundRect(ix, infoY + 38, halfW, 30, 6, '#fff', '#eee');
    txt(info, ix + halfW / 2, infoY + 57, { size: 12, weight: '500', color: '#2C2C2A' });
  });
  y = infoY + 80;

  // 大运
  if (!measure) { ctx.strokeStyle = '#eee'; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); }
  y += 16;
  txt('大运', pad + 4, y + 13, { size: 12, weight: '500', color: '#888', align: 'left' });
  y += 26;

  const dyPerRow = 4;
  const dyW = (cw - (dyPerRow - 1) * 8) / dyPerRow;
  r.dy.forEach((d, i) => {
    const col = i % dyPerRow;
    const row = Math.floor(i / dyPerRow);
    const dx = pad + col * (dyW + 8);
    const dy2 = y + row * 72;
    const lc = { good: ['#3B6D11','#f2f9ed','#97C459'], flat: ['#5F5E5A','#fff','#eee'], bad: ['#A32D2D','#fdf3f3','#E8B4B4'] }[d.levelC];
    roundRect(dx, dy2, dyW, 64, 6, lc[1], lc[2]);
    txt(`${d.s}~${d.s + 9}岁`, dx + dyW / 2, dy2 + 14, { size: 10, color: '#888' });
    txt(d.gz, dx + dyW / 2, dy2 + 34, { size: 18, weight: '600' });
    txt(`${d.level} · ${d.rel}运`, dx + dyW / 2, dy2 + 52, { size: 10, color: lc[0] });
  });
  y += Math.ceil(r.dy.length / dyPerRow) * 72 + 8;

  // 底部
  if (!measure) { ctx.strokeStyle = '#eee'; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); }
  y += 14;
  txt('排盘结果仅供参考 · 精确命理分析请咨询专业命理师', cx, y + 10, { size: 11, color: '#bbb' });
  y += pad;
  return y;
}

// 身强身弱标签
function weak_label(r) {
  return r.weak
    ? `偏弱，喜${r.favSet.join('、')}来帮扶。`
    : `偏强，喜${r.favSet.join('、')}来发挥。`;
}

// ═══════════ 主组件 ═══════════
function BaZi() {
  const [year, setYear] = useState(2018);
  const [month, setMonth] = useState(9);
  const [day, setDay] = useState(21);

  const run = () => {

        sy = conv.y; sm = conv.m; sd = conv.d;
      }
      if (sy < 1900 || sy > 2100) { setErr('年份超出范围'); return; }
      const r = calcBaZi(sy, sm, sd, sc, gender);
      setResult(r);

  };

          --surface-1: #fff;
          --text-primary: #2C2C2A;
          --text-secondary: #555;
          --text-muted: #999;

          --text-danger: #A32D2D;
          --bg-accent: #EEEDFE;
          --bg-danger: #FCEBEB;

        <div style={{ fontSize: 12, color: 'var(--text-muted,#888)', marginTop: 4 }}>纯本地计算 · 无需网络 · 即时出盘</div>
      </div>

      <div style={{ background: 'var(--surface-1,#fff)', borderRadius: 12, padding: 16, border: '0.5px solid var(--border,#eee)', marginBottom: 16 }}>
        <div style={{ display: 'flex', gap: 16, marginBottom: 14 }}>
          <div>
            <div style={{ fontSize: 11, color: 'var(--text-muted,#888)', marginBottom: 6 }}>历法</div>
            <div style={{ display: 'flex', gap: 6 }}>
              {['公历', '农历'].map(c => <Btn key={c} selected={cal === c} onClick={() => setCal(c)}>{c}</Btn>)}
            </div>
          </div>
          <div>
            <div style={{ fontSize: 11, color: 'var(--text-muted,#888)', marginBottom: 6 }}>性别</div>
            <div style={{ display: 'flex', gap: 6 }}>
              {['男', '女'].map(g => <Btn key={g} selected={gender === g} onClick={() => setGender(g)}>{g}</Btn>)}
            </div>
          </div>
        </div>

        <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
          <NInput label="年" value={year} onChange={setYear} min={1900} max={2050} width={76} />
          <NInput label="月" value={month} onChange={setMonth} min={1} max={12} width={56} />
          <NInput label="日" value={day} onChange={setDay} min={1} max={31} width={56} />
        </div>

        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: 'var(--text-muted,#888)', marginBottom: 6 }}>时辰</div>

            {SC.map(s => (

                background: sc === s.v ? 'var(--bg-accent,#EEEDFE)' : 'transparent',
                color: sc === s.v ? 'var(--text-accent,#534AB7)' : 'var(--text-secondary,#666)',
                fontWeight: sc === s.v ? 500 : 400

                <div>{s.l}</div>
                <div style={{ fontSize: 9, opacity: 0.7 }}>{s.t}</div>
              </button>

          </div>
        </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>

            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {r.rl.map((rel, i) => (
                <span key={i} style={{ fontSize: 12, padding: '4px 10px', borderRadius: 6, background: 'var(--surface-0,#fafafa)', border: '0.5px solid var(--border,#eee)', color: 'var(--text-secondary,#666)' }}>

                </span>
              ))}
            </div>
          </div>

          {r.zhiRel && r.zhiRel.length > 0 && (
            <div style={{ background: 'var(--surface-1,#fff)', borderRadius: 12, padding: 16, border: '0.5px solid var(--border,#eee)' }}>
              <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--text-secondary,#666)', marginBottom: 10, letterSpacing: 1 }}>
                地支关系（{DZ[r.p.y.z ? DZ.indexOf(r.p.y.z) : 0]}{DZ[r.p.m.z ? DZ.indexOf(r.p.m.z) : 0]}{DZ[r.p.d.z ? DZ.indexOf(r.p.d.z) : 0]}{DZ[r.p.h.z ? DZ.indexOf(r.p.h.z) : 0]}）
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
                {r.zhiRel.map((zr, i) => {
                  const cMap = {teal:['#0F6E56','#9FE1CB'],red:['#A32D2D','#F7C1C1'],purple:['#534AB7','#CECBF6'],amber:['#854F0B','#FAC775'],coral:['#993C1D','#F5C4B3'],gray:['#5F5E5A','#D3D1C7']};
                  const cc = cMap[zr.color] || cMap.gray;
                  return (
                    <div key={i} style={{ padding: '7px 10px', background: 'var(--surface-0,#fafafa)', borderRadius: 8, border: '0.5px solid var(--border,#eee)' }}>
                      <div style={{ fontSize: 13, color: 'var(--text-primary)' }}>
                        <span style={{ fontWeight: 500, color: dk ? cc[1] : cc[0] }}>{zr.type}</span>
                        <span style={{ margin: '0 4px', color: 'var(--text-muted,#aaa)' }}>·</span>
                        {zr.title}
                        <span style={{ fontSize: 11, color: 'var(--text-muted,#888)', marginLeft: 6 }}>（{zr.pillars}）</span>

                      <div style={{ fontSize: 12, color: 'var(--text-muted,#888)', marginTop: 2 }}>{zr.desc}</div>

          {r.sx && (() => {
            const zi = r.sx.idx;
            const heList = LIU_HE.filter(([a,b])=>a===zi||b===zi).map(([a,b,wx,desc])=>({other:a===zi?b:a,wx,desc}));
            const shList = SAN_HE.filter(([idxs])=>idxs.includes(zi)).map(([idxs,wx,desc])=>({others:idxs.filter(x=>x!==zi),wx,desc}));
            const chList = LIU_CHONG.filter(([a,b])=>a===zi||b===zi).map(([a,b,desc])=>({other:a===zi?b:a,desc}));
            const haList = XIANG_HAI.filter(([a,b])=>a===zi||b===zi).map(([a,b,desc])=>({other:a===zi?b:a,desc}));
            return (
              <div style={{ background: 'var(--surface-1,#fff)', borderRadius: 12, padding: 16, border: '0.5px solid var(--border,#eee)' }}>
                <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--text-secondary,#666)', marginBottom: 10, letterSpacing: 1 }}>
                  {r.sx.emoji} 属{r.sx.name}的生肖关系
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {heList.map((h,i) => (
                    <div key={'he'+i} style={{ padding: '8px 12px', background: 'var(--surface-0,#fafafa)', borderRadius: 8, border: '0.5px solid var(--border,#eee)' }}>
                      <div style={{ fontSize: 13, color: 'var(--text-primary)' }}>
                        <span style={{ color: dk?'#9FE1CB':'#0F6E56', fontWeight: 500 }}>六合</span> · 和{SX_E[h.other]}{SX[h.other]}最亲（{h.wx}）
                      </div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted,#888)', marginTop: 2 }}>{h.desc}</div>
                    </div>
                  ))}
                  {shList.map((s,i) => (
                    <div key={'sh'+i} style={{ padding: '8px 12px', background: 'var(--surface-0,#fafafa)', borderRadius: 8, border: '0.5px solid var(--border,#eee)' }}>
                      <div style={{ fontSize: 13, color: 'var(--text-primary)' }}>
                        <span style={{ color: dk?'#CECBF6':'#534AB7', fontWeight: 500 }}>三合{s.wx}</span> · 和{s.others.map(o=>`${SX_E[o]}${SX[o]}`).join('、')}一组
                      </div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted,#888)', marginTop: 2 }}>{s.desc}</div>
                    </div>
                  ))}
                  {chList.map((c,i) => (
                    <div key={'ch'+i} style={{ padding: '8px 12px', background: 'var(--surface-0,#fafafa)', borderRadius: 8, border: '0.5px solid var(--border,#eee)' }}>
                      <div style={{ fontSize: 13, color: 'var(--text-primary)' }}>
                        <span style={{ color: dk?'#F7C1C1':'#A32D2D', fontWeight: 500 }}>六冲</span> · 和{SX_E[c.other]}{SX[c.other]}相冲
                      </div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted,#888)', marginTop: 2 }}>{c.desc}</div>
                    </div>
                  ))}
                  {haList.map((h,i) => (
                    <div key={'ha'+i} style={{ padding: '8px 12px', background: 'var(--surface-0,#fafafa)', borderRadius: 8, border: '0.5px solid var(--border,#eee)' }}>
                      <div style={{ fontSize: 13, color: 'var(--text-primary)' }}>
                        <span style={{ color: dk?'#FAC775':'#854F0B', fontWeight: 500 }}>相害</span> · 和{SX_E[h.other]}{SX[h.other]}暗耗
                      </div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted,#888)', marginTop: 2 }}>{h.desc}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}

          <div style={{ background: 'var(--surface-1,#fff)', borderRadius: 12, padding: 16, border: '0.5px solid var(--border,#eee)' }}>
            <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--text-secondary,#666)', marginBottom: 4, letterSpacing: 1 }}>大运（每步10年）</div>
            <div style={{ fontSize: 11, color: 'var(--text-muted,#888)', marginBottom: 12, lineHeight: 1.5 }}>
              顺逆看这十年走的五行：补{r.dm.g}{r.dm.w}所需为顺，反之为耗。{r.dm.g}{r.dm.w}{weak_label(r)}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>

            节气日期取近似值，交节日前后±1天可能存在月柱偏差
          </div>

          <button onClick={() => {
            try {
              const url = genImage(r, { cal, year, month, day, sc, gender });
              setImgUrl(url);

          }} style={{
            width: '100%', padding: '10px 0', borderRadius: 10, fontSize: 14, fontWeight: 500,
