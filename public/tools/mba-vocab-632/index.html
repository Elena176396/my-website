const RAW = "abide|v.遵守|a+bide(停留)→守着不走|I'll abide by whatever you decide.|你怎么决定我都遵守。\ncapacity|n.容量;能力;接受力|cap(容纳)+acity|This elevator has a capacity of ten people.|这部电梯限乘十人。\nnorm|n.准则,规范,准则|norm(规范)|Video calls are the norm at our company.|视频会议在我们公司是常态。\nnormal|a.普通的;正规的,标准的|norm(规范)+al|Is it normal to feel this tired?|累成这样正常吗？\nestablish|v.建立;安置,使定居|e+stabl(站稳)→立起来|He established his own business at thirty.|他三十岁创办了自己的公司。\nestablishment|n.建立,设立,建立的机构|establish+ment(名词)|The establishment of the new office took a year.|新办事处的设立花了一年。\nstability|n.稳定,安定|stab(站稳)+ility|All I want is job stability.|我只想要一份稳定的工作。\nabound|a.丰富，大量存在|ab+ound(波浪)→如潮涌来|Job opportunities abound in big cities.|大城市里工作机会多得很。\nabundant|a.丰富的，充裕的|abund(涌出)+ant|We have abundant time, so relax.|我们时间很充裕，放松点。\nabroad|adv.宽广；在国外|ab(离开)+road|She's studying abroad this year.|她今年在国外读书。\nabrupt|a.唐突的|ab+rupt(断裂)→突然断掉|Sorry for the abrupt change of plans.|抱歉计划改得这么突然。\ndisrupt|vt.使混乱，使崩溃，使分裂|dis(分开)+rupt(断裂)|Don't disrupt the meeting, please.|请别打断会议。\nabsent|a.缺席的|ab(离开)+sent(存在)→不在|Half the team was absent today.|今天团队一半人缺席。\nabsence|n.缺席|ab+sence→不在场|Who's in charge in his absence?|他不在时谁负责？\nextract|v./n.拔出;摘录 n.抽取物|ex(出)+tract(拉)→拉出来|They extract oil from these seeds.|他们从这些籽里榨油。\nattract|v.吸引|at(去)+tract(拉)→拉过来|The low price attracted a lot of buyers.|低价吸引了很多买家。\nattractive|a.有吸引力的|attract+ive|That's a very attractive offer.|这个报价很有吸引力。\nacademic|a.学院的；学术的|academy+ic|Her academic record is impressive.|她的学业成绩很出色。\nacademy|n.学院|学院(源自柏拉图学园)|He trains at a tennis academy.|他在一家网球学院训练。\nexcel|vi.擅长 vt.胜过|ex(超出)+cel(高)→高出一截|She excels at solving problems.|她特别擅长解决问题。\nacceptance|n.接受|accept+ance|I just got my acceptance letter!|我刚收到录取通知！\nsusceptible|a.易受影响的;易受感动的;易受感染的|sus(下)+cept(拿)→容易被拿住|Kids are susceptible to colds.|小孩容易感冒。\naccess|n.入口；享用权 v.接近|ac(去)+cess(走)→走近|Do you have access to the files?|你有权限看这些文件吗？\nexcessive|a.过多的;过分的;额外|ex(超出)+cess(走)→走过头|The fees here are excessive.|这里的收费太离谱了。\npredecessor|n.前辈，前任|pre(前)+de+cess(走)→先走的人|My predecessor left a big mess.|我的前任留下一堆烂摊子。\nprocess|n.过程v.加工,处理|pro(向前)+cess(走)→往前走的过程|The hiring process takes weeks.|招聘流程要好几周。\nsuccession|n.连续,系列;继任|suc(接着)+cess(走)→接连|We had three storms in succession.|我们接连遭遇三场暴风雨。\nproceed|v.进行,继续下去;发生|pro(向前)+ceed(走)|Let's proceed to the next item.|我们进行下一项吧。\nsucceed|vi.成功vt.接替|suc(接着)+ceed(走)→接着走通|If you don't succeed, try again.|不成功就再试一次。\nprecede|v.领先(于),在(…之前);优先|pre(前)+cede(走)→走在前面|A short speech will precede dinner.|晚宴前会有个简短致辞。\naccident|n.事故|ac+cid(落下)→意外落下的事|It was an accident, I swear.|那是意外，我发誓。\nacclaim|v.欢呼，喝彩|ac(去)+claim(喊)→喝彩|The film won worldwide acclaim.|这部电影赢得全球赞誉。\nclaim|v.要求n.要求;断言|claim(喊)→喊出主张|He claims he was never told.|他声称从没人告诉过他。\naccompany|v.陪伴|ac+company(同伴)→作伴|Want me to accompany you there?|要我陪你去吗？\naccomplish|v.完成，达到目的|ac+compl(完成)|We accomplished a lot today.|我们今天完成了不少事。\naccord|v.一致，符合|ac+cord(心)→心心相印|His actions accord with his words.|他言行一致。\naccording to|按照||According to the news, it'll rain.|新闻说要下雨。\naccount|n.账目 v.报账；解释|ac+count(计算)|Can you account for the missing money?|你能解释那笔钱去哪了吗？\naccumulate|v.积累|ac+cumul(堆)→堆起来|Dust accumulates fast on shelves.|架子上灰尘积得很快。\ncurious|a.好奇的, 求知的, 古怪的|cur(关心)+ious|I'm just curious, that's all.|我就是好奇而已。\nsecure|a.(from,against)安全的v.得到|se(离开)+cure(担心)→无忧|Make sure the door is secure.|确认门锁好了。\nsecurity|n.安全(感),防御(物),保证(人)|secure+ity|Security is tight at the airport.|机场安检很严。\naccuse|v.谴责|ac(向)+cuse(理由)→归罪|Are you accusing me of lying?|你是在指责我撒谎吗？\naccustomed|a.习惯的|ac+custom(习惯)+ed|I'm accustomed to getting up early.|我习惯早起了。\nused|a.用旧了的，习惯于…；过去惯/经常|us(用)+ed|I'm used to the noise now.|我现在习惯这噪音了。\nachieve|v.成就，成功|a+chieve(头)→达到顶头|You can achieve anything you want.|你想要的都能实现。\nacknowledge|v.承认|ac+knowledge(知道)→承认知道|He wouldn't acknowledge his mistake.|他不肯承认错误。\nacquire|v.获得，学到|ac(去)+quire(寻求)→求得|It takes years to acquire this skill.|这技能要练好几年。\nacquaintance|n.熟人，熟事|acquaint(使认识)+ance|He's just an acquaintance, not a friend.|他只是熟人，不算朋友。\nacquisition|n.获得；获得物|ac+quisit(寻求)→求得之物|The company announced a big acquisition.|公司宣布了一笔大收购。\nactive|a.积极的，活跃的|act(行动)+ive|Stay active and you'll feel better.|多活动活动你会舒服些。\ntransaction|n.办理,处理;交易|trans(跨越)+act(做)→跨方交易|The transaction went through smoothly.|这笔交易顺利完成了。\nagenda|n.议事日程，待办事项|ag(做)+enda→待做事项|What's on the agenda today?|今天日程上有什么？\nadapt|v.使适应，改编|ad(去)+apt(适合)|Kids adapt to new schools quickly.|小孩适应新学校很快。\nproperty|n.财产;性质,特性|proper(自己的)+ty|This is private property, sorry.|抱歉，这是私人地产。\naddress|n.地址，演讲 v.处理，解决|ad+dress(引导)→指向处理|We need to address this issue now.|我们得马上处理这个问题。\nadequate|a.足够的，相当的|ad+equ(相等)→够得上|The salary is adequate, not great.|工资够用，但不算高。\nequipment|n.设备,装置;才能|equip(装备)+ment|All the equipment is brand new.|所有设备都是全新的。\nequivalent|a.(to)相等的n.相等物|equi(相等)+val(价值)|A mile is equivalent to 1.6 kilometers.|一英里等于1.6公里。\nadhere|v.黏贴；坚持|ad(去)+here(黏)→黏上去|Please adhere to the schedule.|请严格按日程来。\ncoherent|a.一致的，协调的；(话语等)条理清楚的|co(共同)+her(黏)→黏在一起→连贯|Her argument was clear and coherent.|她的论点清楚又连贯。\nconjunction|n.接合，连接；连(接)词|con(共同)+junct(连接)|We worked in conjunction with their team.|我们和他们团队联手干的。\nsubject|n.主题a.隶属的|sub(下)+ject(扔)→扔到下面→从属;主题|Let's change the subject, okay?|咱们换个话题吧？\nobjective|n.目标a.客观的|ob(对着)+ject(扔)→摆在眼前的目标|Our objective is simple: win.|我们的目标很简单：赢。\nadjust|v.调整，使适应，校正|ad+just(正确)→调正|Give me a second to adjust the seat.|等我调一下座椅。\nadministration|n.管理|ad+minister(管理)|She works in hospital administration.|她在医院做行政。\nadmission|n.承认|ad(进)+miss(送)→准进|Admission is free on Mondays.|周一免费入场。\nadopt|v.采纳，收养|ad(去)+opt(选择)→选来用|We adopted a new system last month.|我们上个月启用了新系统。\nadvance|v.前进|adv(向前)+ance|Book early to get the advance price.|早订能拿早鸟价。\nadvantage|n.优势|advant(向前)+age→领先之处|Speaking two languages is a big advantage.|会两门语言是很大的优势。\nanticipate|v.预见，期望|anti(提前)+cip(拿)→提前拿到→预见|We didn't anticipate this problem.|我们没预料到这个问题。\nadvent|n.到来，来临|ad(到)+vent(来)→来临|Everything changed with the advent of smartphones.|智能手机一来，一切都变了。\nconvention|n.大会;惯例;公约|con(共同)+vent(来)→大家来→大会 const WORDS = RAW.split("\n").map((line, i) => {
  const p = line.split("|");
  return { id: i, w: p[0], m: p[1], r: p[2] || "", s: p[3] || "", t: p[4] || "" };
});

// ---------- speech ----------
let voiceCache = null;
function pickVoice() {
  try {
    const vs = window.speechSynthesis.getVoices();
    if (!vs.length) return null;
    voiceCache =
      vs.find((v) => v.lang === "en-US" && /Google|Samantha|Natural/i.test(v.name)) ||
      vs.find((v) => v.lang === "en-US") ||
      vs.find((v) => v.lang && v.lang.startsWith("en"));
    return voiceCache;
  } catch (e) {
    return null;
  }
}
function speak(text, rate) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate || 0.95;
    const v = voiceCache || pickVoice();
    if (v) u.voice = v;
    synth.speak(u);
  } catch (e) {}
}

// ---------- storage ----------
const KEY = "mba-vocab-v1";
let memFallback = null;
async function loadProgress() {
  try {
    const r = await window.storage.get(KEY);
    if (r && r.value) return JSON.parse(r.value);
  } catch (e) {}
  return memFallback;
}
async function saveProgress(data) {
  memFallback = data;
  try {
    await window.storage.set(KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false;
  }
}
const emptyProgress = () => ({ s: {}, sessions: 0, auto: true });

function wordState(prog, id) {
  const rec = prog.s[id];
  if (!rec) return "new";
  if (rec[0] >= 3) return "mastered";
  if (rec[2] > 0 || rec[0] === 0) return "hard";
  return "learning";
}

function buildSession(prog, size, onlyHard) {
  const pool = WORDS.filter((w) => {
    const st = wordState(prog, w.id);
    if (st === "mastered") return false;
    if (onlyHard) return st === "hard" && prog.s[w.id];
    return true;
  });
  const tier = (w) => {
    const st = wordState(prog, w.id);
    return st === "hard" ? 0 : st === "learning" ? 1 : 2;
  };
  const shuffled = [...pool]
    .map((w) => [Math.random(), w])
    .sort((a, b) => a[0] - b[0])
    .map((x) => x[1])
    .sort((a, b) => tier(a) - tier(b));
  const take = shuffled.slice(0, size);
  return take
    .map((w) => [Math.random() + tier(w) * 0.15, w])
    .sort((a, b) => a[0] - b[0])
    .map((x) => x[1]);
}



function Ring({ running, resetKey }) {
  const [t, setT] = useState(0);
  const raf = useRef();
  useEffect(() => {
    setT(0);
    if (!running) return;
    const start = performance.now();
    const tick = (now) => {
      const el = (now - start) / 1000;
      setT(el);
      if (el < 3.2) raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [resetKey, running]);
  const frac = Math.min(t / 2.5, 1);
  const R = 17,
    C = 2 * Math.PI * R;
  const over = t > 2.5;
  return (
    <svg width="44" height="44" viewBox="0 0 44 44" style={{ display: "block" }}>
      <circle cx="22" cy="22" r={R} fill="none" stroke="var(--line)" strokeWidth="3" />
      <circle cx="22" cy="22" r={R} fill="none"
        stroke={over ? "var(--amber)" : "var(--accent)"} strokeWidth="3"
        strokeDasharray={C} strokeDashoffset={C * (1 - frac)}
        strokeLinecap="round" transform="rotate(-90 22 22)" />
      <text x="22" y="26" textAnchor="middle" fontSize="11"
        fill={over ? "var(--amber)" : "var(--dim)"} fontFamily="var(--mono)">
        {t.toFixed(1)}
      </text>
    </svg>
  );
}

function Speaker({ onClick, size, dim }) {
  return (
    <button className="vq-btn" onClick={onClick} aria-label="播放发音"
      style={{
        background: dim ? "transparent" : "var(--line)", color: dim ? "var(--dim)" : "var(--ink)",
        borderRadius: 999, width: size || 40, height: size || 40, display: "inline-flex",
        alignItems: "center", justifyContent: "center", flexShrink: 0,
        border: dim ? "1px solid var(--line)" : "none", fontSize: (size || 40) * 0.45,
      }}>
      🔊
    </button>
  );
}

function App() {
  const [screen, setScreen] = useState("loading");
  const [prog, setProg] = useState(emptyProgress());
  const [persistOk, setPersistOk] = useState(true);
  const [sessSize, setSessSize] = useState(30);

  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [sessStats, setSessStats] = useState({ know: 0, fuzzy: 0, no: 0, slow: 0 });
  const shownAt = useRef(0);
  const gradesSinceSave = useRef(0);
  const progRef = useRef(prog);
  progRef.current = prog;

  useEffect(() => {
    (async () => {
      const p = await loadProgress();
      if (p) setProg({ auto: true, ...p });
      else {
        const ok = await saveProgress(emptyProgress());
        setPersistOk(ok);
      }
      setScreen("home");
    })();
    try {
      window.speechSynthesis.onvoiceschanged = pickVoice;
      pickVoice();
    } catch (e) {}
  }, []);

  // auto-pronounce word when a new card appears
  useEffect(() => {
    if (screen === "drill" && prog.auto && queue[idx]) {
      speak(queue[idx].w, 0.9);
    }
  }, [screen, idx, queue]);

  const counts = useMemo(() => {
    let mastered = 0, hard = 0, learning = 0;
    for (const w of WORDS) {
      const st = wordState(prog, w.id);
      if (st === "mastered") mastered++;
      else if (st === "hard") hard++;
      else if (st === "learning") learning++;
    }
    return { mastered, hard, learning, fresh: 632 - mastered - hard - learning };
  }, [prog]);

  const startSession = (onlyHard) => {
    const q = buildSession(prog, sessSize, onlyHard);
    if (q.length === 0) return;
    setQueue(q);
    setIdx(0);
    setRevealed(false);
    setSessStats({ know: 0, fuzzy: 0, no: 0, slow: 0 });
    shownAt.current = performance.now();
    setScreen("drill");
  };

  const toggleAuto = () => {
    const next = { ...progRef.current, auto: !progRef.current.auto };
    setProg(next);
    saveProgress(next);
  };

  const reveal = () => {
    if (!revealed) setRevealed(true);
  };

  const grade = useCallback(
    (g) => {
      const word = queue[idx];
      const elapsed = (performance.now() - shownAt.current) / 1000;
      const slow = elapsed > 3.2;
      const next = { ...progRef.current, s: { ...progRef.current.s } };
      const rec = next.s[word.id] ? [...next.s[word.id]] : [0, 0, 0];
      rec[1] += 1;
      if (g === "know") rec[0] = rec[0] + 1;
      else if (g === "fuzzy") rec[0] = Math.min(rec[0], 1);
      else {
        rec[0] = 0;
        rec[2] += 1;
      }
      next.s[word.id] = rec;
      setProg(next);
      setSessStats((s) => ({
        ...s,
        [g === "know" ? "know" : g === "fuzzy" ? "fuzzy" : "no"]:
          s[g === "know" ? "know" : g === "fuzzy" ? "fuzzy" : "no"] + 1,
        slow: s.slow + (g === "know" && slow ? 1 : 0),
      }));

      let newQueue = queue;
      if (g !== "know") {
        newQueue = [...queue];
        const insertAt = Math.min(idx + 6, newQueue.length);
        const aheadCount = newQueue.slice(idx + 1).filter((w) => w.id === word.id).length;
        if (aheadCount === 0) newQueue.splice(insertAt, 0, word);
        setQueue(newQueue);
      }

      gradesSinceSave.current++;
      if (gradesSinceSave.current >= 6) {
        gradesSinceSave.current = 0;
        saveProgress(next).then((ok) => setPersistOk(ok));
      }

      if (idx + 1 >= newQueue.length) {
        const done = { ...next, sessions: next.sessions + 1 };
        setProg(done);
        saveProgress(done).then((ok) => setPersistOk(ok));
        setScreen("done");
      } else {
        setIdx(idx + 1);
        setRevealed(false);
        shownAt.current = performance.now();
      }
    },
    [queue, idx]
  );

  const exitDrill = () => {
    saveProgress(progRef.current).then((ok) => setPersistOk(ok));
    setScreen("home");
  };

  const css = `
    :root{
      --bg:#12151b; --card:#1b2029; --line:#2b3240; --ink:#f0ede4; --dim:#8b93a3;
      --accent:#8fb4ff; --green:#5fce8a; --amber:#e8b45a; --rose:#e87a7a;
      --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
      --serif:Georgia,'Times New Roman','Songti SC',serif;
    }
    .vq-root{min-height:100vh;background:var(--bg);color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif;
      display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:0 16px 24px;box-sizing:border-box;}
    .vq-btn{border:none;border-radius:14px;cursor:pointer;font-family:inherit;
      transition:transform .06s ease, filter .15s ease;}
    .vq-btn:active{transform:scale(.97)}
    .vq-chip{padding:7px 14px;border-radius:999px;background:transparent;color:var(--dim);
      border:1px solid var(--line);font-size:14px;}
    .vq-chip.on{background:var(--accent);color:#0e1116;border-color:var(--accent);font-weight:600;}
    .fadein{animation:vqf .18s ease}
    @keyframes vqf{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){.fadein{animation:none}}
  `;

  const dot = (st) => ({
    display: "inline-block", width: 7, height: 7, borderRadius: 4, marginRight: 10, flexShrink: 0,
    background:
      st === "mastered" ? "var(--green)" : st === "hard" ? "var(--rose)"
      : st === "learning" ? "var(--amber)" : "var(--line)",
  });

  if (screen === "loading")
    return (
      <div className="vq-root" style={{ justifyContent: "center", alignItems: "center" }}>
        <style>{css}</style>
        <span style={{ color: "var(--dim)" }}>载入进度…</span>
      </div>
    );

  if (screen === "home") {
    return (
      <div className="vq-root fadein">
        <style>{css}</style>
        <header style={{ padding: "28px 4px 6px" }}>
          <div style={{ fontFamily: "var(--mono)", fontSize: 12, letterSpacing: 2, color: "var(--dim)" }}>
            MBA · 核心词 632 · 识别训练
          </div>
          <h1 style={{ fontFamily: "var(--serif)", fontSize: 34, margin: "10px 0 0", fontWeight: 600 }}>
            看到 · 反应 · 过
          </h1>
        </header>

        <div style={{ background: "var(--card)", borderRadius: 18, padding: "18px 20px",
          margin: "18px 0 10px", border: "1px solid var(--line)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <span style={{ fontSize: 15, color: "var(--dim)" }}>已掌握</span>
            <span style={{ fontFamily: "var(--mono)", fontSize: 26 }}>
              {counts.mastered}
              <span style={{ fontSize: 14, color: "var(--dim)" }}> / 632</span>
            </span>
          </div>
          <div style={{ height: 8, background: "var(--line)", borderRadius: 4, marginTop: 12, overflow: "hidden", display: "flex" }}>
            <div style={{ width: `${(counts.mastered / 632) * 100}%`, background: "var(--green)" }} />
            <div style={{ width: `${(counts.learning / 632) * 100}%`, background: "var(--amber)" }} />
            <div style={{ width: `${(counts.hard / 632) * 100}%`, background: "var(--rose)" }} />
          </div>
          <div style={{ display: "flex", gap: 14, marginTop: 10, fontSize: 12.5, color: "var(--dim)", flexWrap: "wrap" }}>
            <span><i style={dot("mastered")} />掌握 {counts.mastered}</span>
            <span><i style={dot("learning")} />在学 {counts.learning}</span>
            <span><i style={dot("hard")} />生词 {counts.hard}</span>
            <span><i style={dot("new")} />未刷 {counts.fresh}</span>
          </div>
        </div>

        {!persistOk && (
          <div style={{ fontSize: 12.5, color: "var(--amber)", margin: "2px 4px 8px" }}>
            存储不可用，进度仅本次会话有效。
          </div>
        )}

        <div style={{ display: "flex", gap: 8, margin: "14px 4px 8px", alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontSize: 13.5, color: "var(--dim)", marginRight: 4 }}>每组</span>
          {[20, 30, 50].map((n) => (
            <button key={n} className={`vq-btn vq-chip ${sessSize === n ? "on" : ""}`} onClick={() => setSessSize(n)}>
              {n} 词
            </button>
          ))}
          <button className={`vq-btn vq-chip ${prog.auto ? "on" : ""}`} onClick={toggleAuto} style={{ marginLeft: "auto" }}>
            {prog.auto ? "🔊 自动发音" : "🔇 发音关"}
          </button>
        </div>

        <button className="vq-btn" onClick={() => startSession(false)}
          style={{ background: "var(--accent)", color: "#0e1116", fontSize: 18, fontWeight: 700,
            padding: "17px", borderRadius: 16, marginTop: 8 }}>
          开始刷词
        </button>
        <button className="vq-btn" onClick={() => startSession(true)} disabled={counts.hard === 0}
          style={{ background: "var(--card)", color: counts.hard ? "var(--rose)" : "var(--dim)",
            border: "1px solid var(--line)", fontSize: 16, fontWeight: 600,
            padding: "14px", borderRadius: 16, marginTop: 10, opacity: counts.hard ? 1 : 0.5 }}>
          只刷生词（{counts.hard}）
        </button>
        <button className="vq-btn" onClick={() => setScreen("list")}
          style={{ background: "transparent", color: "var(--dim)", fontSize: 15,
            padding: "13px", borderRadius: 16, marginTop: 6, border: "1px solid var(--line)" }}>
          浏览词表
        </button>

        <p style={{ fontSize: 12.5, color: "var(--dim)", lineHeight: 1.7, margin: "18px 4px 0" }}>
          规则：单词出现（自动读音），2.5 秒内心里说出意思，点卡片对答案——释义、词根、口语例句一起给你。连对 3 次算掌握；"模糊/不认识"的词几张卡后再次出现。点例句旁的 🔊 跟读，正好练口语。
        </p>
      </div>
    );
  }

  if (screen === "drill") {
    const word = queue[idx];
    const st = wordState(prog, word.id);
    return (
      <div className="vq-root" style={{ height: "100vh", overflow: "hidden" }}>
        <style>{css}</style>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 2px 8px" }}>
          <button className="vq-btn" onClick={exitDrill} style={{ background: "none", color: "var(--dim)", fontSize: 14, padding: 6 }}>
            ← 退出
          </button>
          <span style={{ fontFamily: "var(--mono)", fontSize: 13, color: "var(--dim)" }}>
            {idx + 1} / {queue.length}
          </span>
          <Ring running={!revealed} resetKey={`${idx}-${word.id}`} />
        </div>
        <div style={{ height: 3, background: "var(--line)", borderRadius: 2, marginBottom: 8 }}>
          <div style={{ height: "100%", width: `${(idx / queue.length) * 100}%`, background: "var(--accent)", borderRadius: 2, transition: "width .2s" }} />
        </div>

        <div key={`${idx}-${word.id}`} className="fadein" onClick={reveal}
          style={{ flex: 1, background: "var(--card)", border: "1px solid var(--line)", borderRadius: 20,
            display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center",
            padding: "20px 18px", cursor: revealed ? "default" : "pointer", position: "relative",
            minHeight: 0, overflowY: "auto" }}>
          {st !== "new" && (
            <span style={{ position: "absolute", top: 14, left: 16, fontSize: 11.5, color: "var(--dim)" }}>
              <i style={dot(st)} />
              {st === "hard" ? "上次没记住" : st === "learning" ? "在学" : ""}
            </span>
          )}
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", justifyContent: "center" }}>
            <div style={{ fontFamily: "var(--serif)", fontSize: word.w.length > 12 ? 32 : 40, fontWeight: 600, textAlign: "center", wordBreak: "break-word" }}>
              {word.w}
            </div>
            <Speaker size={38} onClick={(e) => { e.stopPropagation(); speak(word.w, 0.9); }} />
          </div>

          {revealed ? (
            <div className="fadein" style={{ marginTop: 18, width: "100%", maxWidth: 420 }}>
              <div style={{ fontSize: 18, lineHeight: 1.55, textAlign: "center" }}>{word.m}</div>
              {word.r && (
                <div style={{ marginTop: 14, fontSize: 13.5, color: "var(--accent)", textAlign: "center",
                  background: "rgba(143,180,255,.08)", border: "1px solid rgba(143,180,255,.25)",
                  borderRadius: 10, padding: "8px 12px" }}>
                  {word.r}
                </div>
              )}
              {word.s && (
                <div style={{ marginTop: 12, background: "rgba(255,255,255,.04)", border: "1px solid var(--line)",
                  borderRadius: 12, padding: "12px 14px" }}
                  onClick={(e) => e.stopPropagation()}>
                  <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
                    <Speaker size={32} dim onClick={() => speak(word.s, 0.88)} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 15.5, lineHeight: 1.5, fontStyle: "italic" }}>{word.s}</div>
                      <div style={{ fontSize: 13, color: "var(--dim)", marginTop: 4 }}>{word.t}</div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div style={{ marginTop: 24, fontSize: 13.5, color: "var(--dim)" }}>心里说出意思 → 点卡片对答案</div>
          )}
        </div>

        <div style={{ display: "flex", gap: 10, marginTop: 14, minHeight: 62 }}>
          {revealed ? (
            <>
              <button className="vq-btn" onClick={() => grade("no")}
                style={{ flex: 1, background: "rgba(232,122,122,.14)", color: "var(--rose)", border: "1px solid rgba(232,122,122,.4)", fontSize: 16, fontWeight: 700, padding: "16px 0", borderRadius: 15 }}>
                不认识
              </button>
              <button className="vq-btn" onClick={() => grade("fuzzy")}
                style={{ flex: 1, background: "rgba(232,180,90,.13)", color: "var(--amber)", border: "1px solid rgba(232,180,90,.4)", fontSize: 16, fontWeight: 700, padding: "16px 0", borderRadius: 15 }}>
                模糊
              </button>
              <button className="vq-btn" onClick={() => grade("know")}
                style={{ flex: 1.2, background: "var(--green)", color: "#0e1116", fontSize: 16, fontWeight: 700, padding: "16px 0", borderRadius: 15 }}>
                认识
              </button>
            </>
          ) : (
            <button className="vq-btn" onClick={reveal}
              style={{ flex: 1, background: "var(--line)", color: "var(--ink)", fontSize: 16, fontWeight: 600, padding: "16px 0", borderRadius: 15 }}>
              显示释义
            </button>
          )}
        </div>
      </div>
    );
  }

  if (screen === "done") {
    const total = sessStats.know + sessStats.fuzzy + sessStats.no;
    return (
      <div className="vq-root fadein" style={{ justifyContent: "center" }}>
        <style>{css}</style>
        <h2 style={{ fontFamily: "var(--serif)", fontSize: 30, margin: "0 0 6px" }}>这组完成</h2>
        <p style={{ color: "var(--dim)", fontSize: 14, margin: "0 0 22px" }}>共过卡 {total} 次 · 累计掌握 {counts.mastered}/632</p>
        <div style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 18, padding: "18px 20px", fontSize: 15.5, lineHeight: 2.1 }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}><span style={{ color: "var(--green)" }}>认识</span><b>{sessStats.know}</b></div>
          <div style={{ display: "flex", justifyContent: "space-between" }}><span style={{ color: "var(--amber)" }}>模糊</span><b>{sessStats.fuzzy}</b></div>
          <div style={{ display: "flex", justifyContent: "space-between" }}><span style={{ color: "var(--rose)" }}>不认识</span><b>{sessStats.no}</b></div>
          {sessStats.slow > 0 && (
            <div style={{ display: "flex", justifyContent: "space-between", color: "var(--dim)", fontSize: 13.5 }}>
              <span>认识但反应超 3 秒</span><span>{sessStats.slow}</span>
            </div>
          )}
        </div>
        <button className="vq-btn" onClick={() => startSession(false)}
          style={{ background: "var(--accent)", color: "#0e1116", fontSize: 17, fontWeight: 700, padding: "16px", borderRadius: 16, marginTop: 20 }}>
          再来一组
        </button>
        <button className="vq-btn" onClick={() => setScreen("home")}
          style={{ background: "transparent", color: "var(--dim)", border: "1px solid var(--line)", fontSize: 15, padding: "13px", borderRadius: 16, marginTop: 10 }}>
          返回首页
        </button>
      </div>
    );
  }

  if (screen === "list") {
    return <ListView prog={prog} dot={dot} css={css} onBack={() => setScreen("home")} />;
  }
  return null;
}

function ListView({ prog, dot, css, onBack }) {
  const [open, setOpen] = useState(null);
  const [filter, setFilter] = useState("all");
  const rows = WORDS.filter((w) => {
    if (filter === "all") return true;
    return wordState(prog, w.id) === filter;
  });
  return (
    <div className="vq-root fadein">
      <style>{css}</style>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "16px 0 10px", position: "sticky", top: 0, background: "var(--bg)", zIndex: 2, flexWrap: "wrap" }}>
        <button className="vq-btn" onClick={onBack} style={{ background: "none", color: "var(--dim)", fontSize: 14, padding: 6 }}>← 返回</button>
        {[["all", "全部"], ["hard", "生词"], ["learning", "在学"], ["mastered", "掌握"]].map(([k, label]) => (
          <button key={k} className={`vq-btn vq-chip ${filter === k ? "on" : ""}`} style={{ padding: "5px 11px", fontSize: 13 }} onClick={() => setFilter(k)}>
            {label}
          </button>
        ))}
      </div>
      <div style={{ fontSize: 12.5, color: "var(--dim)", margin: "0 2px 8px" }}>{rows.length} 词 · 点一行看释义、词根和例句</div>
      <div>
        {rows.map((w) => {
          const st = wordState(prog, w.id);
          const isOpen = open === w.id;
          return (
            <div key={w.id} style={{ padding: "11px 6px", borderBottom: "1px solid var(--line)" }}>
              <div style={{ display: "flex", alignItems: "center", cursor: "pointer" }} onClick={() => setOpen(isOpen ? null : w.id)}>
                <i style={dot(st)} />
                <span style={{ fontFamily: "var(--serif)", fontSize: 17.5, flex: 1 }}>{w.w}</span>
                {isOpen && <Speaker size={30} dim onClick={(e) => { e.stopPropagation(); speak(w.w, 0.9); }} />}
              </div>
              {isOpen && (
                <div className="fadein" style={{ margin: "8px 0 2px 17px" }}>
                  <div style={{ fontSize: 14.5, lineHeight: 1.55 }}>{w.m}</div>
                  {w.r && <div style={{ fontSize: 13, color: "var(--accent)", marginTop: 5 }}>{w.r}</div>}
                  {w.s && (
                    <div style={{ display: "flex", gap: 8, alignItems: "flex-start", marginTop: 7 }}>
                      <Speaker size={26} dim onClick={() => speak(w.s, 0.88)} />
                      <div>
                        <div style={{ fontSize: 13.5, fontStyle: "italic", lineHeight: 1.5 }}>{w.s}</div>
                        <div style={{ fontSize: 12.5, color: "var(--dim)", marginTop: 2 }}>{w.t}</div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    const { code } = Babel.transform(document.getElementById('app-source').textContent, {
      presets: [['env'], ['react', { runtime: 'classic' }]]
    });
    new Function(code)();
  </script>
</body>
