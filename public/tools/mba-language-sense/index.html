<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="canonical" href="https://songchaoyang.com/tools/mba-language-sense/" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBA 语感训练器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3248;
    --accent: #6c8fff;
    --accent2: #a78bfa;
    --text: #e8eaf0;
    --muted: #7880a0;
    --subject: #60d0a0;
    --verb: #ff8c69;
    --object: #7eb8ff;
    --vocab: #f0c060;
    --playing: #6c8fff22;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
    margin-bottom: 6px;
  }

  .header p {
    font-size: 13px;
    color: var(--muted);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
  }

  .controls-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .speed-group {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .speed-btn {
    padding: 8px 16px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    border-right: 1px solid var(--border);
  }

  .speed-btn:last-child { border-right: none; }

  .speed-btn.active {
    background: var(--accent);
    color: #fff;
    font-weight: 500;
  }

  .speed-btn:hover:not(.active) {
    background: var(--surface2);
    color: var(--text);
  }

  .ctrl-btn {
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover { background: var(--surface2); border-color: var(--accent); }

  .ctrl-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }

  .ctrl-btn.primary:hover { opacity: 0.88; }

  .progress-bar {
    width: 100%;
    max-width: 680px;
    margin: 0 auto 28px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .sentence-list {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sentence-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .sentence-card:hover { border-color: var(--accent); background: var(--surface2); }

  .sentence-card.playing {
    border-color: var(--accent);
    background: var(--playing);
    box-shadow: 0 0 0 1px var(--accent)44;
  }

  .sentence-card.done {
    opacity: 0.55;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .card-num {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    min-width: 24px;
    padding-top: 3px;
  }

  .card-en {
    flex: 1;
    font-size: 16px;
    line-height: 1.65;
    letter-spacing: 0.01em;
    font-weight: 400;
  }

  .card-actions {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .play-icon {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    font-size: 12px;
  }

  .play-icon:hover { border-color: var(--accent); background: var(--accent)22; }
  .play-icon.active { background: var(--accent); border-color: var(--accent); }

  .card-zh {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    font-family: 'Noto Serif SC', serif;
    line-height: 1.6;
    display: none;
  }

  .card-zh.show { display: block; }

  .toggle-zh {
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    font-family: 'Inter', sans-serif;
    transition: all 0.12s;
    flex-shrink: 0;
  }

  .toggle-zh:hover { color: var(--text); border-color: var(--muted); }

  /* syntax colors */
  .s { color: var(--subject); font-weight: 500; }
  .v { color: var(--verb); font-weight: 500; }
  .o { color: var(--object); font-weight: 500; }
  .w { color: var(--vocab); border-bottom: 1px dashed var(--vocab)88; cursor: help; }

  .repeat-badge {
    position: absolute;
    top: 10px; right: 10px;
    font-size: 10px;
    color: var(--accent);
    background: var(--accent)18;
    padding: 2px 6px;
    border-radius: 4px;
    display: none;
  }

  .repeat-badge.show { display: block; }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }

  .tag-year {
    font-size: 10px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 1px 7px;
    border-radius: 3px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .tag-diff {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 3px;
    font-weight: 500;
  }

  .tag-diff.d1 { background: #1e3a2a; color: #60d0a0; border: 1px solid #2a5a3a; }
  .tag-diff.d2 { background: #2a2a1a; color: #f0c060; border: 1px solid #4a4a1a; }
  .tag-diff.d3 { background: #2a1a1a; color: #ff8c69; border: 1px solid #4a2a1a; }

  .bottom-status {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
  }

  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 20px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .waveform.active { opacity: 1; }

  .wave-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: wave 0.8s ease-in-out infinite;
  }

  .wave-bar:nth-child(2) { animation-delay: 0.15s; }
  .wave-bar:nth-child(3) { animation-delay: 0.3s; }
  .wave-bar:nth-child(4) { animation-delay: 0.15s; }

  @keyframes wave {
    0%, 100% { height: 4px; }
    50% { height: 16px; }
  }

  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    margin-right: 6px;
    vertical-align: middle;
  }

  .status-dot.speaking { background: var(--accent); animation: pulse 1s infinite; }

  .site-back{position:fixed;z-index:9999;left:14px;top:14px;padding:8px 12px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;text-decoration:none;font-size:13px;backdrop-filter:blur(8px)}

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<a class="site-back" href="/tools/">← 工具中心</a>

<div class="header">
  <h1>MBA 语感训练器</h1>
  <p>听 → 感知节奏 → 不翻译 · 42句考研真题精选（2015–2023）</p>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--subject)"></div>主语 Subject</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--verb)"></div>谓语 Verb</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--object)"></div>宾语 Object</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--vocab)"></div>考研词汇</div>
</div>

<div class="controls-bar">
  <div class="speed-group">
    <button class="speed-btn" onclick="setSpeed(0.8)">0.8×</button>
    <button class="speed-btn active" onclick="setSpeed(1.0)">1.0×</button>
    <button class="speed-btn" onclick="setSpeed(1.2)">1.2×</button>
  </div>
  <button class="ctrl-btn" onclick="playAll()">▶ 全部播放</button>
  <button class="ctrl-btn" onclick="stopAll()">■ 停止</button>
  <div class="waveform" id="waveform">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>
</div>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>

<div class="sentence-list" id="sentenceList"></div>

<div class="bottom-status" id="statusBar">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText">点击句子播放，或使用「全部播放」连续收听</span>
</div>

<script>
const sentences = [

  // ── 我的20句（无年份标注）──────────────────────────────
  { diff:1, year:'',
    en: `<span class="s">Companies</span> <span class="v">need</span> <span class="o"><span class="w" title="考研词汇: 合格的，胜任的">qualified</span> employees</span> to <span class="v">achieve</span> their <span class="w" title="考研词汇: 目标">goals</span>.`,
    raw: `Companies need qualified employees to achieve their goals.`,
    zh: `企业需要合格的员工来实现目标。` },
  { diff:1, year:'',
    en: `<span class="s">The <span class="w" title="考研词汇: 经济">economy</span></span> <span class="v">has grown</span> <span class="w" title="考研词汇: 稳定地">steadily</span> over the past decade.`,
    raw: `The economy has grown steadily over the past decade.`,

  { diff:1, year:'',
    en: `<span class="s">Many <span class="w" title="考研词汇: 消费者">consumers</span></span> <span class="v">prefer</span> <span class="o">products that offer both quality and value</span>.`,

    zh: `许多消费者倾向于选择质量与价值兼具的产品。` },
  { diff:1, year:'',
    en: `<span class="s">The <span class="w" title="考研词汇: 管理层">management</span></span> <span class="v">decided</span> to <span class="v"><span class="w" title="考研词汇: 减少">reduce</span></span> <span class="o">costs by cutting unnecessary spending</span>.`,

    zh: `管理层决定通过削减不必要的开支来降低成本。` },
  { diff:1, year:'',
    en: `<span class="s">Effective <span class="w" title="考研词汇: 沟通">communication</span></span> <span class="v">is</span> <span class="o">essential for team success</span>.`,
    raw: `Effective communication is essential for team success.`,
    zh: `有效的沟通对团队成功至关重要。` },
  { diff:1, year:'',
    en: `<span class="s">The new <span class="w" title="考研词汇: 政策">policy</span></span> <span class="v">aims</span> to <span class="v">improve</span> <span class="o">working conditions for all employees</span>.`,
    raw: `The new policy aims to improve working conditions for all employees.`,
    zh: `新政策旨在改善所有员工的工作条件。` },
  { diff:1, year:'',
    en: `<span class="s">Global <span class="w" title="考研词汇: 贸易">trade</span></span> <span class="v">has increased</span> <span class="w" title="考研词汇: 显著地">significantly</span> in recent years.`,
    raw: `Global trade has increased significantly in recent years.`,

  { diff:1, year:'',
    en: `<span class="s">The <span class="w" title="考研词汇: 研究">research</span></span> <span class="v">shows</span> that <span class="o"><span class="w" title="考研词汇: 满意度">satisfaction</span> at work <span class="v">leads</span> to higher <span class="w" title="考研词汇: 生产力">productivity</span></span>.`,

    en: `<span class="s">Most <span class="w" title="考研词汇: 组织">organizations</span></span> <span class="v">rely on</span> <span class="o">data to make better decisions</span>.`,

  { diff:1, year:'',
    en: `<span class="s">A strong <span class="w" title="考研词汇: 领导力">leadership</span> team</span> <span class="v">can guide</span> <span class="o">a company through difficult times</span>.`,

    zh: `强大的领导团队能带领公司渡过困难时期。` },
  { diff:1, year:'',
    en: `<span class="s"><span class="w" title="考研词汇: 创新">Innovation</span></span> <span class="v">drives</span> <span class="o">growth in competitive markets</span>.`,

  { diff:1, year:'',
    en: `<span class="s">The <span class="w" title="考研词汇: 报告">report</span></span> <span class="v">revealed</span> that <span class="o">profits <span class="w" title="考研词汇: 下降">declined</span> in the third quarter</span>.`,

  { diff:1, year:'',
    en: `<span class="s">Employees</span> who <span class="v">receive</span> <span class="o">regular <span class="w" title="考研词汇: 反馈">feedback</span></span> <span class="v">tend to perform</span> better.`,

    zh: `经常获得反馈的员工往往表现更好。` },
  { diff:1, year:'',
    en: `<span class="s">The <span class="w" title="考研词汇: 市场">market</span></span> <span class="v">responded</span> <span class="w" title="考研词汇: 积极地">positively</span> to the new product <span class="w" title="考研词汇: 发布">launch</span>.`,

let currentSpeed = 1.0;
let currentUtterance = null;
let playingIndex = -1;
let autoPlayQueue = [];
let isAutoPlaying = false;
let synth = window.speechSynthesis;

function setSpeed(s) {
  currentSpeed = s;
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.classList.toggle('active', parseFloat(btn.textContent) === s);
  });
  if (currentUtterance && synth.speaking) {
    stopAll();
  }
}

function buildCards() {
  const list = document.getElementById('sentenceList');
  list.innerHTML = '';
  sentences.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'sentence-card';
    card.id = `card-${i}`;
    const diffLabel = s.diff === 1 ? '简单' : s.diff === 2 ? '中等' : '困难';
    const diffClass = s.diff === 1 ? 'd1' : s.diff === 2 ? 'd2' : 'd3';
    card.innerHTML = `
      <div class="card-top">
        <span class="card-num">${String(i+1).padStart(2,'0')}</span>
        <div style="flex:1">
          ${s.year ? `<div class="card-meta"><span class="tag-year">${s.year}</span><span class="tag-diff ${diffClass}">${diffLabel}</span></div>` : ''}
          <div class="card-en">${s.en}</div>
        </div>
        <div class="card-actions">
          <button class="toggle-zh" onclick="toggleZh(${i}, event)">中文</button>
          <div class="play-icon" id="playicon-${i}" onclick="playSingle(${i}, event)">▶</div>
        </div>
      </div>
      <div class="card-zh" id="zh-${i}">${s.zh}</div>
    `;
    list.appendChild(card);
  });
}

function toggleZh(i, e) {
  e.stopPropagation();
  const el = document.getElementById(`zh-${i}`);
  el.classList.toggle('show');
}

function setStatus(text, speaking) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').className = 'status-dot' + (speaking ? ' speaking' : '');
  document.getElementById('waveform').classList.toggle('active', speaking);
}

function setCardPlaying(i, playing) {
  if (i < 0) return;
  const card = document.getElementById(`card-${i}`);
  const icon = document.getElementById(`playicon-${i}`);
  if (!card) return;
  card.classList.toggle('playing', playing);
  if (icon) {
    icon.classList.toggle('active', playing);
    icon.textContent = playing ? '■' : '▶';
  }
}

function updateProgress(i) {
  const pct = sentences.length > 0 ? ((i + 1) / sentences.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function speak(text, onEnd) {
  synth.cancel();
  currentUtterance = new SpeechSynthesisUtterance(text);
  currentUtterance.lang = 'en-US';
  currentUtterance.rate = currentSpeed;
  currentUtterance.pitch = 1.0;

  // pick a good voice if available
  const voices = synth.getVoices();
  const preferred = voices.find(v =>
    v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Daniel'))
  ) || voices.find(v => v.lang.startsWith('en'));
  if (preferred) currentUtterance.voice = preferred;

  currentUtterance.onend = () => { if (onEnd) onEnd(); };
  currentUtterance.onerror = () => { if (onEnd) onEnd(); };
  synth.speak(currentUtterance);
}

function playSingle(i, e) {
  if (e) e.stopPropagation();
  stopAll();
  playingIndex = i;
  setCardPlaying(i, true);
  setStatus(`正在播放第 ${i+1} 句 · ${currentSpeed}×`, true);
  updateProgress(i);

  speak(sentences[i].raw, () => {
    setCardPlaying(i, false);
    playingIndex = -1;
    setStatus('完成', false);
    document.getElementById(`card-${i}`).classList.add('done');
  });
}

function playAll() {
  stopAll();
  isAutoPlaying = true;
  let i = 0;

  function next() {
    if (!isAutoPlaying || i >= sentences.length) {
      setCardPlaying(i-1, false);
      isAutoPlaying = false;
      setStatus('全部播放完成 ✓', false);
      document.getElementById('progressFill').style.width = '100%';
      return;
    }
    if (i > 0) setCardPlaying(i-1, false);
    setCardPlaying(i, true);
    playingIndex = i;
    setStatus(`正在播放第 ${i+1} / ${sentences.length} 句 · ${currentSpeed}×`, true);
    updateProgress(i);

    // scroll into view
    const card = document.getElementById(`card-${i}`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    speak(sentences[i].raw, () => {
      document.getElementById(`card-${i}`)?.classList.add('done');
      i++;
      setTimeout(next, 600); // pause between sentences
    });
  }

  next();
}

function stopAll() {
  synth.cancel();
  isAutoPlaying = false;
  if (playingIndex >= 0) {
    setCardPlaying(playingIndex, false);
    playingIndex = -1;
  }
  setStatus('已停止', false);
  document.getElementById('progressFill').style.width = '0%';
}

// init
buildCards();

// load voices async
if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = () => {};
}

// click card to play
document.getElementById('sentenceList').addEventListener('click', (e) => {
  const card = e.target.closest('.sentence-card');
  if (!card || e.target.classList.contains('toggle-zh') || e.target.classList.contains('play-icon')) return;
  const i = parseInt(card.id.split('-')[1]);
  playSingle(i, null);
});
</script>
