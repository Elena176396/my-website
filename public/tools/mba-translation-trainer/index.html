<title>MBA 英语二 · 回译练习器（AI 批改版）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F7F6F3;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#1A1816;min-height:100vh;padding:20px 16px}
.container{max-width:700px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.header h1{font-size:18px;font-weight:500}
.header p{font-size:12px;color:#6B6560;margin-top:3px}
.key-row{display:flex;gap:8px;align-items:center}
.key-input{font-size:12px;padding:6px 10px;border:0.5px solid #D4D0C8;border-radius:8px;width:200px;background:#fff}
.key-btn{font-size:12px;padding:6px 12px;border:0.5px solid #D4D0C8;border-radius:8px;background:#fff;cursor:pointer}
.key-status{font-size:11px;color:#A09A93;margin-top:4px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:#fff;border:0.5px solid #E8E5DF;border-radius:10px;padding:10px 12px}
.stat-l{font-size:11px;color:#A09A93;margin-bottom:4px}
.stat-v{font-size:20px;font-weight:500}
.filters{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.filter-btn{font-size:12px;padding:5px 14px;border:0.5px solid #D4D0C8;border-radius:20px;background:#fff;cursor:pointer;color:#6B6560}
.filter-btn.active{background:#7B6FA0;color:#fff;border-color:#7B6FA0}
.mode-btn{font-size:12px;padding:5px 14px;border:0.5px solid #D4D0C8;border-radius:20px;background:#fff;cursor:pointer;color:#6B6560}
.mode-btn.active{background:#3A7D6B;color:#fff;border-color:#3A7D6B}
.card{background:#fff;border:0.5px solid #E8E5DF;border-radius:14px;padding:20px;margin-bottom:16px}
.card-meta{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
.b-easy{background:#E8F5E9;color:#2E7D32}
.b-mid{background:#FFF8E1;color:#F57F17}
.b-hard{background:#FFEBEE;color:#C62828}
.b-year{background:#EDE7F6;color:#4527A0}
.b-mode{background:#E3F2FD;color:#1565C0}
.sentence-en{font-size:15px;line-height:1.8;color:#1A1816;margin-bottom:8px;font-style:italic}
.sentence-cn{font-size:14px;line-height:1.7;color:#3A7D6B;margin-bottom:4px}
.label{font-size:11px;color:#A09A93;margin-bottom:6px;margin-top:14px}
textarea{width:100%;border:0.5px solid #D4D0C8;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;height:80px;background:#FAFAF8;line-height:1.6}
textarea:focus{outline:none;border-color:#7B6FA0}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn{padding:8px 20px;border:0.5px solid #D4D0C8;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit}
.btn-primary{background:#7B6FA0;color:#fff;border-color:#7B6FA0}
.btn-primary:hover{background:#6B5F90}
.btn:hover{background:#F0EDE8}
.reveal-box{background:#F7F6F3;border-radius:8px;padding:12px 14px;margin-top:10px;display:none}
.reveal-box.show{display:block}
.reveal-ref{font-size:14px;color:#1A1816;line-height:1.7;margin-bottom:8px}
.reveal-note{font-size:12px;color:#6B6560;line-height:1.6;border-top:0.5px solid #E8E5DF;padding-top:8px;margin-top:8px}

/* AI批改面板 */
.overlay{background:rgba(0,0,0,0.35);border-radius:14px;padding:20px;margin-top:16px;display:none}
.overlay.show{display:block}
.panel{background:#fff;border-radius:12px;padding:20px}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.panel-title{font-size:15px;font-weight:500}
.close-btn{background:none;border:none;cursor:pointer;font-size:22px;color:#A09A93;line-height:1;padding:0}
.score-pill{display:inline-block;padding:4px 16px;border-radius:20px;font-size:13px;font-weight:500;margin-bottom:14px}
.score-high{background:#E8F5E9;color:#2E7D32}
.score-mid{background:#FFF8E1;color:#F57F17}
.score-low{background:#FFEBEE;color:#C62828}
.section{margin-bottom:14px}
.sec-label{font-size:11px;color:#A09A93;letter-spacing:0.04em;margin-bottom:5px}
.sec-body{font-size:13px;color:#1A1816;line-height:1.7}
.diff-item{border-left:2px solid #E8B84B;padding:8px 10px;margin-bottom:8px;border-radius:0}
.diff-orig{font-size:12px;color:#6B6560;margin-bottom:3px}
.diff-analysis{font-size:13px;color:#1A1816}
.memo-box{background:#FFF8E1;border-radius:8px;padding:10px 14px;font-size:13px;color:#1A1816;line-height:1.6}
.meaning-pill{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:500;margin-right:6px}
.m-yes{background:#E8F5E9;color:#2E7D32}
.m-part{background:#FFF8E1;color:#F57F17}
.m-no{background:#FFEBEE;color:#C62828}
.loading{color:#A09A93;font-size:13px;text-align:center;padding:20px 0}

.history-section{margin-top:24px}
.history-title{font-size:13px;color:#6B6560;margin-bottom:10px;font-weight:500}
.history-item{background:#fff;border:0.5px solid #E8E5DF;border-radius:10px;padding:12px 14px;margin-bottom:8px}
.history-meta{display:flex;gap:8px;font-size:11px;color:#A09A93;margin-bottom:5px}
.history-en{font-size:12px;color:#6B6560;font-style:italic;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-score{font-size:13px;font-weight:500;color:#7B6FA0}
.site-back{position:fixed;z-index:9999;left:14px;top:14px;padding:8px 12px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;text-decoration:none;font-size:13px;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<a class="site-back" href="/tools/">← 工具中心</a>
<div class="container">
  <div class="header">
    <div>
      <h1>MBA 英语二 · 回译练习器（AI 批改版）</h1>
      <p>近10年真题翻译句 · 三级难度 · AI批改面板</p>
    </div>
    <div>
      <div class="key-row">
        <input class="key-input" type="password" id="apiKeyInput" placeholder="粘贴 API Key">
        <button class="key-btn" onclick="saveKey()">保存</button>
      </div>
      <div class="key-status" id="keyStatus">未设置 Key（AI批改不可用）</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-l">今日练习</div><div class="stat-v" id="sTodayCount">0</div></div>
    <div class="stat"><div class="stat-l">累计练习</div><div class="stat-v" id="sTotalCount">0</div></div>
    <div class="stat"><div class="stat-l">平均得分</div><div class="stat-v" id="sAvgScore">—</div></div>
    <div class="stat"><div class="stat-l">已练难度</div><div class="stat-v" id="sLevels">—</div></div>
  </div>

  <div class="filters">
    <span style="font-size:12px;color:#6B6560">难度：</span>
    <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
    <button class="filter-btn" onclick="setFilter(1,this)">简单</button>
    <button class="filter-btn" onclick="setFilter(2,this)">中等</button>
    <button class="filter-btn" onclick="setFilter(3,this)">困难</button>
    <span style="font-size:12px;color:#6B6560;margin-left:8px">模式：</span>
    <button class="mode-btn active" id="modeEasy" onclick="setMode('easy')">简单（扩充中心句）</button>
    <button class="mode-btn" id="modeHard" onclick="setMode('hard')">高难度（看中文写英文）</button>
    <button class="filter-btn" style="margin-left:auto" onclick="loadNext()">换一题 →</button>
  </div>

  <div id="mainArea"></div>

  <div class="overlay" id="panelOverlay">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">AI 批改结果</span>
        <button class="close-btn" onclick="closePanel()">×</button>
      </div>
      <div id="panelBody"><div class="loading">批改中…</div></div>
    </div>
  </div>

  <div class="history-section">
    <div class="history-title">练习记录</div>
    <div id="historyList"></div>
  </div>
</div>

   cn:'在当代辩论中，一个普遍但基本上未经审视的假设是：信息的自由流动本质上是有益的，对此类流动的任何限制都是对基本民主价值观的威胁。',

  {id:10,year:2018,diff:3,
   core:'The emergence of social media has created new challenges for privacy and personal identity.',
   en:'The rapid emergence of social media platforms has created unprecedented challenges not only for individual privacy and personal identity but also for the broader social fabric, forcing a fundamental reconsideration of how communities form and maintain cohesion in the digital age.',
   cn:'社交媒体平台的迅速兴起不仅给个人隐私和个人身份认同带来了前所未有的挑战，也给更广泛的社会结构带来了挑战，迫使人们从根本上重新思考数字时代社区如何形成并保持凝聚力。',

  {id:12,year:2019,diff:2,

   cn:'全球经济已变得如此深度相互关联，以至于一个地区的动荡可以迅速蔓延至整个体系，使即便是最强健的经济体也容易受到它们无法完全预料或控制的系统性风险的影响。',
   notes:'主干：economy has become interconnected · so...that结果状语从句 · making分词作结果状语'},
  {id:13,year:2019,diff:3,
   core:'The notion that technological progress automatically leads to human well-being is questionable.',

let currentFilter = 'all';

function checkToday() {

  if (stats.todayDate !== today) { stats.todayDate = today; stats.todayCount = 0; }

function saveKey() {
  const k = document.getElementById('apiKeyInput').value.trim();

function loadKey() {
  const k = localStorage.getItem('tt_apikey');
  document.getElementById('keyStatus').textContent = k ? 'Key 已设置 ✓' : '未设置 Key（AI批改不可用）';
  return k;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  buildFiltered();
  loadNext();
}

function setMode(m) {
  currentMode = m;
  document.getElementById('modeEasy').classList.toggle('active', m === 'easy');
  document.getElementById('modeHard').classList.toggle('active', m === 'hard');
  render();
  closePanel();
}

function buildFiltered() {
  filtered = currentFilter === 'all' ? [...sentences] : sentences.filter(s => s.diff === parseInt(currentFilter));
  currentIdx = Math.floor(Math.random() * filtered.length);
}

function loadNext() {
  if (!filtered.length) buildFiltered();
  currentIdx = (currentIdx + 1) % filtered.length;
  render();
  closePanel();
}

function render() {
  const s = filtered[currentIdx] || sentences[0];
  const diffLabel = ['','简单','中等','困难'][s.diff];
  const diffClass = ['','b-easy','b-mid','b-hard'][s.diff];
  const modeLabel = currentMode === 'easy' ? '简单模式' : '高难度模式';

  let promptHtml = '';
  if (currentMode === 'easy') {
    promptHtml = `<div class="label">英文中心句（扩充至完整句）</div>
    <div class="sentence-en">${s.core}</div>`;
  } else {
    promptHtml = `<div class="label">中文原句（写出对应英文）</div>
    <div class="sentence-cn">${s.cn}</div>`;
  }

  document.getElementById('mainArea').innerHTML = `
    <div class="card">
      <div class="card-meta">
        <span class="badge b-year">${s.year}</span>
        <span class="badge ${diffClass}">${diffLabel}</span>
        <span class="badge b-mode">${modeLabel}</span>
      </div>
      ${promptHtml}
      <div class="label" style="margin-top:14px">你的答案</div>
      <textarea id="studentInput" placeholder="在这里输入你的英文句子…"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="grade()">AI 批改</button>
        <button class="btn" onclick="showRef()">查看参考</button>
        <button class="btn" onclick="loadNext()">换一题 →</button>
      </div>
      <div class="reveal-box" id="revealBox">
        <div class="label">参考译文</div>
        <div class="reveal-ref">${s.en}</div>
        <div class="reveal-note">结构注释：${s.notes}</div>
      </div>
    </div>`;
}

function showRef() {
  const box = document.getElementById('revealBox');
  box.classList.toggle('show');
}

function closePanel() {
  document.getElementById('panelOverlay').classList.remove('show');
}

async function grade() {
  const student = (document.getElementById('studentInput') || {}).value;
  if (!student || !student.trim()) { alert('请先写下你的答案'); return; }
  const key = loadKey();
  if (!key) { alert('请先设置 API Key'); return; }

  const s = filtered[currentIdx] || sentences[0];
  const overlay = document.getElementById('panelOverlay');
  const body = document.getElementById('panelBody');
  overlay.classList.add('show');
  body.innerHTML = '<div class="loading">AI 批改中，请稍候…</div>';

  const isEasy = currentMode === 'easy';
  const systemPrompt = isEasy
    ? `你是MBA英语二回译批改老师。严格只返回如下JSON，不要任何其他文字：
{"score":"85/100","core_gap":"最大问题一句话","diffs":[{"orig":"原句用了X，学生用了Y","analysis":"原因一句话"}],"memo":"最值得记住的一个点"}`
    : `你是MBA英语二回译批改老师。严格只返回如下JSON，不要任何其他文字：
{"score":"85/100","meaning_ok":"是/部分/否","meaning_note":"一句话说明","diffs":[{"orig":"原句表达","student":"学生表达","analysis":"分析一句话"}],"mba_point":"考场高频高分点","memo":"最值得记住的一个点"}`;

  const userMsg = isEasy
    ? `中心句：${s.core}\n完整原句：${s.en}\n学生答案：${student.trim()}`
    : `中文原意：${s.cn}\n标准英文原句：${s.en}\n学生翻译：${student.trim()}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system: systemPrompt, messages: [{ role: 'user', content: userMsg }] })
    });
    const data = await res.json();
    const raw = (data.content[0].text || '').replace(/```json|```/g, '').trim();
    const r = JSON.parse(raw);
    renderResult(r, isEasy, s, student.trim());
    recordStats(r.score, s.diff);
  } catch(e) {
    body.innerHTML = `<div class="sec-body" style="color:#C62828">批改失败：${e.message}</div>`;
  }
}

function renderResult(r, isEasy, s, student) {
  const scoreNum = parseInt(r.score);
  const scoreClass = scoreNum >= 80 ? 'score-high' : scoreNum >= 60 ? 'score-mid' : 'score-low';
  let html = `<span class="score-pill ${scoreClass}">${r.score}</span>`;

  if (isEasy) {
    html += `<div class="section"><div class="sec-label">核心差距</div><div class="sec-body">${r.core_gap}</div></div>`;
  } else {
    const mClass = r.meaning_ok === '是' ? 'm-yes' : r.meaning_ok === '否' ? 'm-no' : 'm-part';
    html += `<div class="section"><div class="sec-label">意思对了吗</div><div class="sec-body"><span class="meaning-pill ${mClass}">${r.meaning_ok}</span>${r.meaning_note}</div></div>`;
    if (r.mba_point) html += `<div class="section"><div class="sec-label">MBA考场价值</div><div class="sec-body">${r.mba_point}</div></div>`;
  }

  if (r.diffs && r.diffs.length) {
    html += `<div class="section"><div class="sec-label">逐处对比</div>`;
    r.diffs.forEach(d => {
      html += `<div class="diff-item"><div class="diff-orig">${d.orig}${d.student ? ' → ' + d.student : ''}</div><div class="diff-analysis">${d.analysis}</div></div>`;
    });
    html += `</div>`;
  }

  html += `<div class="section"><div class="sec-label">记住这个</div><div class="memo-box">${r.memo}</div></div>`;
  document.getElementById('panelBody').innerHTML = html;

  history.unshift({ date: new Date().toLocaleDateString(), year: s.year, diff: s.diff, en: s.en, student, score: r.score, mode: currentMode });
  if (history.length > 30) history.pop();
  localStorage.setItem('tt_history_v2', JSON.stringify(history));
  renderHistory();
}

function recordStats(scoreStr, diff) {
  checkToday();
  const num = parseInt(scoreStr);
  stats.total++;
  stats.todayCount++;
  stats.scores.push(num);
  if (stats.scores.length > 50) stats.scores.shift();
  stats.levels[diff] = (stats.levels[diff] || 0) + 1;
  localStorage.setItem('tt_stats_v2', JSON.stringify(stats));
  updateStats();
}

function updateStats() {
  checkToday();
  document.getElementById('sTodayCount').textContent = stats.todayCount;
  document.getElementById('sTotalCount').textContent = stats.total;
  const avg = stats.scores.length ? Math.round(stats.scores.reduce((a,b)=>a+b,0)/stats.scores.length) : null;
  document.getElementById('sAvgScore').textContent = avg ? avg : '—';
  const lvls = Object.keys(stats.levels).map(k => ['','简','中','难'][k]).filter(Boolean);
  document.getElementById('sLevels').textContent = lvls.length ? lvls.join('/') : '—';
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (!history.length) { el.innerHTML = '<div style="font-size:12px;color:#A09A93">暂无记录</div>'; return; }
  el.innerHTML = history.slice(0,10).map(h => `
    <div class="history-item">
      <div class="history-meta"><span>${h.date}</span><span>${h.year}年</span><span>${['','简单','中等','困难'][h.diff]}</span><span>${h.mode==='easy'?'简单模式':'高难度'}</span></div>
      <div class="history-en">${h.en}</div>
      <div class="history-score">${h.score}</div>
    </div>`).join('');
}

buildFiltered();
render();
loadKey();
updateStats();
renderHistory();
</script>
</body>
</html>
