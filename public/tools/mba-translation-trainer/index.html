const KEY_DATA = 'mba_trans_v1';
const API_KEY_STORE = 'mba_api_key';
let currentFilter = 'all';
let currentSentence = null;
let answered = false;

function loadData(){try{return JSON.parse(localStorage.getItem(KEY_DATA)||'{records:[]}');}catch(e){return {records:[]};}}
function saveDataStore(d){try{localStorage.setItem(KEY_DATA,JSON.stringify(d));}catch(e){}}
function getKey(){return localStorage.getItem(API_KEY_STORE)||'';}
function saveKey(){
  const v=document.getElementById('apiKeyInput').value.trim();
  if(!v)return;
  localStorage.setItem(API_KEY_STORE,v);
  document.getElementById('apiKeyInput').value='';
  document.getElementById('keyStatus').textContent='API Key 已保存 ✓';
  document.getElementById('keyStatus').style.color='#1D9E75';
}

function dateStr(d){return d.toISOString().split('T')[0];}

function updateStats(){
  const data=loadData();
  const records=data.records||[];
  const today=dateStr(new Date());
  const todayRecords=records.filter(r=>r.date===today);
  const scores=records.filter(r=>r.score).map(r=>r.score);
  const avgScore=scores.length>0?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
  const levels=[...new Set(records.map(r=>r.diff))].sort();
  const levelNames={1:'简单',2:'中等',3:'困难'};
  document.getElementById('sTodayCount').textContent=todayRecords.length;
  document.getElementById('sTotalCount').textContent=records.length;
  document.getElementById('sAvgScore').textContent=avgScore?avgScore+'分':'—';
  document.getElementById('sLevels').textContent=levels.length>0?levels.map(l=>levelNames[l]).join('/'):'—';
}

function setFilter(val,btn){
  currentFilter=val;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadNext();
}

function getFilteredSentences(){
  if(currentFilter==='all')return sentences;
  return sentences.filter(s=>s.diff===currentFilter);
}

function loadNext(){
  const pool=getFilteredSentences();
  if(pool.length===0){
    document.getElementById('mainArea').innerHTML='<div class="empty-state">没有符合条件的句子</div>';
    return;
  }
  const idx=Math.floor(Math.random()*pool.length);
  currentSentence=pool[idx];
  answered=false;
  renderSentence();
}

function renderSentence(){
  const s=currentSentence;
  const diffNames={1:'简单',2:'中等',3:'困难'};
  const diffClass={1:'diff-1',2:'diff-2',3:'diff-3'};
  document.getElementById('mainArea').innerHTML=`
    <div class="sentence-card">
      <div class="card-meta">
        <span class="year-badge">${s.year}年</span>
        <span class="diff-badge ${diffClass[s.diff]}">${diffNames[s.diff]}</span>
        <span class="source-label">英语二 · ${s.type}</span>
      </div>
      <div class="en-sentence">
        ${s.en}
        <div class="hint">请将上面这句英文翻译成中文，写完后提交对比</div>
      </div>
      <textarea id="userTrans" placeholder="在这里写你的中文翻译..." rows="3"></textarea>
      <div class="btn-row">
        <button class="submit-btn" id="submitBtn" onclick="submitTrans()">提交翻译</button>
        <button class="skip-btn" onclick="loadNext()">跳过</button>
        <button class="next-btn" id="nextBtn" onclick="loadNext()">下一题 →</button>
      </div>
      <div class="analysis" id="analysis"></div>
    </div>`;
}

async function submitTrans(){
  const userText=document.getElementById('userTrans').value.trim();
  if(!userText){alert('请先写下你的翻译');return;}
  if(answered)return;
  answered=true;
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('nextBtn').style.display='inline-block';

  const s=currentSentence;
  const analysis=document.getElementById('analysis');
  analysis.classList.add('show');
  analysis.innerHTML=`
    <div class="ref-section">
      <div class="ref-label">参考译文</div>
      <div class="ref-text">${s.ref}</div>
    </div>
    <div class="ref-section">
      <div class="ref-label">句子结构</div>
      <div class="ref-text">${s.notes}</div>
    </div>
    <div class="ai-section">
      <div class="ai-label">AI 卡点分析</div>
      <div class="ai-content" id="aiContent"><span class="ai-loading">${getKey()?'分析中...':'未设置 API Key，无法使用 AI 分析'}</span></div>
    </div>`;

  if(!getKey()){saveRecord(null);updateStats();renderHistory();return;}

  const prompt=`你是MBA英语翻译教练。

英文原句：${s.en}
参考译文：${s.ref}
学生译文：${userText}

请做以下分析（简洁，不超过150字）：
1. 给一个0-100的分数，并说明理由（一句话）
2. 找出1-2个最关键的卡点（词汇误译、结构未理清、信息遗漏）
3. 给出一个最重要的改进建议

格式：
得分：X分 · [一句评语]
卡点：[具体说明]
建议：[具体建议]`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:300,messages:[{role:'user',content:prompt}]})
    });
    const json=await res.json();
    if(json.content&&json.content[0]){
      const text=json.content[0].text;
      document.getElementById('aiContent').innerHTML=text.replace(/\n/g,'<br>');
      const scoreMatch=text.match(/得分[：:]\s*(\d+)/);
      const score=scoreMatch?parseInt(scoreMatch[1]):null;
      saveRecord(score);
    }else{
      document.getElementById('aiContent').innerHTML='<span style="color:#A32D2D">分析失败，请检查 API Key</span>';
      saveRecord(null);
    }
  }catch(e){
    document.getElementById('aiContent').innerHTML='<span style="color:#A32D2D">网络错误</span>';
    saveRecord(null);
  }
  updateStats();renderHistory();
}

function saveRecord(score){
  const data=loadData();
  if(!data.records)data.records=[];
  data.records.unshift({
    date:dateStr(new Date()),
    sentenceId:currentSentence.id,
    year:currentSentence.year,
    diff:currentSentence.diff,
    en:currentSentence.en.slice(0,60)+'...',
    score:score,
    userTrans:document.getElementById('userTrans')?.value||'',
  });
  if(data.records.length>100)data.records=data.records.slice(0,100);
  saveDataStore(data);
}

function renderHistory(){
  const data=loadData();
  const records=(data.records||[]).slice(0,8);
  const el=document.getElementById('historyList');
  if(records.length===0){el.innerHTML='<div class="empty-state">暂无练习记录</div>';return;}
  const diffNames={1:'简单',2:'中等',3:'困难'};
  const diffColors={1:'#0F6E56',2:'#854F0B',3:'#791F1F'};
  el.innerHTML=records.map(r=>`
    <div class="history-item">
      <span class="history-date">${r.date}</span>
      <span style="color:${diffColors[r.diff]}">${diffNames[r.diff]}</span>
      · ${r.year}年
      ${r.score?`· <strong style="color:#1A1816">${r.score}分</strong>`:'· 未评分'}
      <span style="color:#A09A93;margin-left:4px">${r.en}</span>
    </div>`).join('');
}

if(getKey()){
  document.getElementById('keyStatus').textContent='API Key 已设置 ✓';
  document.getElementById('keyStatus').style.color='#1D9E75';
}
updateStats();
renderHistory();
loadNext();
</script>
</body>
</html>
