const WORDS = RAW.split("\n").map((line, i) => {
  const p = line.split("|");
  return { id: i, w: p[0], m: p[1] };
});

// ---------- speech out ----------
let voiceCache = null;
function pickVoice() {
  try {
    const vs = window.speechSynthesis.getVoices();
    if (!vs.length) return null;
    voiceCache =
      vs.find((v) => v.lang === "en-US" && /Google|Samantha|Natural/i.test(v.name)) ||
      vs.find((v) => v.lang === "en-US") ||
      vs.find((v) => v.lang && v.lang.startsWith("en"));
    return voiceCache;
  } catch (e) { return null; }
}
function speak(text, rate) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate || 0.92;
    const v = voiceCache || pickVoice();
    if (v) u.voice = v;
    synth.speak(u);
  } catch (e) {}
}

// ---------- storage ----------
const KEY = "mba-talk-v1";
async function loadCfg() {
  try {
    const r = await window.storage.get(KEY);
    if (r && r.value) return JSON.parse(r.value);
  } catch (e) {}
  return null;
}
async function saveCfg(c) {
  try { await window.storage.set(KEY, JSON.stringify(c)); } catch (e) {}
}

const SCENARIOS = [
  ["daily", "日常闲聊", "casual everyday small talk (weather, food, weekend plans, family life)"],
  ["work", "职场", "workplace conversations (meetings, projects, colleagues, deadlines)"],
  ["interview", "MBA面试", "an MBA admission interview; you are a friendly interviewer asking about career, goals, strengths"],
  ["news", "观点讨论", "discussing simple opinions on news topics like technology, education, city life"],
  ["travel", "出行旅行", "travel situations (airport, hotel, asking directions, ordering food)"],
];

function App() {
  const [cfg, setCfg] = useState({ ptr: 0, auto: true, level: "easy", scen: "daily" });
  const [ready, setReady] = useState(false);
  const [msgs, setMsgs] = useState([]); // {role:'user'|'ai', text, zh, fix}
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [showZh, setShowZh] = useState({});
  const [wordTip, setWordTip] = useState(null);
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);
  const bottomRef = useRef(null);
  const cfgRef = useRef(cfg);
  cfgRef.current = cfg;

  const targets = WORDS.slice(cfg.ptr, cfg.ptr + 6).length === 6
    ? WORDS.slice(cfg.ptr, cfg.ptr + 6)
    : [...WORDS.slice(cfg.ptr), ...WORDS.slice(0, 6 - (632 - cfg.ptr))];

  useEffect(() => {
    (async () => {
      const c = await loadCfg();
      if (c) setCfg((p) => ({ ...p, ...c }));
      setReady(true);
    })();
    try {
      window.speechSynthesis.onvoiceschanged = pickVoice;
      pickVoice();
    } catch (e) {}
  }, []);

  useEffect(() => {
    bottomRef.current && bottomRef.current.scrollIntoView({ behavior: "smooth" });
  }, [msgs, busy]);

  const persist = (patch) => {
    const next = { ...cfgRef.current, ...patch };
    setCfg(next);
    saveCfg(next);
  };

  const rotateWords = () => persist({ ptr: (cfg.ptr + 6) % 632 });

  // ---------- speech in ----------
  const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const toggleMic = () => {
    if (!SR) return;
    if (listening) {
      recRef.current && recRef.current.stop();
      setListening(false);
      return;
    }
    const rec = new SR();
    rec.lang = "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      const t = e.results[0][0].transcript;
      setInput((prev) => (prev ? prev + " " : "") + t);
    };
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recRef.current = rec;
    setListening(true);
    rec.start();
  };

  // ---------- fully offline conversation engine ----------
  const OFFLINE_LINES = {
    daily: [
      ["It is nice to talk with you. How was your day?", "很高兴和你聊天。你今天过得怎么样？"],
      ["That sounds good. What do you usually do after work?", "听起来不错。你下班后通常做什么？"],
      ["I see. What is one small plan you have for this weekend?", "明白了。这个周末你有什么小计划？"],
    ],
    work: [
      ["Let's talk about your work. What project are you working on now?", "我们聊聊工作吧。你现在正在做什么项目？"],
      ["That is interesting. What is the biggest challenge for your team?", "很有意思。你的团队目前最大的挑战是什么？"],
      ["Good point. How would you explain your solution in a meeting?", "说得好。你会怎样在会议中说明你的解决方案？"],
    ],
    interview: [
      ["Welcome to the interview. Could you briefly introduce yourself?", "欢迎参加面试。可以简短介绍一下自己吗？"],
      ["Thank you. Why do you want to study for an MBA?", "谢谢。你为什么想读 MBA？"],
      ["What is one strength that will help you in business school?", "哪项优势能帮助你完成商学院学习？"],
    ],
    news: [
      ["Let's discuss a simple topic. Does technology make daily life better?", "我们讨论一个简单话题。科技让日常生活变得更好了吗？"],
      ["I understand your view. What is one possible disadvantage?", "我理解你的观点。它可能有什么缺点？"],
      ["That is a fair idea. What should companies do about it?", "这个观点很合理。企业应该怎么做？"],
    ],
    travel: [
      ["Let's practice travel English. Where would you like to go?", "我们练习旅行英语吧。你想去哪里？"],
      ["Great choice. How would you ask for a room at a hotel?", "选得很好。你会怎样在酒店询问房间？"],
      ["Good. What would you say if you needed directions?", "很好。如果需要问路，你会怎么说？"],
    ],
  };

  const localFix = (text) => {
    if (/\bI\s+am\s+agree\b/i.test(text)) return "应说 I agree";
    if (/\bI\s+very\s+like\b/i.test(text)) return "应说 I really like";
    if (/\b(he|she)\s+have\b/i.test(text)) return "第三人称用 has";
    if (/\bI\s+have\s+went\b/i.test(text)) return "应说 I have gone";
    if (/\bI\s+am\s+work\b/i.test(text)) return "应说 I am working";
    return "";
  };

  const callAI = async (history) => {
    await new Promise((resolve) => setTimeout(resolve, 180));
    const userTurns = history.filter((m) => m.role === "user");
    const latest = userTurns[userTurns.length - 1]?.text || "";
    const isOpening = latest.startsWith("(Please start");
    const lines = OFFLINE_LINES[cfgRef.current.scen] || OFFLINE_LINES.daily;
    const line = lines[Math.min(isOpening ? 0 : userTurns.length - 1, lines.length - 1) % lines.length];
    const wordA = targets[(userTurns.length - 1) % targets.length].w;
    const wordB = targets[userTurns.length % targets.length].w;
    const practice = cfgRef.current.level === "easy"
      ? ` Try to use “${wordA}” in your answer.`
      : ` If possible, connect “${wordA}” and “${wordB}” in your answer.`;
    const chineseInput = /[\u3400-\u9fff]/.test(latest);
    return {
      text: (chineseInput ? "Please try to answer in English. " : "") + line[0] + practice,
      zh: line[1] + ` 请尝试在回答中使用“${wordA}”。`,
      fix: chineseInput ? "试着用英文回答" : localFix(latest),
    };
  };

  const startChat = async () => {
    setMsgs([]);
    setBusy(true);
    try {
      const ai = await callAI([{ role: "user", text: "(Please start the conversation with a friendly opening.)" }]);
      setMsgs([{ role: "ai", ...ai }]);
      if (cfgRef.current.auto) speak(ai.text);
    } catch (e) {
    }
    setBusy(false);
  };

  const send = async () => {
    const t = input.trim();
    if (!t || busy) return;
    setInput("");
    const hist = [...msgs, { role: "user", text: t }];
    setMsgs(hist);
    setBusy(true);
    try {
      const ai = await callAI(hist);
      setMsgs([...hist, { role: "ai", ...ai }]);
      if (cfgRef.current.auto) speak(ai.text);
    } catch (e) {
      setMsgs(hist);
    }
    setBusy(false);
  };

  // highlight target words in AI reply
  const highlight = (text) => {
    const stems = targets.map((t) => t.w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    const re = new RegExp(`\\b(${stems.join("|")})\\w*\\b`, "gi");
    const parts = [];
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parts.push(text.slice(last, m.index));
      parts.push(<b key={m.index} style={{ color: "var(--accent)", fontWeight: 700 }}>{m[0]}</b>);
      last = m.index + m[0].length;
    }
    if (last < text.length) parts.push(text.slice(last));
    return parts;
  };

  const css = `
    :root{
      --bg:#12151b; --card:#1b2029; --line:#2b3240; --ink:#f0ede4; --dim:#8b93a3;
      --accent:#8fb4ff; --green:#5fce8a; --amber:#e8b45a; --rose:#e87a7a;
      --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
      --serif:Georgia,'Times New Roman','Songti SC',serif;
    }
    .tk-root{height:100vh;background:var(--bg);color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif;
      display:flex;flex-direction:column;max-width:560px;margin:0 auto;box-sizing:border-box;}
    .tk-btn{border:none;border-radius:12px;cursor:pointer;font-family:inherit;transition:transform .06s ease;}
    .tk-btn:active{transform:scale(.96)}
    .tk-chip{padding:5px 11px;border-radius:999px;background:transparent;color:var(--dim);
      border:1px solid var(--line);font-size:12.5px;white-space:nowrap;}
    .tk-chip.on{background:var(--accent);color:#0e1116;border-color:var(--accent);font-weight:600;}
    .fadein{animation:tkf .18s ease}
    @keyframes tkf{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .tk-scroll::-webkit-scrollbar{width:0}
  `;

  if (!ready)
    return (
      <div className="tk-root" style={{ justifyContent: "center", alignItems: "center" }}>
        <style>{css}</style>
        <span style={{ color: "var(--dim)" }}>载入中…</span>
      </div>
    );

  return (
    <div className="tk-root">
      <style>{css}</style>

      {/* header */}
      <div style={{ padding: "14px 16px 8px", borderBottom: "1px solid var(--line)" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
          <span style={{ fontFamily: "var(--serif)", fontSize: 20, fontWeight: 600 }}>English 陪练 · Alex</span>
          <button className={`tk-btn tk-chip ${cfg.auto ? "on" : ""}`} onClick={() => persist({ auto: !cfg.auto })}>
            {cfg.auto ? "🔊 自动朗读" : "🔇 朗读关"}
          </button>
        </div>
        <div className="tk-scroll" style={{ display: "flex", gap: 6, marginTop: 10, overflowX: "auto" }}>
          {SCENARIOS.map(([k, label]) => (
            <button key={k} className={`tk-btn tk-chip ${cfg.scen === k ? "on" : ""}`}
              onClick={() => persist({ scen: k })}>{label}</button>
          ))}
          <span style={{ width: 8, flexShrink: 0 }} />
          <button className={`tk-btn tk-chip ${cfg.level === "easy" ? "on" : ""}`} onClick={() => persist({ level: "easy" })}>简单句</button>
          <button className={`tk-btn tk-chip ${cfg.level === "mid" ? "on" : ""}`} onClick={() => persist({ level: "mid" })}>进阶</button>
        </div>
        {/* target words */}
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
          <span style={{ fontSize: 11.5, color: "var(--dim)", flexShrink: 0 }}>本轮目标词</span>
          {targets.map((t) => (
            <button key={t.id} className="tk-btn"
              onClick={() => setWordTip(wordTip === t.id ? null : t.id)}
              style={{ background: "rgba(143,180,255,.1)", border: "1px solid rgba(143,180,255,.3)",
                color: "var(--accent)", borderRadius: 8, padding: "3px 8px", fontSize: 12.5 }}>
              {t.w}
            </button>
          ))}
          <button className="tk-btn" onClick={rotateWords}
            style={{ background: "none", color: "var(--dim)", fontSize: 13, padding: "2px 6px" }}>↻ 换一批</button>
        </div>
        {wordTip !== null && (
          <div className="fadein" style={{ fontSize: 12.5, color: "var(--dim)", marginTop: 6 }}>
            {WORDS[wordTip].w}：{WORDS[wordTip].m}
            <button className="tk-btn" onClick={() => speak(WORDS[wordTip].w, 0.9)}
              style={{ background: "none", color: "var(--accent)", fontSize: 12.5, marginLeft: 6, padding: 0 }}>🔊</button>
          </div>
        )}
      </div>

      {/* chat */}
      <div className="tk-scroll" style={{ flex: 1, overflowY: "auto", padding: "14px 16px", minHeight: 0 }}>
        {msgs.length === 0 && !busy && (
          <div style={{ textAlign: "center", marginTop: 60 }}>
            <p style={{ color: "var(--dim)", fontSize: 14, lineHeight: 1.8, padding: "0 20px" }}>
              Alex 会围绕左上角的场景开聊，并把<b style={{ color: "var(--accent)" }}>目标词</b>自然编进对话里。
              你用英文回（打字或按住🎤说），常见错误会在本地提示。点Alex消息可看中文。
            </p>
            <button className="tk-btn" onClick={startChat}
              style={{ background: "var(--accent)", color: "#0e1116", fontSize: 16, fontWeight: 700,
                padding: "14px 36px", borderRadius: 14, marginTop: 16 }}>
              开始对话
            </button>
            <div style={{ color: "var(--dim)", fontSize: 12.5, marginTop: 12 }}>离线练习 · 不消耗 API 额度</div>
          </div>
        )}
        {msgs.map((m, i) =>
          m.role === "ai" ? (
            <div key={i} className="fadein" style={{ marginBottom: 12, maxWidth: "88%" }}>
              <div onClick={() => setShowZh({ ...showZh, [i]: !showZh[i] })}
                style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: "4px 16px 16px 16px",
                  padding: "11px 14px", fontSize: 15.5, lineHeight: 1.55, cursor: "pointer" }}>
                {highlight(m.text)}
                {showZh[i] && m.zh && (
                  <div style={{ fontSize: 13, color: "var(--dim)", marginTop: 7, borderTop: "1px dashed var(--line)", paddingTop: 7 }}>
                    {m.zh}
                  </div>
                )}
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 4, alignItems: "center" }}>
                <button className="tk-btn" onClick={() => speak(m.text)}
                  style={{ background: "none", color: "var(--dim)", fontSize: 13, padding: "2px 4px" }}>🔊 朗读</button>
                <span style={{ fontSize: 11.5, color: "var(--dim)" }}>点消息看中文</span>
              </div>
              {m.fix && (
                <div style={{ fontSize: 12.5, color: "var(--amber)", marginTop: 5,
                  background: "rgba(232,180,90,.08)", border: "1px solid rgba(232,180,90,.25)",
                  borderRadius: 8, padding: "6px 10px", display: "inline-block" }}>
                  💡 {m.fix}
                </div>
              )}
            </div>
          ) : (
            <div key={i} className="fadein" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}>
              <div style={{ background: "var(--accent)", color: "#0e1116", borderRadius: "16px 4px 16px 16px",
                padding: "11px 14px", fontSize: 15.5, lineHeight: 1.5, maxWidth: "85%" }}>
                {m.text}
              </div>
            </div>
          )
        )}
        {busy && <div style={{ color: "var(--dim)", fontSize: 13.5 }}>Alex 正在输入…</div>}
        <div ref={bottomRef} />
      </div>

      {/* input */}
      {msgs.length > 0 && (
        <div style={{ display: "flex", gap: 8, padding: "10px 16px 16px", borderTop: "1px solid var(--line)" }}>
          {SR && (
            <button className="tk-btn" onClick={toggleMic}
              style={{ background: listening ? "var(--rose)" : "var(--card)", border: "1px solid var(--line)",
                color: "var(--ink)", width: 46, borderRadius: 12, fontSize: 18, flexShrink: 0 }}>
              {listening ? "◼" : "🎤"}
            </button>
          )}
          <input value={input} onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && !e.nativeEvent.isComposing && send()}
            placeholder={listening ? "正在听，说英文…" : "用英文回复…"}
            style={{ flex: 1, background: "var(--card)", border: "1px solid var(--line)", borderRadius: 12,
              color: "var(--ink)", padding: "0 14px", fontSize: 15, outline: "none", minWidth: 0 }} />
          <button className="tk-btn" onClick={send} disabled={busy || !input.trim()}
            style={{ background: input.trim() && !busy ? "var(--accent)" : "var(--line)",
              color: input.trim() && !busy ? "#0e1116" : "var(--dim)",
              fontWeight: 700, fontSize: 15, padding: "0 18px", borderRadius: 12, flexShrink: 0 }}>
            发送
          </button>
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    const { code } = Babel.transform(document.getElementById('app-source').textContent, {
      presets: [['env'], ['react', { runtime: 'classic' }]]
    });
    new Function(code)();
  </script>
</body>
</html>
