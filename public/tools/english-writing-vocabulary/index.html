<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .word-cn { font-size: 13px; color: #888; margin-bottom: 3px; }
  .word-tip { font-size: 12px; color: #E8630A; }
  .warn { color: #DC2626; font-weight: 600; }

  .speed-bar span { font-size: 12px; color: #999; margin-right: 4px; }

  .count { font-size: 12px; color: #aaa; margin-bottom: 10px; }
  .tool-back { display: inline-flex; margin: 0 0 14px; color: #777; font-size: 13px; font-weight: 600; text-decoration: none; }

function speak(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = currentRate;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
    || voices.find(v => v.lang === 'en-US')
    || voices.find(v => v.lang.startsWith('en'));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

function setSpeed(rate) {
  currentRate = rate;
  document.querySelectorAll('.speed-bar button').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.rate) === rate);
  });
}

function switchTab(i) {
  document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('active', j === i));
  document.querySelectorAll('.section').forEach((s, j) => s.classList.toggle('active', j === i));
}

function render() {
  document.getElementById('tabs').innerHTML = data.map((d, i) =>
    '<div class="tab ' + (i===0?'active':'') + '" onclick="switchTab(' + i + ')">' + d.tab + '</div>'
  ).join('');

  document.getElementById('sections').innerHTML = data.map((d, i) => {
    const cards = d.words.map(w => {
      const hasDanger = w.tip.includes('⚠️⚠️');
      const hasWarn = !hasDanger && w.tip.includes('⚠️');
      const tipClass = hasDanger ? ' warn' : '';
      return '<div class="word-card">' +
        '<button class="play-btn" onclick="speak(\'' + w.en.replace(/'/g, "\\'") + '\')">▶</button>' +
        '<div class="word-info">' +
          '<div class="word-en">' + w.en + '</div>' +
          '<div class="word-cn">' + w.cn + '</div>' +
          '<div class="word-tip' + tipClass + '">' + w.tip + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    return '<div class="section ' + (i===0?'active':'') + '">' +
      '<div class="count">' + d.title + ' · 共' + d.words.length + '词</div>' +
      cards +
    '</div>';
  }).join('');
}

window.speechSynthesis.onvoiceschanged = () => {};
render();
</script>
