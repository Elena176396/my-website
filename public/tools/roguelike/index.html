<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#faf9f5" />
  <title>Roguelike · Song Chaoyang</title>
  <style>
    html,body,#root{min-height:100%;margin:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#faf9f5}
    .site-back{position:fixed;z-index:9999;left:14px;top:14px;padding:8px 12px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;text-decoration:none;font-size:13px;backdrop-filter:blur(8px)}
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <a class="site-back" href="/tools/">← 工具中心</a>
  <div id="root"></div>
  <script>
    window.storage = {
      async get(key){ const value=localStorage.getItem(key); return value==null?null:{value}; },
      async set(key,value){ localStorage.setItem(key,value); return true; },
      async delete(key){ localStorage.removeItem(key); return true; }
    };
  </script>
  <script type="text/plain" id="app-source">
const { useState, useCallback, useEffect, useRef } = React;

const shuffle = (a) => [...a].sort(() => Math.random() - 0.5);
const rng = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const SKILLS = [
  { id: "turbo", name: `超频打击`, desc: `过载输出，碾碎目标`, icon: `🔥`, dmg: 18, teCost: 15, fiGain: 8, type: "te",
    color: "#00ff9d", gradient: "linear-gradient(135deg, #00ff9d22, #00ff9d08)" },
  { id: "chain", name: `逻辑链锯`, desc: `三段斩，连击切割`, icon: `⛓️`, dmg: 14, teCost: 10, fiGain: 5, type: "te",
    color: "#4ade80", gradient: "linear-gradient(135deg, #4ade8022, #4ade8008)" },
  { id: "pierce", name: `穿甲弹`, desc: `无视防御，一击破盾`, icon: `🎯`, dmg: 22, teCost: 20, fiGain: 12, type: "te",
    color: "#22d3ee", gradient: "linear-gradient(135deg, #22d3ee22, #22d3ee08)" },
  { id: "nuke", name: `真言核爆`, desc: `以真相为弹头，自损AOE`, icon: `☢️`, dmg: 30, teCost: 8, fiGain: -15, selfDmg: 8, type: "fi",
    color: "#f472b6", gradient: "linear-gradient(135deg, #f472b622, #f472b608)" },
  { id: "ghost", name: `幽灵闪避`, desc: `相位移动，脱离战场`, icon: `👻`, dmg: 0, teCost: -10, fiGain: -10, heal: 5, type: "fi",
    color: "#a78bfa", gradient: "linear-gradient(135deg, #a78bfa22, #a78bfa08)" },
  { id: "sonic", name: `音速冲刺`, desc: `突破音障，物理穿越`, icon: `💨`, dmg: 12, teCost: 5, fiGain: 3, type: "style",
    color: "#6366f1", gradient: "linear-gradient(135deg, #6366f122, #6366f108)" },
];

const ENEMIES = [
  { id: "clock", name: `铁律钟魔`, icon: `⏰`, hp: 40, atk: 8,
    desc: `时间秩序的守护者。差一秒即判定违规。`,
    taunt: [`你迟到了`, `时间不会为你停留`, `规则面前没有例外`],
    defeatLine: `钟面碎裂，齿轮散落。时间终于不再追你了。` },
  { id: "nepotism", name: `寄生皇冠`, icon: `👑`, hp: 55, atk: 10,
    desc: `不靠实力戴上的王冠。权力是继承的，不是赢来的。`,
    taunt: [`这里我说了算`, `你只管执行`, `我的来头你惹不起`],
    defeatLine: `皇冠摔在地上，里面是空的。从来就没有脑袋撑着它。` },
  { id: "exam", name: `裁决碑文`, icon: `📝`, hp: 60, atk: 12,
    desc: `刻在石头上的分数线。一分之差，判你出局。`,
    taunt: [`不达标就是废物`, `分数不会骗人`, `实力？先过了这一关再说`],
    defeatLine: `碑文裂开。文字还在，但你不再跪着读它了。` },
  { id: "aunt", name: `催命红娘`, icon: `🧧`, hp: 45, atk: 14,
    desc: `用关心当武器的NPC。暴击率100%。闪避不能。`,
    taunt: [`一个人多苦啊`, `再不找就来不及了`, `你这样下去怎么行`],
    defeatLine: `她停下来了。你递了颗糖。她不是敌人，只是另一个系统的NPC。` },
  { id: "helmet", name: `秩序猎犬`, icon: `🪖`, hp: 35, atk: 6,
    desc: `巡逻在每条路上的规则执行者。小事也绝不放过。`,
    taunt: [`违规了！`, `罚金已生成`, `下次从重处罚`],
    defeatLine: `它追着自己的尾巴跑了。有些规则连自己都不信。` },
  { id: "overtime", name: `永夜幽灵`, icon: `🌙`, hp: 50, atk: 11,
    desc: `不是制度逼你留下。是所有人都没走，你走了就是叛徒。`,
    taunt: [`大家都在呢`, `今晚能交吗`, `周末来一趟`],
    defeatLine: `你先走了。身后的灯一盏一盏跟着灭了。他们也在等一个人先走。` },
  { id: "diploma", name: `铭文门卫`, icon: `🎓`, hp: 65, atk: 13,
    desc: `守在大门前，只认铭文不认人。铭文是刻在纸上的准入码。`,
    taunt: [`铭文等级不足`, `请出示更高阶铭文`, `准入已拒绝`],
    defeatLine: `门还在。但你找到了一扇没有门卫的窗。` },
];

const BOSS = {
  id: "self", name: `镜中之敌`, icon: `🪞`, hp: 80, atk: 15,
  desc: `最后一个敌人没有名字。\n它长得和你一模一样。\n它说的每句话都是你自己的声音。`,
  taunt: [`你不能停下来`, `示弱就是认输`, `一个人扛是你的宿命`, `你凭什么喊累`],
  defeatLine: `镜子碎了。碎片里映出的是一个很久没有休息过的人。\n\n你没有打败她。你放下了武器。`,
};

const RARITY = {
  common: { label: "C", color: "#9ca3af", glow: "none" },
  rare: { label: "B", color: "#60a5fa", glow: "0 0 12px #60a5fa44" },
  epic: { label: "A", color: "#a78bfa", glow: "0 0 14px #a78bfa44" },
  legendary: { label: "S", color: "#fbbf24", glow: "0 0 16px #fbbf2444" },
};

const ITEMS = [
  { id: "cell", name: `回路胶囊`, icon: `💊`, rarity: "common", desc: `HP+15`, effect: "heal", val: 15,
    bg: "linear-gradient(135deg, #ef4444, #f97316)" },
  { id: "shield", name: `静默力场`, icon: `🔮`, rarity: "rare", desc: `Fi-20`, effect: "fiDown", val: 20,
    bg: "linear-gradient(135deg, #a78bfa, #6366f1)" },
  { id: "rocket", name: `离子轮组`, icon: `⚡`, rarity: "rare", desc: `冲刺伤害x2`, effect: "buff", val: 0,
    bg: "linear-gradient(135deg, #6366f1, #2563eb)" },
  { id: "scroll", name: `遗忘卷轴`, icon: `📜`, rarity: "common", desc: `Fi-15`, effect: "fiDown", val: 15,
    bg: "linear-gradient(135deg, #10b981, #059669)" },
  { id: "star", name: `起源之星`, icon: `⭐`, rarity: "legendary", desc: `HP+20`, effect: "heal", val: 20,
    bg: "linear-gradient(135deg, #fbbf24, #f59e0b)" },
  { id: "blade", name: `破规之刃`, icon: `🗡️`, rarity: "legendary", desc: `下次攻击+50%`, effect: "atkBuff", val: 0,
    bg: "linear-gradient(135deg, #ef4444, #dc2626)" },
  { id: "tea", name: `熵减药剂`, icon: `🧪`, rarity: "common", desc: `Te+15`, effect: "teUp", val: 15,
    bg: "linear-gradient(135deg, #f97316, #eab308)" },
  { id: "core", name: `反叛核心`, icon: `💎`, rarity: "epic", desc: `HP+10 Te+10`, effect: "both", val: 10,
    bg: "linear-gradient(135deg, #8b5cf6, #ec4899)" },
  { id: "feather", name: `无重力羽`, icon: `🪶`, rarity: "epic", desc: `Fi-25`, effect: "fiDown", val: 25,
    bg: "linear-gradient(135deg, #06b6d4, #3b82f6)" },
];

const FI_EVENTS = [
  `情绪过载——系统发出警告。`,
  `内部冲突激化，护盾出现裂纹。`,
  `记忆碎片闪回，消耗额外精力。`,
  `核心温度异常，强制冷却3秒。`,
  `内在防线松动，有什么在渗透进来。`,
];

const C = {
  bg: "#08080f", panel: "rgba(255,255,255,0.03)", border: "rgba(255,255,255,0.07)",
  text: "#d4d4db", dim: "#555", te: "#00ff9d", fi: "#ff6b9d", hp: "#ff4444",
  style: "#6366f1", gold: "#fbbf24", white: "#fff",
};

function Bar({ label, val, max, color, icon }) {
  const pct = clamp((val / max) * 100, 0, 100);
  return (
    <div style={{ marginBottom: 5 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color, fontWeight: 700, marginBottom: 2 }}>
        <span>{icon} {label}</span><span>{val}/{max}</span>
      </div>
      <div style={{ height: 6, borderRadius: 3, background: "rgba(255,255,255,0.06)", overflow: "hidden" }}>
        <div style={{ height: "100%", borderRadius: 3, background: color, width: `${pct}%`, transition: "width 0.4s", boxShadow: `0 0 8px ${color}55` }} />
      </div>
    </div>
  );
}

function ItemCard({ item, onClick }) {
  const r = RARITY[item.rarity];
  return (
    <button onClick={onClick} style={{
      flex: 1, background: item.bg, border: `2px solid ${r.color}`,
      borderRadius: 14, padding: "16px 8px", cursor: "pointer",
      textAlign: "center", boxShadow: r.glow, minWidth: 0,
    }}>
      <div style={{ fontSize: 32, marginBottom: 6, filter: "drop-shadow(0 0 8px rgba(255,255,255,0.3))" }}>{item.icon}</div>
      <div style={{ fontSize: 11, fontWeight: 800, color: "#fff", marginBottom: 2 }}>{item.name}</div>
      <div style={{ fontSize: 9, color: r.color, fontWeight: 700, letterSpacing: 1, marginBottom: 4 }}>{r.label}</div>
      <div style={{ fontSize: 10, color: "rgba(255,255,255,0.7)" }}>{item.desc}</div>
    </button>
  );
}

function SkillBtn({ skill, disabled, onClick, boosted }) {
  const dmg = boosted ? Math.floor(skill.dmg * 1.5) : skill.dmg;
  return (
    <button onClick={onClick} disabled={disabled} style={{
      background: disabled ? "rgba(255,255,255,0.02)" : skill.gradient,
      border: `1px solid ${disabled ? "rgba(255,255,255,0.04)" : skill.color + "40"}`,
      borderRadius: 10, padding: "8px 12px", cursor: disabled ? "default" : "pointer",
      width: "100%", textAlign: "left", marginBottom: 5, transition: "all 0.15s",
      opacity: disabled ? 0.35 : 1,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ fontSize: 18, filter: disabled ? "grayscale(1)" : "none" }}>{skill.icon}</span>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: disabled ? "#444" : skill.color }}>{skill.name}</div>
            <div style={{ fontSize: 10, color: C.dim }}>{skill.desc}</div>
          </div>
        </div>
        <div style={{ textAlign: "right", fontSize: 10, color: disabled ? "#333" : "#888", lineHeight: 1.6, whiteSpace: "nowrap" }}>
          {dmg > 0 && <div style={{ color: disabled ? "#333" : C.gold }}>DMG {dmg}{boosted ? " 🔥" : ""}</div>}
          {skill.teCost > 0 ? <div>Te -{skill.teCost}</div> : skill.teCost < 0 ? <div style={{ color: C.te }}>Te +{-skill.teCost}</div> : null}
          {skill.fiGain > 0 ? <div style={{ color: C.fi }}>Fi +{skill.fiGain}</div> : skill.fiGain < 0 ? <div style={{ color: "#a78bfa" }}>Fi {skill.fiGain}</div> : null}
        </div>
      </div>
    </button>
  );
}

function Roguelike() {
  const [phase, setPhase] = useState("title");
  const [floor, setFloor] = useState(0);
  const [hp, setHp] = useState(100);
  const [te, setTe] = useState(50);
  const [fi, setFi] = useState(20);
  const [enemies, setEnemies] = useState([]);
  const [enemy, setEnemy] = useState(null);
  const [enemyHp, setEnemyHp] = useState(0);
  const [log, setLog] = useState([]);
  const [items, setItems] = useState([]);
  const [shopItems, setShopItems] = useState([]);
  const [result, setResult] = useState(null);
  const [fiEvent, setFiEvent] = useState(null);
  const [skateBuff, setSkateBuff] = useState(false);
  const [atkBuff, setAtkBuff] = useState(false);
  const [turnBusy, setTurnBusy] = useState(false);
  const [kills, setKills] = useState(0);
  const [shake, setShake] = useState(false);
  const [flash, setFlash] = useState(null);
  const logRef = useRef(null);

  const addLog = useCallback((msg) => setLog((p) => [...p, msg].slice(-30)), []);
  useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [log]);

  const doShake = () => { setShake(true); setTimeout(() => setShake(false), 300); };
  const doFlash = (color) => { setFlash(color); setTimeout(() => setFlash(null), 200); };

  const startGame = () => {
    const order = shuffle(ENEMIES);
    setEnemies(order); setFloor(0); setHp(100); setTe(50); setFi(20);
    setLog([]); setItems([]); setResult(null); setFiEvent(null);
    setSkateBuff(false); setAtkBuff(false); setKills(0);
    setTurnBusy(false);
    enterFloor(order[0], 1);
  };

  const enterFloor = (e, f) => {
    const en = f === 8 ? BOSS : e;
    setEnemy(en); setEnemyHp(en.hp); setFloor(f); setPhase("fight");
    setFiEvent(null); setTurnBusy(false);
    setLog((p) => [...p, `── ${f}F  ${en.icon} ${en.name} ──`]);
  };

  const useSkill = (skill) => {
    if (turnBusy) return;
    if (skill.teCost > 0 && te < skill.teCost) { addLog(`Te不足`); return; }
    setTurnBusy(true);

    let dmg = skill.dmg;
    if (skill.id === "sonic" && skateBuff) { dmg *= 2; setSkateBuff(false); }
    if (atkBuff && dmg > 0) { dmg = Math.floor(dmg * 1.5); setAtkBuff(false); }

    const nTe = clamp(te - skill.teCost, 0, 100);
    const nFi = clamp(fi + skill.fiGain, 0, 100);
    let nHp = hp;
    if (skill.selfDmg) nHp = Math.max(0, hp - skill.selfDmg);
    if (skill.heal) nHp = Math.min(100, hp + skill.heal);
    const nEHp = Math.max(0, enemyHp - dmg);

    setTe(nTe); setFi(nFi); setHp(nHp); setEnemyHp(nEHp);

    if (dmg > 0) { doFlash(skill.color); doShake(); }
    addLog(dmg > 0 ? `${skill.icon} ${skill.name} → -${dmg}` : `${skill.icon} ${skill.name}`);

    if (nHp <= 0) { setResult("dead"); setPhase("end"); setTurnBusy(false); return; }

    if (nEHp <= 0) {
      addLog(enemy.defeatLine); setKills((k) => k + 1);
      setTimeout(() => {
        if (enemy.id === "self") { setResult("win"); setPhase("end"); }
        else { offerShop(); }
        setTurnBusy(false);
      }, 600);
      return;
    }

    if (nFi >= 80 && Math.random() < 0.5) {
      const evt = FI_EVENTS[rng(0, FI_EVENTS.length - 1)];
      setFiEvent(evt); addLog(`💔 ${evt}`);
      nHp = Math.max(1, nHp - 10); setHp(nHp);
    }
    if (nFi >= 100) {
      addLog(`💔 Fi核心崩溃`); setResult("fi_collapse"); setPhase("end"); setTurnBusy(false); return;
    }

    setTimeout(() => {
      const taunt = enemy.taunt[rng(0, enemy.taunt.length - 1)];
      const eDmg = rng(Math.floor(enemy.atk * 0.7), enemy.atk);
      const afterHp = Math.max(0, nHp - eDmg);
      setHp(afterHp); doFlash(C.hp);
      addLog(`${enemy.icon} "${taunt}" → -${eDmg}`);
      if (afterHp <= 0) { setResult("dead"); setPhase("end"); }
      setTurnBusy(false);
    }, 400);
  };

  const offerShop = () => {
    setShopItems(shuffle(ITEMS).slice(0, 3));
    setPhase("shop");
  };

  const pickItem = (item) => {
    if (item.effect === "heal") setHp((h) => Math.min(100, h + item.val));
    if (item.effect === "fiDown") setFi((f) => Math.max(0, f - item.val));
    if (item.effect === "buff") setSkateBuff(true);
    if (item.effect === "atkBuff") setAtkBuff(true);
    if (item.effect === "teUp") setTe((t) => Math.min(100, t + item.val));
    if (item.effect === "both") { setHp((h) => Math.min(100, h + item.val)); setTe((t) => Math.min(100, t + item.val)); }
    setItems((p) => [...p, item]);
    addLog(`${item.icon} ${item.name}`);
    nextFloor();
  };

  const nextFloor = () => {
    const nf = floor + 1;
    if (nf > 7) enterFloor(null, 8);
    else enterFloor(enemies[nf - 1], nf);
  };

  const wrap = {
    background: C.bg, color: C.text, minHeight: "100vh",
    fontFamily: "-apple-system, 'SF Pro Text', sans-serif",
    padding: "16px 14px", maxWidth: 480, margin: "0 auto",
    position: "relative", overflow: "hidden",
  };

  if (phase === "title") {
    return (
      <div style={wrap}>
        <div style={{ textAlign: "center", paddingTop: 40 }}>
          <div style={{ fontSize: 72, marginBottom: 4, filter: "drop-shadow(0 0 20px rgba(0,255,157,0.3))" }}>🛼</div>
          <h1 style={{ fontSize: 24, fontWeight: 900, margin: "0 0 4px", color: C.white, letterSpacing: -1 }}>
            RULEBREAKER
          </h1>
          <p style={{ fontSize: 11, color: C.dim, letterSpacing: 2, marginBottom: 20 }}>反权威 ROGUELIKE</p>
          <p style={{ fontSize: 12, color: "#888", lineHeight: 1.7, margin: "0 20px 28px" }}>
            8层 · 7个守卫 + 1个终极BOSS<br />
            每局随机排列 · Te/Fi双轴平衡战斗
          </p>
          <button onClick={startGame} style={{
            padding: "14px 44px", background: `linear-gradient(135deg, ${C.te}, #4ade80)`,
            color: C.bg, border: "none", borderRadius: 10, fontWeight: 800, fontSize: 16,
            cursor: "pointer", boxShadow: `0 0 24px ${C.te}44`,
          }}>
            START
          </button>
        </div>

        <div style={{ marginTop: 32 }}>
          <div style={{ fontSize: 10, color: C.dim, marginBottom: 10, letterSpacing: 2 }}>SKILLS</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
            {SKILLS.map((s) => (
              <div key={s.id} style={{ background: s.gradient, border: `1px solid ${s.color}30`, borderRadius: 10, padding: "10px 12px" }}>
                <div style={{ fontSize: 18, marginBottom: 2 }}>{s.icon}</div>
                <div style={{ fontSize: 12, fontWeight: 700, color: s.color }}>{s.name}</div>
                <div style={{ fontSize: 10, color: C.dim }}>{s.desc}</div>
              </div>
            ))}
          </div>
          <div style={{ fontSize: 10, color: C.fi, marginTop: 12, lineHeight: 1.6, padding: "0 4px" }}>
            ⚠️ Te系高输出但积累Fi压力 · Fi过载=系统崩溃 · 平衡是唯一的活路
          </div>
        </div>
      </div>
    );
  }

  if (phase === "end") {
    const endings = {
      win: { icon: "🛼", title: `CLEAR`, sub: `全层突破`, color: C.te,
        text: `7个守卫全部击破。\n\n最后站在你面前的是镜子里的自己。\n\n你没有打败她。\n你放下了武器。\n\n这是唯一的通关方式。` },
      dead: { icon: "💀", title: `DEAD`, sub: `${floor}F`, color: C.hp,
        text: `HP归零。\n\n硬撑不是勇敢。\n是另一种服从。` },
      fi_collapse: { icon: "💔", title: `COLLAPSE`, sub: `Fi过载`, color: C.fi,
        text: `Te全开。效率最大化。逻辑链锯切碎一切。\n\n然后系统崩溃了。\n\n不是因为外部攻击。\n是因为内部被忽略太久了。\n\nFi不是弱点。Fi是你还在运行的证据。` },
    };
    const e = endings[result];
    return (
      <div style={wrap}>
        <div style={{ textAlign: "center", paddingTop: 32 }}>
          <div style={{ fontSize: 56, marginBottom: 8, filter: `drop-shadow(0 0 20px ${e.color}44)` }}>{e.icon}</div>
          <h2 style={{ fontSize: 24, fontWeight: 900, color: e.color, margin: 0, letterSpacing: 2 }}>{e.title}</h2>
          <div style={{ fontSize: 12, color: C.dim, marginBottom: 16 }}>{e.sub}</div>
          <div style={{ fontSize: 14, lineHeight: 2, color: C.text, textAlign: "left", padding: "0 12px", whiteSpace: "pre-line" }}>{e.text}</div>
          <div style={{ display: "flex", gap: 8, marginTop: 24, justifyContent: "center" }}>
            {[{ l: "FLOOR", v: floor, c: C.gold }, { l: "KILLS", v: kills, c: C.te }, { l: "Fi", v: fi, c: C.fi }].map((s) => (
              <div key={s.l} style={{ background: C.panel, borderRadius: 10, padding: "10px 16px", textAlign: "center", border: `1px solid ${C.border}`, minWidth: 56 }}>
                <div style={{ fontSize: 20, fontWeight: 800, color: s.c }}>{s.v}</div>
                <div style={{ fontSize: 9, color: C.dim, letterSpacing: 1 }}>{s.l}</div>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 16, justifyContent: "center", flexWrap: "wrap" }}>
            {items.map((it, i) => <span key={i} style={{ fontSize: 20 }} title={it.name}>{it.icon}</span>)}
          </div>
          <button onClick={startGame} style={{
            marginTop: 24, padding: "12px 40px", background: e.color,
            color: C.bg, border: "none", borderRadius: 10,
            fontWeight: 800, fontSize: 15, cursor: "pointer", letterSpacing: 1,
          }}>RETRY</button>
        </div>
      </div>
    );
  }

  if (phase === "shop") {
    return (
      <div style={wrap}>
        <div style={{ textAlign: "center", marginBottom: 16 }}>
          <div style={{ fontSize: 10, color: C.dim, letterSpacing: 2 }}>{floor}F CLEARED</div>
          <div style={{ fontSize: 18, fontWeight: 800, color: C.gold, marginTop: 4, letterSpacing: 1 }}>LOOT</div>
        </div>
        <div style={{ marginBottom: 14, background: C.panel, borderRadius: 8, padding: 10, border: `1px solid ${C.border}` }}>
          <Bar label="HP" val={hp} max={100} color={C.hp} icon="❤️" />
          <Bar label="Fi" val={fi} max={100} color={C.fi} icon="💔" />
          <Bar label="Te" val={te} max={100} color={C.te} icon="⚙️" />
        </div>
        <div style={{ fontSize: 11, color: C.dim, marginBottom: 10 }}>选一件装备：</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          {shopItems.map((item) => <ItemCard key={item.id} item={item} onClick={() => pickItem(item)} />)}
        </div>
        <button onClick={nextFloor} style={{
          width: "100%", padding: "10px", background: "none",
          border: `1px solid ${C.border}`, borderRadius: 8,
          color: C.dim, cursor: "pointer", fontSize: 12, letterSpacing: 1,
        }}>SKIP →</button>
      </div>
    );
  }

  return (
    <div style={{ ...wrap, animation: shake ? "shake 0.3s ease" : "none" }}>
      <style>{`@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}`}</style>

      {flash && <div style={{
        position: "absolute", inset: 0, background: flash, opacity: 0.12,
        pointerEvents: "none", zIndex: 10,
      }} />}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div style={{ fontSize: 11, color: C.dim, fontWeight: 700, letterSpacing: 1 }}>{floor}F / 8</div>
        <div style={{ display: "flex", gap: 3 }}>
          {items.slice(-5).map((it, i) => <span key={i} style={{ fontSize: 14 }}>{it.icon}</span>)}
        </div>
      </div>

      <div style={{ marginBottom: 10, background: C.panel, borderRadius: 8, padding: "8px 10px", border: `1px solid ${C.border}` }}>
        <Bar label="HP" val={hp} max={100} color={C.hp} icon="❤️" />
        <Bar label="Te" val={te} max={100} color={C.te} icon="⚙️" />
        <Bar label="Fi" val={fi} max={100} color={C.fi} icon="💔" />
      </div>

      <div style={{
        background: "radial-gradient(ellipse at center, rgba(255,255,255,0.04), transparent)",
        borderRadius: 14, padding: "16px 14px", border: `1px solid ${C.border}`,
        marginBottom: 10, textAlign: "center",
      }}>
        <div style={{ fontSize: 44, marginBottom: 4, filter: enemyHp <= 0 ? "grayscale(1)" : "drop-shadow(0 0 12px rgba(255,187,36,0.2))" }}>
          {enemy?.icon}
        </div>
        <div style={{ fontSize: 17, fontWeight: 800, color: C.white }}>{enemy?.name}</div>
        <div style={{ fontSize: 11, color: C.dim, lineHeight: 1.6, margin: "6px 0 10px", whiteSpace: "pre-line" }}>{enemy?.desc}</div>
        <div style={{ maxWidth: 200, margin: "0 auto" }}>
          <Bar label="" val={enemyHp} max={enemy?.hp || 1} color={C.gold} icon="" />
        </div>
      </div>

      {fiEvent && (
        <div style={{
          padding: "8px 12px", borderRadius: 8, marginBottom: 8,
          background: "rgba(255,107,157,0.08)", border: `1px solid ${C.fi}30`,
          fontSize: 12, color: C.fi,
        }}>💔 {fiEvent}</div>
      )}

      <div style={{ marginBottom: 8 }}>
        {SKILLS.map((sk) => {
          const cantAfford = sk.teCost > 0 && te < sk.teCost;
          const disabled = turnBusy || cantAfford || enemyHp <= 0;
          const boosted = atkBuff && sk.dmg > 0;
          return <SkillBtn key={sk.id} skill={sk} disabled={disabled} onClick={() => useSkill(sk)} boosted={boosted} />;
        })}
      </div>

      {(skateBuff || atkBuff) && (
        <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
          {skateBuff && <span style={{ fontSize: 10, color: C.style, background: `${C.style}15`, padding: "3px 8px", borderRadius: 4, letterSpacing: 0.5 }}>⚡ SONIC x2</span>}
          {atkBuff && <span style={{ fontSize: 10, color: C.hp, background: `${C.hp}15`, padding: "3px 8px", borderRadius: 4, letterSpacing: 0.5 }}>🗡️ ATK +50%</span>}
        </div>
      )}

      <div ref={logRef} style={{
        borderTop: `1px solid ${C.border}`, paddingTop: 6,
        maxHeight: 80, overflowY: "auto", fontSize: 10, color: "#555", lineHeight: 1.7,
      }}>
        {log.map((l, i) => <div key={i} style={{ opacity: i === log.length - 1 ? 1 : 0.4 }}>{l}</div>)}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<Roguelike />);
  </script>
  <script>
    const { code } = Babel.transform(document.getElementById('app-source').textContent, {
      presets: [['env'], ['react', { runtime: 'classic' }]]
    });
    new Function(code)();
  </script>
</body>
