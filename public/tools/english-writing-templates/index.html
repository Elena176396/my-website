let currentRate = 0.8;
let activeTab = 0;

function speak(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = currentRate;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
    || voices.find(v => v.lang === 'en-US')
    || voices.find(v => v.lang.startsWith('en'));
  if (enVoice) u.voice = enVoice;
  window.speechSynthesis.speak(u);
}

function speakAll(index) {
  window.speechSynthesis.cancel();
  const t = templates[index];
  const full = t.sentences.map(s => s.plain).join('. ');
  const u = new SpeechSynthesisUtterance(full);
  u.lang = 'en-US';
  u.rate = currentRate;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
    || voices.find(v => v.lang === 'en-US')
    || voices.find(v => v.lang.startsWith('en'));
  if (enVoice) u.voice = enVoice;
  window.speechSynthesis.speak(u);
}

function toggleFull(index) {
  const el = document.getElementById('full-' + index);
  el.classList.toggle('show');
}

function setSpeed(rate) {
  currentRate = rate;
  document.querySelectorAll('.speed button').forEach(b => {
    const r = parseFloat(b.dataset.rate);
    b.classList.toggle('active', r === rate);
  });
}

function switchTab(index) {
  activeTab = index;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === index));
  document.querySelectorAll('.section').forEach((s, i) => s.classList.toggle('active', i === index));
}

function render() {
  const tabsEl = document.getElementById('tabs');
  const sectionsEl = document.getElementById('sections');

  tabsEl.innerHTML = templates.map((t, i) =>
    '<div class="tab ' + (i===0?'active':'') + '" onclick="switchTab(' + i + ')">' + t.tab + '</div>'
  ).join('');

  sectionsEl.innerHTML = templates.map((t, i) => {
    let sentenceHTML = t.sentences.map((s, j) =>
      '<div class="en">' + s.en + '</div>' +
      '<div class="cn">' + s.cn + '</div>' +
      '<div style="margin-bottom:8px">' +
        '<button class="btn" onclick="speak(templates[' + i + '].sentences[' + j + '].plain)" style="font-size:12px;padding:4px 10px;">▶ 第' + (j+1) + '句</button>' +
      '</div>'
    ).join('<div class="divider"></div>');

    let fullHTML = t.sentences.map(s => s.en).join('<br><br>');

    return '<div class="section ' + (i===0?'active':'') + '">' +
      '<div class="card">' +
        '<div class="card-head">' +
          '<span class="num ' + t.tagColor + '">' + t.tag + '</span>' +
          '<div class="speed">' +
            '<button data-rate="0.6" onclick="setSpeed(0.6)" ' + (currentRate===0.6?'class="active"':'') + '>慢速</button>' +
            '<button data-rate="0.8" onclick="setSpeed(0.8)" ' + (currentRate===0.8?'class="active"':'') + '>正常</button>' +
            '<button data-rate="1.0" onclick="setSpeed(1.0)" ' + (currentRate===1.0?'class="active"':'') + '>原速</button>' +
          '</div>' +
        '</div>' +
        '<div class="title">' + t.title + '</div>' +
        '<div class="tip">💡 ' + t.tip + '</div>' +
        sentenceHTML +
        '<div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">' +
          '<button class="btn" onclick="speakAll(' + i + ')">▶ 整篇朗读</button>' +
          '<button class="btn outline" onclick="toggleFull(' + i + ')">📝 默写区</button>' +
        '</div>' +
        '<div class="full-text" id="full-' + i + '">' +
          '<div class="divider"></div>' +
          '<div class="full-en">' + fullHTML + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

window.speechSynthesis.onvoiceschanged = () => {};
render();
</script>
