      { sp: "A", en: "One month until my big exam. I'm so nervous, Elena.", v: ["I'm"], zh: "离大考只剩一个月了。我好紧张，Elena。" },

// ---------- voices ----------
let vAlex = null, vElena = null, voicesReady = false;
function assignVoices() {
  try {
    const vs = window.speechSynthesis.getVoices().filter((v) => v.lang && v.lang.startsWith("en"));
    if (!vs.length) return;
    voicesReady = true;
    const prefer = (names) => vs.find((v) => names.some((n) => v.name.toLowerCase().includes(n)));
    vAlex = prefer(["daniel", "david", "alex", "guy", "google us english", "aaron"]) || vs[0];
    vElena = prefer(["samantha", "victoria", "zira", "karen", "google uk english female", "aria", "susan"]) ||
      vs.find((v) => v !== vAlex) || vs[0];
  } catch (e) {}
}
function speakLine(line, rate, onEnd) {
  try {
    const synth = window.speechSynthesis;
    if (!synth) { onEnd && onEnd(); return null; }
    const u = new SpeechSynthesisUtterance(line.en);
    u.lang = "en-US";
    u.rate = rate;
    const sameVoice = vAlex && vElena && vAlex === vElena;
    if (line.sp === "A") { if (vAlex) u.voice = vAlex; u.pitch = sameVoice ? 0.8 : 1.0; }
    else { if (vElena) u.voice = vElena; u.pitch = sameVoice ? 1.3 : 1.05; }
    u.onend = () => onEnd && onEnd();
    u.onerror = () => onEnd && onEnd();
    synth.speak(u);
    return u;
  } catch (e) { onEnd && onEnd(); return null; }
}

// ---------- storage ----------
const KEY = "mba-listen-v1";
async function loadCfg() {
  try { const r = await window.storage.get(KEY); if (r && r.value) return JSON.parse(r.value); } catch (e) {}
  return null;
}
async function saveCfg(c) { try { await window.storage.set(KEY, JSON.stringify(c)); } catch (e) {} }

function App() {
  const [cfg, setCfg] = useState({ rate: 0.9, mode: "both" }); // mode: both | en | blind
  const [di, setDi] = useState(0);
  const [cur, setCur] = useState(-1);
  const [playing, setPlaying] = useState(false);
  const playingRef = useRef(false);
  const curRef = useRef(-1);
  const cfgRef = useRef(cfg);
  cfgRef.current = cfg;
  const lineRefs = useRef([]);

  useEffect(() => {
    (async () => {
      const c = await loadCfg();
      if (c) setCfg((p) => ({ ...p, ...c }));
    })();
    try {
      window.speechSynthesis.onvoiceschanged = assignVoices;
      assignVoices();
    } catch (e) {}
    return () => { try { window.speechSynthesis.cancel(); } catch (e) {} };
  }, []);

  useEffect(() => {
    if (cur >= 0 && lineRefs.current[cur]) {
      lineRefs.current[cur].scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }, [cur]);

  const persist = (patch) => {
    const next = { ...cfgRef.current, ...patch };
    setCfg(next);
    saveCfg(next);
  };

  const stop = () => {
    playingRef.current = false;
    setPlaying(false);
    try { window.speechSynthesis.cancel(); } catch (e) {}
  };

  const playFrom = (idx) => {
    const d = DIALOGUES[di];
    if (idx >= d.lines.length) {
      playingRef.current = false;
      setPlaying(false);
      setCur(-1);
      return;
    }
    curRef.current = idx;
    setCur(idx);
    speakLine(d.lines[idx], cfgRef.current.rate, () => {
      if (!playingRef.current) return;
      setTimeout(() => { if (playingRef.current) playFrom(idx + 1); }, 350);
    });
  };

  const togglePlay = () => {
    if (playing) { stop(); return; }
    if (!voicesReady) assignVoices();
    playingRef.current = true;
    setPlaying(true);
    try { window.speechSynthesis.cancel(); } catch (e) {}
    playFrom(cur >= 0 && cur < DIALOGUES[di].lines.length ? cur : 0);
  };

  const tapLine = (idx) => {
    stop();
    setCur(idx);
    speakLine(DIALOGUES[di].lines[idx], cfgRef.current.rate, () => {});
  };

  const switchDialogue = (i) => {
    stop();
    setDi(i);
    setCur(-1);
  };

  // 颜色管语法(谓语=绿)，粗细管词汇(目标词=粗)；重叠=绿粗
  const highlight = (text, verbs) => {
    const flags = new Array(text.length).fill(0); // bit1=谓语 bit2=目标词
    const isL = (c) => !!c && /[a-z']/i.test(c);
    const lower = text.toLowerCase();
    (verbs || []).forEach((v) => {
      const vl = v.toLowerCase();
      let p = 0;
      while ((p = lower.indexOf(vl, p)) !== -1) {
        if (!isL(text[p - 1]) && !isL(text[p + vl.length])) {
          for (let k = p; k < p + vl.length; k++) flags[k] |= 1;
        }
        p += vl.length;
      }
    });
    const ws = DIALOGUES[di].words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    const re = new RegExp(`\\b(${ws.join("|")})\\w*\\b`, "gi");
    let m;
    while ((m = re.exec(text)) !== null) {
      for (let k = m.index; k < m.index + m[0].length; k++) flags[k] |= 2;
    }
    const out = [];
    let i = 0;
    while (i < text.length) {
      let j = i;
      while (j < text.length && flags[j] === flags[i]) j++;
      const seg = text.slice(i, j);
      const f = flags[i];
      if (!f) out.push(seg);
      else
        out.push(
          <span key={i} style={{
            color: f & 1 ? "var(--green)" : "var(--accent)",
            fontWeight: f & 2 ? 700 : 600,
          }}>{seg}</span>
        );
      i = j;
    }
    return out;
  };

  const css = `
    :root{
      --bg:#12151b; --card:#1b2029; --line:#2b3240; --ink:#f0ede4; --dim:#8b93a3;
      --accent:#8fb4ff; --green:#5fce8a; --amber:#e8b45a; --rose:#e87a7a;
      --serif:Georgia,'Times New Roman','Songti SC',serif;
    }
    .ls-root{height:100vh;background:var(--bg);color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif;
      display:flex;flex-direction:column;max-width:560px;margin:0 auto;box-sizing:border-box;}
    .ls-btn{border:none;border-radius:12px;cursor:pointer;font-family:inherit;transition:transform .06s ease;}
    .ls-btn:active{transform:scale(.96)}
    .ls-chip{padding:5px 12px;border-radius:999px;background:transparent;color:var(--dim);
      border:1px solid var(--line);font-size:12.5px;white-space:nowrap;}
    .ls-chip.on{background:var(--accent);color:#0e1116;border-color:var(--accent);font-weight:600;}
    .fadein{animation:lsf .18s ease}
    @keyframes lsf{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .ls-scroll::-webkit-scrollbar{width:0}
  `;

  const d = DIALOGUES[di];

  return (
    <div className="ls-root">
      <style>{css}</style>

      {/* header */}
      <div style={{ padding: "14px 16px 10px", borderBottom: "1px solid var(--line)" }}>
        <div style={{ fontFamily: "var(--serif)", fontSize: 20, fontWeight: 600 }}>双人听力 · Alex &amp; Elena</div>
        <div className="ls-scroll" style={{ display: "flex", gap: 6, marginTop: 10, overflowX: "auto" }}>
          {DIALOGUES.map((dd, i) => (
            <button key={i} className={`ls-btn ls-chip ${di === i ? "on" : ""}`} onClick={() => switchDialogue(i)}>
              {dd.tag}·{dd.title}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 6, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontSize: 11.5, color: "var(--dim)" }}>语速</span>
          {[["0.75", 0.75], ["0.9", 0.9], ["1.0", 1.0]].map(([label, r]) => (
            <button key={label} className={`ls-btn ls-chip ${cfg.rate === r ? "on" : ""}`}
              onClick={() => persist({ rate: r })}>{label}x</button>
          ))}
          <span style={{ width: 6 }} />
          <span style={{ fontSize: 11.5, color: "var(--dim)" }}>字幕</span>
          {[["both", "中英"], ["en", "只英文"], ["blind", "盲听"]].map(([k, label]) => (
            <button key={k} className={`ls-btn ls-chip ${cfg.mode === k ? "on" : ""}`}
              onClick={() => persist({ mode: k })}>{label}</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 5, marginTop: 10, flexWrap: "wrap", alignItems: "center" }}>
          <span style={{ fontSize: 11.5, color: "var(--dim)" }}>本段目标词</span>
          {d.words.map((w) => (
            <span key={w} style={{ background: "rgba(143,180,255,.1)", border: "1px solid rgba(143,180,255,.3)",
              color: "var(--accent)", borderRadius: 8, padding: "2px 8px", fontSize: 12 }}>{w}</span>
          ))}
        </div>
      </div>

      {/* transcript */}
      <div className="ls-scroll" style={{ flex: 1, overflowY: "auto", padding: "14px 16px", minHeight: 0 }}>
        <p style={{ fontSize: 12, color: "var(--dim)", margin: "0 0 12px" }}>
          点任意一句可单独重听 · <span style={{ color: "var(--green)", fontWeight: 600 }}>绿色=谓语</span> · <span style={{ color: "var(--accent)", fontWeight: 700 }}>蓝粗=目标词</span> · 又绿又粗=两者都是
        </p>
        {d.lines.map((l, i) => {
          const active = i === cur;
          const isA = l.sp === "A";
          const blind = cfg.mode === "blind" && !active;
          return (
            <div key={i} ref={(el) => (lineRefs.current[i] = el)} onClick={() => tapLine(i)}
              style={{ display: "flex", justifyContent: isA ? "flex-start" : "flex-end", marginBottom: 10, cursor: "pointer" }}>
              <div style={{ maxWidth: "86%" }}>
                <div style={{ fontSize: 11, color: isA ? "var(--accent)" : "var(--amber)",
                  marginBottom: 3, textAlign: isA ? "left" : "right" }}>
                  {isA ? "Alex" : "Elena"}
                </div>
                <div style={{
                  background: active ? (isA ? "rgba(143,180,255,.15)" : "rgba(232,180,90,.13)") : "var(--card)",
                  border: `1px solid ${active ? (isA ? "var(--accent)" : "var(--amber)") : "var(--line)"}`,
                  borderRadius: isA ? "4px 14px 14px 14px" : "14px 4px 14px 14px",
                  padding: "10px 13px", fontSize: 15, lineHeight: 1.55,
                  filter: blind ? "blur(6px)" : "none", transition: "filter .15s",
                }}>
                  {highlight(l.en, l.v)}
                  {cfg.mode === "both" && (
                    <div style={{ fontSize: 12.5, color: "var(--dim)", marginTop: 5 }}>{l.zh}</div>
                  )}
                </div>
              </div>
            </div>
          );
        })}
        <div style={{ height: 20 }} />
      </div>

      {/* controls */}
      <div style={{ display: "flex", gap: 10, padding: "12px 16px 18px", borderTop: "1px solid var(--line)", alignItems: "center" }}>
        <button className="ls-btn" onClick={togglePlay}
          style={{ flex: 1, background: playing ? "var(--rose)" : "var(--accent)", color: "#0e1116",
            fontSize: 17, fontWeight: 700, padding: "15px 0", borderRadius: 14 }}>
          {playing ? "⏸ 暂停" : cur > 0 && cur < d.lines.length ? "▶ 继续" : "▶ 播放整段"}
        </button>
        <button className="ls-btn" onClick={() => { stop(); setCur(-1); }}
          style={{ background: "var(--card)", border: "1px solid var(--line)", color: "var(--dim)",
            fontSize: 14, padding: "15px 18px", borderRadius: 14 }}>
          ↺ 回开头
        </button>
        <span style={{ fontSize: 12.5, color: "var(--dim)", minWidth: 44, textAlign: "right" }}>
          {cur >= 0 ? cur + 1 : "–"}/{d.lines.length}
        </span>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
