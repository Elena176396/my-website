const DIM_PAIRS = [["E","I"],["S","N"],["T","F"],["J","P"]];
const DIM_SHORT = {E:"外向",I:"内向",S:"实感",N:"直觉",T:"思考",F:"情感",J:"判断",P:"感知"};
const DIM_C = {E:"#4361ee",I:"#7209b7",S:"#2a9d8f",N:"#e76f51",T:"#f77f00",F:"#d62828",J:"#6a4c93",P:"#1982c4"};

function App() {
  const [phase, setPhase] = useState("intro");
  const [mode, setMode] = useState("short");
  const [qi, setQi] = useState(0);
  const [scores, setScores] = useState({E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0});
  const [fade, setFade] = useState("fi");

  const QS = useMemo(() => mode === "short" ? SHORT_IDX.map(i => FULL[i]) : FULL, [mode]);
  const SECS = mode === "short" ? SEC_SHORT : SEC_FULL;

  const sec = useMemo(() => {
    for (let i = 0; i < SECS.length; i++) if (qi >= SECS[i].r[0] && qi < SECS[i].r[1]) return {...SECS[i], idx:i};
    return {...SECS[0], idx:0};
  }, [qi, SECS]);
  const isWP = sec.t === "词语偏好";

  const pick = useCallback((ch) => {
    const d = ch === "A" ? QS[qi][3] : QS[qi][4];
    setFade("fo");
    setTimeout(() => {
      setScores(p => ({...p, [d]: p[d]+1}));
      if (qi+1 >= QS.length) setPhase("result"); else setQi(qi+1);
      setFade("fi");
    }, 200);
  }, [qi, QS]);

  const mbti = useMemo(() => DIM_PAIRS.map(([a,b]) => scores[a] > scores[b] ? a : b).join(""), [scores]);
  const restart = () => { setPhase("intro"); setQi(0); setScores({E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0}); };
  const start = (m) => { setMode(m); setQi(0); setScores({E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0}); setPhase("test"); };
  const pct = Math.round(qi/QS.length*100);

  return (
    <div style={css.root}>
      <style>{GCSS}</style>

      {phase === "intro" && (
        <div style={css.center}>
          <div style={css.introCard}>
            <svg width="48" height="48" viewBox="0 0 48 48" style={{marginBottom:16}}>
              <circle cx="24" cy="24" r="22" fill="none" stroke="#4361ee" strokeWidth="2"/>
              <circle cx="24" cy="24" r="16" fill="none" stroke="#7209b7" strokeWidth="1.5" opacity=".5"/>
              <circle cx="24" cy="24" r="4" fill="#4361ee"/>
              <line x1="24" y1="2" x2="24" y2="8" stroke="#4361ee" strokeWidth="2"/>
              <line x1="24" y1="40" x2="24" y2="46" stroke="#7209b7" strokeWidth="2"/>
              <line x1="2" y1="24" x2="8" y2="24" stroke="#2a9d8f" strokeWidth="2"/>
              <line x1="40" y1="24" x2="46" y2="24" stroke="#e76f51" strokeWidth="2"/>
            </svg>
            <h1 style={css.iTitle}>MBTI 职业性格测评</h1>
            <p style={css.iSub}>专业版 · 含认知功能分析</p>

            <div style={css.pickWrap}>
              <button className="pickBtn pickMain" onClick={()=>start("short")}>
                <div style={css.pickTop}>
                  <span style={css.pickName}>精简版</span>
                  <span style={css.pickTag}>推荐</span>
                </div>
                <div style={css.pickNum}>60 题<span style={css.pickTime}> · 约 10 分钟</span></div>
                <p style={css.pickDesc}>去除全部重复题项，四维各 15 题严格平衡，题序打散防止规律作答</p>
              </button>
              <button className="pickBtn" onClick={()=>start("full")}>
                <div style={css.pickTop}>
                  <span style={css.pickName}>完整版</span>
                </div>
                <div style={css.pickNum}>93 题<span style={css.pickTime}> · 约 18 分钟</span></div>
                <p style={css.pickDesc}>原始量表全量题目，含内部一致性校验题</p>
              </button>
            </div>
            <p style={css.iNote}>凭直觉作答 · 不要过度思考 · 没有对错之分</p>
          </div>
        </div>
      )}

      {phase === "test" && (
        <div style={css.testWrap}>
          <div style={css.tHead}>
            <div style={css.tHeadL}>
              <span style={css.badge}>Part {sec.idx+1}</span>
              <span style={css.secName}>{sec.t}</span>
              <span style={css.modeTag}>{mode==="short"?"精简版":"完整版"}</span>
            </div>
            <span style={css.qCount}>{qi+1}<span style={{color:"#bbb"}}>/{QS.length}</span></span>
          </div>
          <div style={css.pTrack}><div style={{...css.pFill, width:`${pct}%`}}/></div>
          <p style={css.secSub}>{sec.s}</p>

          <div className={fade} style={css.qCard}>
            <span style={css.qNum}>Q{qi+1}</span>
            <p style={isWP ? css.qTxtWP : css.qTxt}>{QS[qi][0]}</p>
            <div style={css.opts}>
              {["A","B"].map(ch => (
                <button key={ch} className="optBtn" onClick={()=>pick(ch)}>
                  <span style={css.oLabel}>{ch}</span>
                  <span style={css.oTxt}>{QS[qi][ch==="A"?1:2]}</span>
                </button>
              ))}
            </div>
          </div>

          <div style={css.liveWrap}>
            <p style={css.liveTitle}>维度实时追踪</p>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {DIM_PAIRS.map(([a,b]) => {
                const sa=scores[a], sb=scores[b], tot=sa+sb||1;
                const pa=Math.round(sa/tot*100);
                const w = sa>sb?a:(sb>sa?b:null);
                return (
                  <div key={a+b} style={css.liveRow}>
                    <span style={{...css.liveL, fontWeight:w===a?700:400, color:w===a?DIM_C[a]:"#bbb"}}>{DIM_SHORT[a]}</span>
                    <div style={css.liveBar}>
                      <div style={{height:"100%",width:`${pa}%`,background:DIM_C[a],borderRadius:"3px 0 0 3px",transition:"width .4s ease"}}/>
                      <div style={{height:"100%",width:`${100-pa}%`,background:DIM_C[b],borderRadius:"0 3px 3px 0",transition:"width .4s ease"}}/>
                    </div>
                    <span style={{...css.liveR, fontWeight:w===b?700:400, color:w===b?DIM_C[b]:"#bbb"}}>{DIM_SHORT[b]}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {phase === "result" && <ResultPage type={mbti} scores={scores} mode={mode} total={QS.length} onRestart={restart}/>}
    </div>
  );
}

function Diamond({scores, c}) {
  const cx=140, cy=130, r=90;
  const v = DIM_PAIRS.map(([a,b]) => { const t=scores[a]+scores[b]||1; return (scores[a]-scores[b])/t; });
  const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
  const pts = dirs.map(([dx,dy],i)=>{ const m=15+Math.abs(v[i])*r; return [cx+dx*m, cy+dy*m]; });
  const labels = [
    {x:cx, y:cy-r-18, t:v[0]>=0?"外向 E":"内向 I", c:v[0]>=0?DIM_C.E:DIM_C.I},
    {x:cx+r+12, y:cy+4, t:v[1]>=0?"实感 S":"直觉 N", c:v[1]>=0?DIM_C.S:DIM_C.N, a:"start"},
    {x:cx, y:cy+r+24, t:v[2]>=0?"思考 T":"情感 F", c:v[2]>=0?DIM_C.T:DIM_C.F},
    {x:cx-r-12, y:cy+4, t:v[3]>=0?"判断 J":"感知 P", c:v[3]>=0?DIM_C.J:DIM_C.P, a:"end"},
  ];
  const pos = [{x:cx,y:cy-r+18},{x:cx+r-24,y:cy+4},{x:cx,y:cy+r-10},{x:cx-r+24,y:cy+4}];
  return (
    <div style={{display:"flex",justifyContent:"center",padding:"8px 0"}}>
      <svg width="280" height="275" viewBox="0 0 280 270">
        {[0.33,0.66,1].map(s=>(
          <polygon key={s} points={dirs.map(([dx,dy])=>`${cx+dx*r*s},${cy+dy*r*s}`).join(" ")} fill="none" stroke="#e8e8ed" strokeWidth="1"/>
        ))}
        {dirs.map(([dx,dy],i)=><line key={i} x1={cx} y1={cy} x2={cx+dx*r} y2={cy+dy*r} stroke="#e8e8ed" strokeWidth="1"/>)}
        <polygon points={pts.map(p=>p.join(",")).join(" ")} fill={c} fillOpacity="0.12" stroke={c} strokeWidth="2.5"/>
        {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r="5" fill={c}/>)}
        {labels.map((l,i)=><text key={i} x={l.x} y={l.y} textAnchor={l.a||"middle"} fill={l.c} style={{fontSize:13,fontWeight:700,fontFamily:"inherit"}}>{l.t}</text>)}
        {DIM_PAIRS.map(([a,b],i)=>{
          const t=scores[a]+scores[b]||1;
          const p=Math.round(Math.max(scores[a],scores[b])/t*100);
          return <text key={i} x={pos[i].x} y={pos[i].y} textAnchor="middle" fill="#999" style={{fontSize:11,fontFamily:"inherit"}}>{p}%</text>;
        })}
      </svg>
