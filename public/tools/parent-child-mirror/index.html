      {pattern:'用任务评价休息',text:'"又没学习"——你在用生产力标准来评价一个需要恢复的状态。被掏空之后需要的不是继续输出，是允许自己停下来。这个"又"字里面，藏着对自己的苛责。',book:'《无戏剧性管教》：父母自己的调节状态，直接影响亲子互动的质量。照顾自己不是自私，是前提。',instead:'今晚的空洞是真实的需求信号。它不需要被解决，它需要被允许。'},
      {pattern:'把耗竭归因于性格',text:'"性格问题"是一个关闭探索的结论。它让你不需要再往深处看。但你今天承担的精神份额，是两个人的——她的情绪调节，和你自己的情绪管理，都在你一个人身上。这不是性格，是容量透支。',book:'《是的大脑》：照顾者的情绪调节资源是有限的。耗尽不是弱点，是信号。',instead:'"今天我承担了很多。我需要什么来恢复？"'},
      {pattern:'被动恢复',text:'刷手机让大脑空着——这是你找到的恢复方式。它有用，但效率不高。你在用低刺激填充空洞，而不是真正的恢复。',book:'《全脑教养法》：恢复需要输入，不只是停止输出。什么让你真正感到补充，不只是麻木。',instead:'问自己：除了刷手机，还有什么能真正让我觉得被填满？'},
      {pattern:'准确识别自己的状态',text:'你看见了：输出之后需要输入，这是正常的。这个句子里没有苛责，没有解释，只有准确的自我识别。这是照顾自己的起点。',book:'《无戏剧性管教》：父母对自己状态的准确识别，是稳定亲子关系的基础。你调节好了，她才有调节的资源。',instead:'识别之后，给自己一个具体的恢复动作，不是泛泛的"好好休息"。'},
    ]
  },
  {
    id:7,
    tag:'她不知道为什么要学习',
    scene:'她说"我不想写作业"。你问"为什么"，她说"不知道，就是不想"。你感到一种无从下手的感觉。',
    feel:'你不知道该分析什么，感到某种卡住。',
    q:'你的第一反应是？',
    choices:[
      {label:'A', text:'开始解释：学习的意义，长大以后的事，现在做的事情的价值'},
      {label:'B', text:'说"不想写也得写，这是必须做的事"'},
      {label:'C', text:'坐下来，说"我听到了。你不知道为什么要写，这个感觉我能理解。"'},
      {label:'D', text:'问她："那你现在最想做什么？"'},
    ],
    mirrors:[
      {pattern:'用意义填充空洞',text:'她说"不知道，就是不想"——这是真实的。她不需要更多信息，她需要她的感受被接住。用意义感来回应一个情绪表达，是两个频道在说话，信号对不上。',book:'《全脑教养法》：意义感是上层大脑的功能。下层大脑说"不想"时，上层大脑还没有上线，意义进不去。',instead:'先接住"不知道，就是不想"，再——很久之后——谈意义。'},
      {pattern:'用规则关闭探索',text:'"必须做"是真的，但这个回应关闭了她"不知道为什么"这个真实的困惑。她的身体在投票：我不理解这件事的意义。规则可以让她动，但动不出内驱力。',book:'《是的大脑》：外部压力可以产生行为，但内驱力来自感到被理解和有选择。',instead:'"我知道这是必须做的。同时，我也想知道你现在的感受。"'},
      {pattern:'接住感受，不急着解决',text:'坐下来，说"我听到了"——你在用身体和语言同时告诉她：你不需要立刻变成另一个状态。这是她的身体投票被看见的第一次。',book:'《无戏剧性管教》：被看见是改变的前提，不是奖励。孩子感到被理解之后，才有空间去理解你。',instead:'等她有所回应之后，不要马上切换到任务。让这个被接住的感觉多停留一会儿。'},
      {pattern:'把主动权还给她',text:'问她最想做什么——你在用问题而不是指令来和她建立连接。她会感到：我有被问到，我的感受在这里是重要的。这个问题本身就是连接。',book:'《是的大脑》：当孩子感到有选择权时，合作意愿会上升。选择不一定是"写不写"，而是"怎么开始"。',instead:'听完她的答案之后，说"好，那我们先做X分钟，然后你可以做那个"。把她的答案纳入计划里。'},
    ]
  },
];

let currentIdx = 0;
let selectedChoice = null;
let patternCounts = {};

function renderProgress(){
  const pct = Math.round((currentIdx / scenes.length) * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = `${currentIdx} / ${scenes.length}`;
}

function renderScene(){
  if(currentIdx >= scenes.length){ renderResult(); return; }
  const s = scenes[currentIdx];
  selectedChoice = null;
  const area = document.getElementById('gameArea');
  area.innerHTML = `
    <div class="scene-card">
      <div class="scene-top">
        <span class="scene-tag">${s.tag}</span>
        <div class="scene-text">${s.scene}</div>
        <div class="scene-feel">${s.feel}</div>
        <div class="choice-label">${s.q}</div>
      </div>
      <div class="choices-wrap">
        ${s.choices.map((c,i) => `
          <button class="choice" id="choice-${i}" onclick="selectChoice(${i})">
            <strong>${c.label}</strong> &nbsp;${c.text}
          </button>
        `).join('')}
        <div class="mirror" id="mirror"></div>
        <button class="next-btn" id="nextBtn" onclick="nextScene()">
          ${currentIdx + 1 < scenes.length ? '下一个情境 →' : '查看我的模式报告 →'}
        </button>
      </div>
    </div>`;
  renderProgress();
}

window.selectChoice = function(idx){
  if(selectedChoice !== null) return;
  selectedChoice = idx;
  const s = scenes[currentIdx];
  const m = s.mirrors[idx];
  const colorClasses = ['selected-a','selected-b','selected-c','selected-d'];

  document.querySelectorAll('.choice').forEach((btn,i) => {
    btn.disabled = true;
    if(i === idx) btn.classList.add(colorClasses[idx]);
  });

  // 记录模式
  const pattern = m.pattern;
  patternCounts[pattern] = (patternCounts[pattern] || 0) + 1;

  const mirror = document.getElementById('mirror');
  mirror.innerHTML = `
    <div class="mirror-pattern">你的模式：${m.pattern}</div>
    <div class="mirror-text">${m.text}</div>
    <div class="mirror-book">${m.book}</div>
    <div class="what-instead">
      <div class="what-instead-label">可以试试</div>
      <div class="what-instead-text">${m.instead}</div>
    </div>`;
  mirror.classList.add('show');
  document.getElementById('nextBtn').style.display = 'block';
};

window.nextScene = function(){
  currentIdx++;
  renderScene();
};

const patternColors = {
  '控制模式启动': '#A32D2D',
  '解决模式替代连接': '#D4922A',
  '情绪压抑积累': '#854F0B',
  '权力对抗升级': '#A32D2D',
  '退出但情绪留下': '#6B6560',
  '连接优先，正确方向': '#1D9E75',
  '连接优先': '#1D9E75',
  '道歉变成了自我辩护': '#D4922A',
  '接受了表面修复': '#854F0B',
  '真正的修复动作': '#1D9E75',
  '身体连接但情绪没着陆': '#6B6560',
  '接受了情绪上的照顾': '#854F0B',
  '元认知开始工作': '#1D9E75',
  '内疚驱动的决心': '#D4922A',
  '真正看见发生了什么': '#1D9E75',
  '把承诺当成筹码': '#A32D2D',
  '压抑观察，等待爆发': '#854F0B',
  '看见身体，给出选择': '#1D9E75',
  '管理环境，忽略状态': '#D4922A',
  '用任务评价休息': '#D4922A',
  '把耗竭归因于性格': '#6B6560',
  '被动恢复': '#6B6560',
  '准确识别自己的状态': '#1D9E75',
  '用意义填充空洞': '#D4922A',
  '用规则关闭探索': '#A32D2D',
  '接住感受，不急着解决': '#1D9E75',
  '把主动权还给她': '#1D9E75',
};

function renderResult(){
  renderProgress();
  const sorted = Object.entries(patternCounts).sort((a,b) => b[1]-a[1]);
  const positive = sorted.filter(([p]) => ['连接优先，正确方向','连接优先','真正的修复动作','元认知开始工作','真正看见发生了什么','看见身体，给出选择','准确识别自己的状态','接住感受，不急着解决','把主动权还给她'].includes(p));
  const growth = sorted.filter(([p]) => !positive.map(x=>x[0]).includes(p));
  const topPattern = growth.length > 0 ? growth[0][0] : null;

  const oneThingMap = {
    '控制模式启动': '下次感到焦灼时，在开口之前先停一秒，把指令换成问句："你现在怎么了？"',
    '解决模式替代连接': '发现自己在分析时，先停下来问她一个感受问题，而不是任务问题。',
    '情绪压抑积累': '发现自己在憋的时候，先说出来："妈妈现在需要一秒钟。"',
    '接受了表面修复': '下次听到"没事"，在松口气之前，多问一句："你真实的感受呢？"',
    '内疚驱动的决心': '不要在情绪高峰时许诺改变。等平静后，问自己：这次触发点是什么？',
    '用任务评价休息': '今晚感到空洞时，允许它存在，不要立刻用"没学习"来评价它。',
    '用规则关闭探索': '在说"必须"之前，先说"我听到你了"。',
  };

  const oneThing = topPattern && oneThingMap[topPattern] ? oneThingMap[topPattern] : '下次和她互动之前，先问自己：我现在的状态适合连接吗？';

  document.getElementById('gameArea').innerHTML = `
    <div class="result-card">
      <div class="result-title">你的模式报告</div>
      <div class="result-sub">这不是评分，是一面镜子。看见模式，是改变的第一步。</div>
      ${growth.length > 0 ? `
        <div class="pattern-summary">
          <div style="font-size:12px;color:#A09A93;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em">出现较多的模式</div>
          ${growth.slice(0,3).map(([p,c]) => `
            <div class="pattern-item">
              <div class="pattern-dot" style="background:${patternColors[p]||'#A09A93'}"></div>
              <div>
                <div class="pattern-name">${p}</div>
                <div class="pattern-desc">出现 ${c} 次</div>
              </div>
            </div>`).join('')}
        </div>` : ''}
      ${positive.length > 0 ? `
        <div class="pattern-summary">
          <div style="font-size:12px;color:#A09A93;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em">你已经在做的</div>
          ${positive.slice(0,2).map(([p,c]) => `
            <div class="pattern-item">
              <div class="pattern-dot" style="background:#1D9E75"></div>
              <div>
                <div class="pattern-name">${p}</div>
                <div class="pattern-desc">${c} 次选择了连接优先</div>
              </div>
            </div>`).join('')}
        </div>` : ''}
      <div class="one-thing">
        <div class="one-thing-label">下一步，只做一件事</div>
        <div class="one-thing-text">${oneThing}</div>
      </div>
      <button class="restart-btn" onclick="restart()">重新来一遍</button>
    </div>`;
}

window.restart = function(){
  currentIdx = 0;
  patternCounts = {};
  renderScene();
};

renderScene();
</script>
</body>
</html>
