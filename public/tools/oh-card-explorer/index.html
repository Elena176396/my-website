<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OH 卡探索 · 图卡与词卡自我觉察</title>
<meta name="description" content="通过 OH 图卡与词卡探索内心，支持多种抽卡模式、引导问题和 AI 深度解读。">
<meta name="theme-color" content="#0f0f0f">
<link rel="canonical" href="https://songchaoyang.com/tools/oh-card-explorer/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
:root {
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--surface3:#2e2e2e;
  --text:#e8e4df;--text-dim:#8a8580;--accent:#c9a96e;
  --accent-soft:rgba(201,169,110,0.15);--accent-glow:rgba(201,169,110,0.3);
  --card-back:#2a2520;--radius:12px;--radius-lg:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.tool-back{position:absolute;top:18px;left:20px;color:var(--text-dim);font-size:13px;font-weight:500;text-decoration:none;z-index:10;transition:color .2s}.tool-back:hover{color:var(--accent)}
.header{text-align:center;padding:40px 20px 20px}
.header h1{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;letter-spacing:6px;color:var(--accent)}
.header .sub{font-size:13px;color:var(--text-dim);margin-top:6px;letter-spacing:2px}
.mode-select{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:16px 20px;max-width:680px;margin:0 auto}
.mode-btn{background:var(--surface);border:1px solid var(--surface3);color:var(--text-dim);padding:10px 18px;border-radius:30px;font-size:13px;cursor:pointer;transition:all .3s;font-family:inherit;white-space:nowrap}
.mode-btn:hover{border-color:var(--accent);color:var(--text)}
.mode-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.spread-select{display:none;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 20px 16px;max-width:600px;margin:0 auto}
.spread-select.show{display:flex}
.spread-btn{background:var(--surface2);border:1px solid transparent;color:var(--text-dim);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .3s;font-family:inherit}
.spread-btn:hover{color:var(--text)}.spread-btn.active{border-color:var(--accent);color:var(--accent)}
.main{max-width:900px;margin:0 auto;padding:10px 20px 40px}
.draw-area{text-align:center;padding:20px}
.draw-btn{background:linear-gradient(135deg,var(--accent),#b08940);color:#0f0f0f;border:none;padding:14px 40px;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:3px;transition:all .3s;box-shadow:0 4px 24px var(--accent-glow)}
.draw-btn:hover{transform:translateY(-2px);box-shadow:0 6px 32px var(--accent-glow)}
.draw-btn:active{transform:translateY(0)}
.cards-container{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;padding:20px 0}
.card-slot{display:flex;flex-direction:column;align-items:center;gap:10px}
.card-slot .slot-label{font-size:12px;color:var(--accent);letter-spacing:2px;font-weight:500}
.card-wrapper{perspective:800px;width:160px;height:228px}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1);cursor:pointer}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);overflow:hidden}
.card-front{background:var(--card-back);display:flex;align-items:center;justify-content:center;border:1px solid var(--surface3)}
.card-front::after{content:'';width:80px;height:80px;border:2px solid var(--accent);border-radius:50%;opacity:.3}
.card-back-face{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--surface3)}
.card-back-face img{width:100%;height:100%;object-fit:cover}
.word-card .card-back-face{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#1e1b16,#252118);border:1px solid var(--accent)}
.word-card .card-back-face .word-text{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:var(--accent);letter-spacing:4px}
.card-inner.waiting .card-front{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{border-color:var(--surface3)}50%{border-color:var(--accent);box-shadow:0 0 20px var(--accent-glow)}}
.question-panel{background:var(--surface);border-radius:var(--radius-lg);padding:28px;margin-top:24px;border:1px solid var(--surface3);display:none}
.question-panel.show{display:block}
.question-layer{margin-bottom:20px}.question-layer:last-child{margin-bottom:0}
.layer-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.layer-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.layer-dot.l1{background:#6b9e7a}.layer-dot.l2{background:#7a8fb5}.layer-dot.l3{background:#b07a9e}.layer-dot.l4{background:#c9a96e}
.layer-name{font-size:11px;color:var(--text-dim);letter-spacing:2px}
.layer-active{color:var(--text)}
.question-text{font-family:'Noto Serif SC',serif;font-size:17px;line-height:1.7;color:var(--text);padding:12px 0 12px 18px;border-left:2px solid var(--surface3);margin-bottom:12px}
.question-text.active-q{border-left-color:var(--accent)}
.answer-area{margin:8px 0 4px 18px}
.answer-textarea{width:100%;min-height:80px;background:var(--surface2);border:1px solid var(--surface3);border-radius:var(--radius);color:var(--text);font-family:'Noto Sans SC',sans-serif;font-size:14px;line-height:1.6;padding:12px;resize:vertical;outline:none;transition:border-color .3s}
.answer-textarea:focus{border-color:var(--accent)}
.answer-textarea::placeholder{color:var(--text-dim);opacity:.6}
.next-q-btn{background:var(--surface2);border:1px solid var(--surface3);color:var(--text-dim);padding:8px 20px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .3s;margin-top:8px}
.next-q-btn:hover{border-color:var(--accent);color:var(--accent)}
.interpret-btn{display:block;margin:0 auto;background:linear-gradient(135deg,var(--accent),#b08940);color:#0f0f0f;border:none;padding:12px 32px;border-radius:30px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:2px;transition:all .3s;box-shadow:0 4px 24px var(--accent-glow)}
.interpret-btn:hover{transform:translateY(-2px);box-shadow:0 6px 32px var(--accent-glow)}
.interpret-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.interpret-result{margin-top:20px;padding:24px;background:linear-gradient(145deg,#1e1b16,#1a1815);border:1px solid var(--accent);border-radius:var(--radius-lg);font-size:15px;line-height:1.9;color:var(--text);display:none}
.interpret-result.show{display:block}
.interpret-result .interpret-title{font-family:'Noto Serif SC',serif;font-size:18px;color:var(--accent);margin-bottom:16px;letter-spacing:2px}
.interpret-result p{margin-bottom:12px}
.interpret-loading{text-align:center;color:var(--text-dim);font-size:13px;padding:20px;display:none}
.interpret-loading.show{display:block}
.post-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.continue-round{margin-top:16px;padding-top:16px;border-top:1px solid var(--surface3)}
.reset-btn{display:none;margin:20px auto 0;background:transparent;border:1px solid var(--surface3);color:var(--text-dim);padding:8px 24px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .3s}
.reset-btn.show{display:block}.reset-btn:hover{border-color:var(--accent);color:var(--text)}
.instructions{text-align:center;color:var(--text-dim);font-size:13px;line-height:1.8;padding:10px 20px;max-width:500px;margin:0 auto}
.copy-toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0f0f0f;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.copy-toast.show{opacity:1}
.spread-cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding:10px 0}
.spread-position{text-align:center}
.spread-position .pos-label{font-size:13px;color:var(--accent);letter-spacing:2px;margin-bottom:8px;font-weight:500}
.spread-position .pos-pair{display:flex;gap:10px;justify-content:center}
@media(max-width:600px){
  .header h1{font-size:22px;letter-spacing:4px}
  .card-wrapper{width:130px;height:185px}
  .word-card .card-back-face .word-text{font-size:22px}
  .cards-container{gap:16px}.question-text{font-size:15px}
  .mode-btn{padding:8px 14px;font-size:12px}
  .spread-cards{gap:12px}
}
</style>
</head>

    "「{word}」出现在这幅画面里，是在描述画中的谁或什么？",
    "图和「{word}」的组合，让你想到自己最近的什么经历？",
    "「{word}」是否改变了你刚才对图的理解？怎么变的？",
    "如果图是表面，「{word}」是潜台词，它在说什么？"
  ], ph:"字卡出现后，你的理解变了吗……" },
  { layer:"信念", dot:"l3", qs:[
    "这组图+字的背后，你一直在坚持什么？或回避什么？",
    "这组卡如果在提醒你一件事，你最不想听到的版本是什么？",
    "关于「{word}」，你有一个什么样的核心信念？从哪里来的？",
    "这组卡触动你的地方，和你生活中某个反复出现的模式有关吗？",
    "「{word}」背后，你在保护自己的什么？"
  ], ph:"你觉得背后在坚持或回避什么……" },
  { layer:"行动", dot:"l4", qs:[
    "看完这组卡，你最想做的一件事是什么？",
    "如果你要重新定义自己和「{word}」的关系，第一步会是什么？",
    "从这次探索中，你愿意带走什么，留下什么？",
    "带着对「{word}」的新理解，这周你可以尝试什么？",
    "如果你要对画面中的人物（或自己）说一句话，你会说什么？"
  ], ph:"接下来你想做什么……" }
];

// Mode 3: 先字后图 — 描述(纯字) → 投射(揭图后字+图) → 信念 → 行动
const Q_MODE3 = [
  { layer:"描述 · 字", dot:"l1", qs:[
    "看到「{word}」这个词——你脑海中第一个浮现的画面是什么？",
    "「{word}」对你来说意味着什么？用自己的话重新定义它。",
    "如果「{word}」是一种颜色、一种温度、一种声音，它会是什么？",
    "「{word}」让你想到生活中的哪个场景？",
    "说出「{word}」这个词的时候，你的身体哪个部位有感觉？"
  ], ph:"这个词让你想到什么……" },
  { layer:"投射 · 字+图", dot:"l2", qs:[
    "现在翻开图卡——把它和「{word}」放在一起，你的第一反应是什么？",
    "这幅画面是否印证了你刚才对「{word}」的理解？还是打破了它？",
    "图卡里的场景加上「{word}」，像你生活中的什么？",
    "如果画面中有一个角色代表「{word}」，那是谁？你和TA是什么关系？",
    "图卡出现后，「{word}」的重量变了吗？变轻了还是更重了？"
  ], ph:"图卡出现后，你的理解变了吗……" },
  { layer:"信念", dot:"l3", qs:[
    "这组字+图的背后，你一直在坚持什么？或回避什么？",
    "关于「{word}」，你有一个什么样的核心信念？这个信念从哪里来的？",
    "你对「{word}」的态度，和你小时候学到的有什么不同？",
    "这组卡触动你的地方，和你某个反复出现的模式有关吗？",
    "「{word}」背后，你在保护自己的什么？"
  ], ph:"你觉得背后在坚持或回避什么……" },
  { layer:"行动", dot:"l4", qs:[
    "看完这组卡，你最想做的一件事是什么？",
    "关于「{word}」，你现在最需要做的一个决定是什么？",
    "如果你要重新定义自己和「{word}」的关系，第一步会是什么？",
    "从这次探索中，你愿意带走什么，留下什么？",
    "明天醒来，你可以从哪一个最小的改变开始？"
  ], ph:"接下来你想做什么……" }
];

// === STATE ===
let S = {
  mode:1, spread:'time', picIdx:[], wordIdx:[], phase:'ready',
  usedPic:new Set(), usedWord:new Set(),
  answers:{}, qTexts:{}, stepIdx:0, maxContinue:3, continueCount:0,
  lastInterp:'', pendingSecondCard:null
};

const $=id=>document.getElementById(id);
const modeBtns=document.querySelectorAll('.mode-btn');
const spreadBtns=document.querySelectorAll('.spread-btn');
const rng=arr=>arr[Math.floor(Math.random()*arr.length)];
function randIdx(max,used){ if(used.size>=max)used.clear(); let i; do{i=Math.floor(Math.random()*max)}while(used.has(i)); used.add(i); return i; }

modeBtns.forEach(b=>b.addEventListener('click',()=>{
  modeBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');
  S.mode=+b.dataset.mode;$('spreadSelect').classList.toggle('show',S.mode===5);resetAll();
}));
spreadBtns.forEach(b=>b.addEventListener('click',()=>{
  spreadBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');
  S.spread=b.dataset.spread;resetAll();
}));

function mkPicCard(idx,autoFlip){
  const w=document.createElement('div');w.className='card-wrapper';
  const inner=document.createElement('div');inner.className='card-inner'+(autoFlip?' flipped':' waiting');
  inner.innerHTML=`<div class="card-face card-front"></div><div class="card-face card-back-face"><img src="data:image/jpeg;base64,${CARD_IMAGES[String(idx+1)]}" alt=""></div>`;
  if(!autoFlip)inner.addEventListener('click',()=>{ inner.classList.remove('waiting');inner.classList.add('flipped');onFlip(); });
  w.appendChild(inner);return w;
}
function mkWordCard(idx,autoFlip){
  const w=document.createElement('div');w.className='card-wrapper word-card';
  const inner=document.createElement('div');inner.className='card-inner'+(autoFlip?' flipped':' waiting');
  inner.innerHTML=`<div class="card-face card-front"></div><div class="card-face card-back-face"><span class="word-text">${CARD_WORDS[idx]}</span></div>`;
  if(!autoFlip)inner.addEventListener('click',()=>{ inner.classList.remove('waiting');inner.classList.add('flipped');onFlip(); });
  w.appendChild(inner);return w;
}

// === DRAW ===
$('drawBtn').addEventListener('click',draw);
$('resetBtn').addEventListener('click',resetAll);

function draw(){
  const cc=$('cardsContainer'),qp=$('questionPanel');
  cc.innerHTML='';qp.innerHTML='';qp.classList.remove('show');
  $('instructions').style.display='none';$('drawBtn').style.display='none';
  $('resetBtn').classList.add('show');
  S.answers={};S.qTexts={};S.stepIdx=0;S.continueCount=0;S.lastInterp='';S.pendingSecondCard=null;

  if(S.mode===5){ drawSpread(); return; }

  const pi=randIdx(88,S.usedPic), wi=randIdx(88,S.usedWord);
  S.picIdx=[pi];S.wordIdx=[wi];

  const slot=document.createElement('div');slot.className='card-slot';
  const hint=document.createElement('div');hint.className='slot-label';

  if(S.mode===1){
    const pair=document.createElement('div');pair.style.cssText='display:flex;gap:16px';
    pair.appendChild(mkPicCard(pi));pair.appendChild(mkWordCard(wi));
    slot.appendChild(pair);hint.textContent='点击翻牌';slot.appendChild(hint);
  } else if(S.mode===2){
    slot.appendChild(mkPicCard(pi));hint.textContent='点击翻开图卡';slot.appendChild(hint);
    S.pendingSecondCard={type:'word',idx:wi};
  } else if(S.mode===3){
    slot.appendChild(mkWordCard(wi));hint.textContent='点击翻开字卡';slot.appendChild(hint);
    S.pendingSecondCard={type:'pic',idx:pi};
  }
  cc.appendChild(slot);
}

function drawSpread(){
  const labels=SPREAD_LABELS[S.spread];
  const div=document.createElement('div');div.className='spread-cards';
  S.picIdx=[];S.wordIdx=[];
  for(let i=0;i<3;i++){
    const pi=randIdx(88,S.usedPic),wi=randIdx(88,S.usedWord);
    S.picIdx.push(pi);S.wordIdx.push(wi);
    const pos=document.createElement('div');pos.className='spread-position';
    const lbl=document.createElement('div');lbl.className='pos-label';lbl.textContent=labels[i];
    pos.appendChild(lbl);
    const pair=document.createElement('div');pair.className='pos-pair';
    pair.appendChild(mkPicCard(pi));pair.appendChild(mkWordCard(wi));
    pos.appendChild(pair);div.appendChild(pos);
  }
  $('cardsContainer').appendChild(div);
}

// === FLIP HANDLER ===
function onFlip(){
  const cc=$('cardsContainer');
  const flipped=cc.querySelectorAll('.card-inner.flipped').length;
  const total=cc.querySelectorAll('.card-inner').length;

  // Mode 2/3: after first card, show second card
  if((S.mode===2||S.mode===3)&&flipped===1&&S.pendingSecondCard){
    // Show first question layer immediately
    setTimeout(()=>showQuestions(),800);
    // Add second card after a beat
    setTimeout(()=>{
      const slot=cc.querySelector('.card-slot');
      const hint=slot.querySelector('.slot-label');
      if(S.pendingSecondCard.type==='word'){
        const card=mkWordCard(S.pendingSecondCard.idx);
        slot.insertBefore(card,hint);
        hint.textContent='感受后，点击翻开字卡';
      } else {
        const card=mkPicCard(S.pendingSecondCard.idx);
        slot.insertBefore(card,hint);
        hint.textContent='感受后，点击翻开图卡';
      }
      S.pendingSecondCard=null;
    },1000);
    return;
  }

  // Mode 1: both flipped
  if(S.mode===1&&flipped>=2&&!$('questionPanel').classList.contains('show')){
    setTimeout(()=>showQuestions(),600);
  }
  // Mode 5: some flipped
  if(S.mode===5&&flipped>=2&&!$('questionPanel').classList.contains('show')){
    setTimeout(()=>showQuestions(),600);
  }
  // Mode 2/3: second card flipped — show layer 2
  if((S.mode===2||S.mode===3)&&flipped>=2){
    // Layer 2+ already queued via step progression
  }
}

// === QUESTION SYSTEM ===
function showQuestions(){
  $('questionPanel').innerHTML='';
  $('questionPanel').classList.add('show');
  S.stepIdx=0;
  renderStep(0);
}

function getSteps(){
  if(S.mode===5) return getSpreadSteps();
  const qMap={1:Q_MODE1,2:Q_MODE2,3:Q_MODE3};
  return qMap[S.mode]||Q_MODE1;
}

function getSpreadSteps(){
  const labels=SPREAD_LABELS[S.spread];
  const steps=[];
  // 3 position questions
  for(let i=0;i<3;i++){
    const w=CARD_WORDS[S.wordIdx[i]];
    steps.push({
      layer:labels[i], dot:['l1','l2','l3'][i],
      qs:[
        `看「${labels[i]}」这个位置——画面里你看到了什么？配上字卡「${w}」，让你想到什么？`,
        `「${labels[i]}」位置的图和「${w}」放在一起，你的第一反应是什么？它跟你的${labels[i]}有什么关系？`,
        `这个位置的画面加上「${w}」，像你生活中的哪个片段？`
      ],
      ph:`描述「${labels[i]}」位置的图+字给你的感受……`
    });
  }
  // Belief layer — all 3 positions together
  const allWords=S.wordIdx.map(i=>CARD_WORDS[i]);
  steps.push({
    layer:'信念', dot:'l3',
    qs:[
      `纵观三个位置——「${labels[0]}」到「${labels[2]}」，「${allWords.join('」「')}」三个词连在一起，你看到了什么模式？你一直在坚持或回避什么？`,
      `三组卡合在一起看，它们在讲同一个故事吗？这个故事的主题是什么？你在其中的角色是？`,
      `从「${labels[0]}」到「${labels[2]}」，你发现自己有什么信念在反复出现？它从哪里来的？`
    ],
    ph:'三组卡放在一起，你看到什么模式……'
  });
  // Action layer
  steps.push({
    layer:'行动', dot:'l4',
    qs:[
      `看完整个牌阵，你最想做的一件事是什么？`,
      `如果这个牌阵在给你一个建议，那会是什么？从「${labels[2]}」的位置出发，你的下一步是？`,
      `从这次探索中，你愿意带走什么，留下什么？明天可以从哪一个最小的改变开始？`
    ],
    ph:'接下来你想做什么……'
  });
  return steps;
}

function renderStep(idx){
  const steps=getSteps();
  if(idx>=steps.length)return;
  const step=steps[idx];
  const word=S.wordIdx[0]!==undefined?CARD_WORDS[S.wordIdx[0]]:'';
  const qText=rng(step.qs).replace(/\{word\}/g,word);
  S.qTexts[idx]=qText;

  const div=document.createElement('div');div.className='question-layer';
  div.innerHTML=`
    <div class="layer-header"><span class="layer-dot ${step.dot}"></span><span class="layer-name layer-active">${step.layer}</span></div>
    <div class="question-text active-q">${qText}</div>
    <div class="answer-area"><textarea class="answer-textarea" id="ans-${idx}" placeholder="${step.ph}"></textarea></div>
  `;

  if(idx<steps.length-1){
    const btn=document.createElement('button');btn.className='next-q-btn';
    btn.textContent=idx<steps.length-2?'准备好了，下一层 →':'进入最后一层 →';
    btn.addEventListener('click',()=>{
      S.answers[idx]=($('ans-'+idx)||{}).value||'';
      btn.style.display='none';
      div.querySelector('.active-q')?.classList.remove('active-q');
      renderStep(idx+1);
    });
    div.appendChild(btn);
  } else {
    // Last step — show interpret button
    const ia=document.createElement('div');ia.style.marginTop='16px';
    ia.innerHTML=`
      <button class="interpret-btn" id="interpretBtn">生 成 解 读</button>
      <div class="interpret-loading" id="interpLoading">正在解读你的内心世界…</div>
      <div class="interpret-result" id="interpResult"></div>
      <div id="postInterp" style="display:none">
        <div class="post-btns">
          <button class="next-q-btn" id="copyBtn">复制解读</button>
          <button class="next-q-btn" id="saveBtn">保存为图片</button>
          <button class="next-q-btn" id="contBtn">继续探索 →</button>
        </div>
        <div id="contArea" style="display:none"></div>
      </div>
    `;
    div.appendChild(ia);
    setTimeout(()=>{
      $('interpretBtn').addEventListener('click',doInterpret);
    },100);
  }
  $('questionPanel').appendChild(div);
  div.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// === INTERPRET ===
async function doInterpret(){
  S.answers[getSteps().length-1]=($('ans-'+(getSteps().length-1))||{}).value||'';
  const btn=$('interpretBtn'),loading=$('interpLoading'),result=$('interpResult');
  btn.disabled=true;btn.style.display='none';loading.classList.add('show');

  const steps=getSteps();
  let answersText='';
  for(let i=0;i<steps.length;i++){
    answersText+=`【${steps[i].layer}】\n问题：${S.qTexts[i]||''}\n回答：${S.answers[i]||'（未作答）'}\n\n`;
  }

  let cardContext='';
  if(S.mode===5){
    const labels=SPREAD_LABELS[S.spread];
    cardContext='牌阵类型：'+labels.join(' / ')+'\n';
    for(let i=0;i<3;i++) cardContext+=`位置「${labels[i]}」字卡：${CARD_WORDS[S.wordIdx[i]]}\n`;
  } else {
    cardContext=`字卡：「${CARD_WORDS[S.wordIdx[0]]}」\n`;
  }

  const prompt=`你是一位专业的OH卡（潜意识投射卡）解读师。

以下是一次OH卡探索的记录：
${cardContext}
${answersText}
请根据以上信息进行解读。要求：
1. 从来访者的回答中找到核心投射主题（不要简单复述回答）
2. 指出回答中可能的深层心理动力（例如：防御机制、未完成事件、核心信念）
3. 指出回答中的矛盾或张力（如果有的话）
4. 给出一个整合性的洞察——用一句话点出来访者此刻最需要看见的东西
5. 以一个开放性问题结尾，邀请来访者继续探索

语气：温暖但不煽情，专业但不学术化，像一个有经验的教练在跟你聊天。不要用"亲爱的"。不要分点作答，用自然段落。300字以内。
如果某些层次来访者未作答，根据已有回答进行解读即可，不要提及"未作答"。`;

  try{
    const resp=await fetch("/api/english-chat",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})
    });
    const data=await resp.json();
    const text=data.content.map(c=>c.type==='text'?c.text:'').filter(Boolean).join('');
    loading.classList.remove('show');
    const ps=text.split('\n').filter(p=>p.trim());
    result.innerHTML='<div class="interpret-title">解 读</div>'+ps.map(p=>'<p>'+p+'</p>').join('');
    result.classList.add('show');
    S.lastInterp=text;

    $('postInterp').style.display='block';
    $('copyBtn').addEventListener('click',()=>copyText(text));
    $('saveBtn').addEventListener('click',saveAsImage);
    $('contBtn').addEventListener('click',()=>{ $('contBtn').style.display='none';showContinueRound(); });
    result.scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(e){
    loading.classList.remove('show');
    result.innerHTML='<div class="interpret-title">解读失败</div><p>请检查网络连接后重试。</p>';
    result.classList.add('show');btn.style.display='block';btn.disabled=false;
  }
}

// === CONTINUE EXPLORE (max 3 rounds) ===
function showContinueRound(){
  if(S.continueCount>=S.maxContinue){ return; }
  const area=$('contArea');area.style.display='block';
  const roundDiv=document.createElement('div');roundDiv.className='continue-round';
  const roundNum=S.continueCount+1;
  roundDiv.innerHTML=`
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">追问 ${roundNum}/3</div>
    <textarea class="answer-textarea" id="contAns-${roundNum}" placeholder="写下你对解读的回应、新的想法……"></textarea>
    <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="interpret-btn" id="contBtn-${roundNum}" style="font-size:13px;padding:10px 24px">追 问 解 读</button>
    </div>
    <div class="interpret-loading" id="contLoad-${roundNum}">继续探索中…</div>
    <div class="interpret-result" id="contRes-${roundNum}"></div>
    <div id="contPost-${roundNum}" style="display:none"></div>
  `;
  area.appendChild(roundDiv);
  roundDiv.scrollIntoView({behavior:'smooth',block:'nearest'});
  $('contAns-'+roundNum).focus();

  $('contBtn-'+roundNum).addEventListener('click',async()=>{
    const ans=$('contAns-'+roundNum).value;
    if(!ans.trim())return;
    const btn=$('contBtn-'+roundNum),loading=$('contLoad-'+roundNum),result=$('contRes-'+roundNum);
    btn.disabled=true;btn.style.display='none';loading.classList.add('show');

    const word=CARD_WORDS[S.wordIdx[0]];
    const prompt=`你是一位专业的OH卡解读师，正在进行一次深度对话。来访者抽到的字卡是「${word}」。

以下是之前的解读：
${S.lastInterp}

来访者对此的回应是：
${ans}

请基于来访者的新回应继续深入探索。要求：
1. 回应来访者说的内容，不要忽略或泛化
2. 找到新回应中更深一层的线索
3. 指出来访者可能还没意识到的东西
4. 以一个更精准的问题结尾，引导继续探索

语气：温暖但不煽情，像有经验的教练。不要用"亲爱的"。自然段落，不分点。250字以内。`;

    try{
      const resp=await fetch("/api/english-chat",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})
      });
      const data=await resp.json();
      const text=data.content.map(c=>c.type==='text'?c.text:'').filter(Boolean).join('');
      loading.classList.remove('show');
      const ps=text.split('\n').filter(p=>p.trim());
      result.innerHTML='<div class="interpret-title">追问解读 '+roundNum+'</div>'+ps.map(p=>'<p>'+p+'</p>').join('');
      result.classList.add('show');
      S.lastInterp=text;
      S.continueCount++;

      // Post buttons for this round
      const postDiv=$('contPost-'+roundNum);postDiv.style.display='block';
      postDiv.innerHTML=`<div class="post-btns">
        <button class="next-q-btn" onclick="copyText(\`${text.replace(/`/g,"\`").replace(/\\/g,"\\\\")}\`)">复制解读</button>
        ${S.continueCount<S.maxContinue?'<button class="next-q-btn" id="nextCont-'+roundNum+'">继续探索 →</button>':''}
      </div>`;
      if(S.continueCount<S.maxContinue){
        $('nextCont-'+roundNum).addEventListener('click',()=>{ $('nextCont-'+roundNum).style.display='none'; showContinueRound(); });
      }
      result.scrollIntoView({behavior:'smooth',block:'nearest'});
    }catch(e){
      loading.classList.remove('show');btn.style.display='block';btn.disabled=false;
    }
  });
}

// === COPY ===
function copyText(text){
  navigator.clipboard.writeText(text).then(()=>{
    $('copyToast').classList.add('show');
    setTimeout(()=>$('copyToast').classList.remove('show'),1500);
  }).catch(()=>{
    // Fallback
    const ta=document.createElement('textarea');ta.value=text;
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
    $('copyToast').classList.add('show');
    setTimeout(()=>$('copyToast').classList.remove('show'),1500);
  });
}

// === SAVE AS IMAGE ===
async function saveAsImage(){
  const btn=$('saveBtn');btn.textContent='生成中...';btn.disabled=true;
  try{
    if(!window.html2canvas){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        s.onload=res;s.onerror=rej;document.head.appendChild(s);
      });
    }
    const sd=document.createElement('div');
    sd.style.cssText='position:fixed;left:-9999px;top:0;width:600px;padding:40px;background:#0f0f0f;color:#e8e4df;font-family:Noto Sans SC,sans-serif;';
    // Title
    sd.innerHTML=`<div style="text-align:center;font-family:Noto Serif SC,serif;font-size:24px;color:#c9a96e;letter-spacing:4px;margin-bottom:8px">OH 卡 探 索</div>
      <div style="text-align:center;font-size:12px;color:#8a8580;margin-bottom:24px;letter-spacing:2px">${new Date().toLocaleDateString('zh-CN')}</div>`;
    // Cards info
    if(S.mode===5){
      const labels=SPREAD_LABELS[S.spread];
      let cardsHtml='<div style="text-align:center;margin-bottom:20px">';
      for(let i=0;i<3;i++) cardsHtml+=`<span style="font-family:Noto Serif SC,serif;font-size:18px;color:#c9a96e;margin:0 8px">${labels[i]}：「${CARD_WORDS[S.wordIdx[i]]}」</span>`;
      cardsHtml+='</div>';sd.innerHTML+=cardsHtml;
    } else {
      sd.innerHTML+=`<div style="text-align:center;font-family:Noto Serif SC,serif;font-size:28px;color:#c9a96e;margin-bottom:24px;letter-spacing:4px">「${CARD_WORDS[S.wordIdx[0]]}」</div>`;
    }
    sd.innerHTML+='<div style="width:60px;height:1px;background:#c9a96e;margin:0 auto 24px;opacity:.5"></div>';
    // Answers
    const steps=getSteps();const dotC=['#6b9e7a','#7a8fb5','#b07a9e','#c9a96e','#6b9e7a','#7a8fb5'];
    for(let i=0;i<steps.length;i++){
      if(!S.answers[i])continue;
      sd.innerHTML+=`<div style="margin-bottom:16px"><div style="font-size:11px;color:#8a8580;letter-spacing:2px;margin-bottom:4px;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:${dotC[i%6]};display:inline-block"></span>${steps[i].layer}</div><div style="font-size:14px;line-height:1.7;padding-left:12px;border-left:2px solid #2e2e2e;color:#e8e4df">${S.answers[i]}</div></div>`;
    }
    // Interp
    const ir=$('interpResult');
    if(ir&&ir.classList.contains('show')){
      sd.innerHTML+='<div style="width:60px;height:1px;background:#c9a96e;margin:20px auto;opacity:.5"></div>';
      sd.innerHTML+=`<div style="font-size:14px;line-height:1.8;padding:20px;background:#1e1b16;border:1px solid #c9a96e;border-radius:12px">${ir.innerHTML}</div>`;
    }
    sd.innerHTML+='<div style="text-align:center;font-size:10px;color:#8a8580;margin-top:24px;letter-spacing:1px">OH卡探索 · 倾听内心的声音</div>';
    document.body.appendChild(sd);
    const canvas=await html2canvas(sd,{backgroundColor:'#0f0f0f',scale:2,useCORS:true});
    document.body.removeChild(sd);
    const link=document.createElement('a');
    link.download='OH卡探索_'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'')+'.png';
    link.href=canvas.toDataURL('image/png');link.click();
    btn.textContent='保存为图片';btn.disabled=false;
  }catch(e){
    console.error(e);btn.textContent='保存失败';btn.disabled=false;
    setTimeout(()=>{btn.textContent='保存为图片'},2000);
  }
}

// === RESET ===
function resetAll(){
  $('cardsContainer').innerHTML='';$('questionPanel').innerHTML='';
  $('questionPanel').classList.remove('show');$('resetBtn').classList.remove('show');
  $('instructions').style.display='block';$('drawBtn').style.display='inline-block';
  S.phase='ready';S.picIdx=[];S.wordIdx=[];S.answers={};S.qTexts={};
  S.stepIdx=0;S.continueCount=0;S.lastInterp='';S.pendingSecondCard=null;
}
</script>
