        <div style={S.toneRow}>

          <button className={"tBtn"+(tone==="fun"?" tOn":"")} onClick={()=>setTone("fun")}>反差萌<span style={S.tSub}>适合分享</span></button>
        </div>
      </div>
      <button className="mBtn" onClick={()=>setPh("test")}>开始测评</button>
      <p style={S.iNote}>凭直觉作答 · 没有对错之分 · 结果页可随时切换语气</p>
    </div></div>}

    {ph==="test"&&<div style={S.tWrap}>
      <div style={S.tHead}>
        <div style={S.tHL}>
          <span style={{...S.badge,background:inE?"#fdf0e4":"#eef0ff",color:inE?"#E08D3C":"#4361ee"}}>{inE?"第一部分 · 九型":"第二部分 · MBTI"}</span>
        </div>
        <span style={S.cnt}>{qi+1}<span style={{color:"#bbb"}}>/{TOTAL}</span></span>
      </div>
      <div style={S.pT}><div style={{...S.pF,width:`${pct}%`,background:inE?"linear-gradient(90deg,#E08D3C,#C1666B)":"linear-gradient(90deg,#4361ee,#7209b7)"}}/></div>
      <p style={S.sSub}>{inE?"哪句话更像你？关注内心真实的驱动，而不是你希望自己是什么样。":"哪个答案更贴切地描述你的日常感受或行为？"}</p>
      <div className={fade} style={S.qC}>
        <span style={{...S.qN,color:inE?"#E08D3C":"#4361ee"}}>Q{qi+1}</span>
        {!inE&&<p style={cur[0].includes(" vs ")?S.qWP:S.qTx}>{cur[0]}</p>}
        <div style={S.opts}>
          {["A","B"].map(ch=>(<button key={ch} className="oBtn" onClick={()=>pick(ch)}>
            <span style={{...S.oL,color:inE?"#E08D3C":"#4361ee"}}>{ch}</span>
            <span style={S.oT}>{inE?cur[ch==="A"?0:1]:cur[ch==="A"?1:2]}</span>
          </button>))}
        </div>
      </div>
      {!inE&&<div style={S.live}>
        <p style={S.liveT}>MBTI 维度实时追踪</p>
        {DP.map(([a,b])=>{const sa=ms[a],sb=ms[b],t=sa+sb||1,pa=Math.round(sa/t*100);const w=sa>sb?a:(sb>sa?b:null);
          return(<div key={a+b} style={S.lRow}>
            <span style={{...S.lL,fontWeight:w===a?700:400,color:w===a?DC[a]:"#bbb"}}>{DSH[a]}</span>
            <div style={S.lBar}><div style={{height:"100%",width:`${pa}%`,background:DC[a],borderRadius:"3px 0 0 3px",transition:"width .4s"}}/><div style={{height:"100%",width:`${100-pa}%`,background:DC[b],borderRadius:"0 3px 3px 0",transition:"width .4s"}}/></div>
            <span style={{...S.lR,fontWeight:w===b?700:400,color:w===b?DC[b]:"#bbb"}}>{DSH[b]}</span>
          </div>);})}
      </div>}
      {inE&&<div style={S.live}>
        <p style={S.liveT}>九型得分实时追踪</p>
        <div style={S.eGrid}>{[1,2,3,4,5,6,7,8,9].map(i=>{
          const mx=Math.max(...Object.values(es),1);
          return(<div key={i} style={S.eCol}>
            <div style={S.eBarW}><div style={{width:"100%",height:`${es[i]/mx*100}%`,background:ET[i].c,borderRadius:"3px 3px 0 0",transition:"height .4s",minHeight:es[i]?4:0}}/></div>
            <span style={S.eNum}>{i}</span>
          </div>);})}</div>
      </div>}
    </div>}

    {ph==="result"&&<Result mbti={mbti} main={main} wing={wing} es={es} ms={ms} tone={tone} setTone={setTone} onReset={reset}/>}
  </div>);
}

function Result({mbti,main,wing,es,ms,tone,setTone,onReset}){
  const mi=MT[mbti], ei=ET[main], wi=ET[wing];
  const v=bvec(main,wing), sc=syn(mbti,v), sl=synL(sc), tl=tens(mbti,v);
  const stack=STK[mbti], code=`${mbti} · ${main}w${wing}`;
  const nick=NICK[mbti+main]||`${EMOD[main]}${MNOUN[mbti]}`;
  const eOrder=[1,2,3,4,5,6,7,8,9].sort((a,b)=>es[b]-es[a]);

  return(<div style={S.rWrap} className="fi">
    <div style={{...S.rHero,borderTop:`4px solid ${ei.c}`}}>
      <span style={S.rEye}>FUSION TYPE</span>
      <div style={S.rCode}><span style={{color:mi.c}}>{mbti}</span><span style={S.rSep}>·</span><span style={{color:ei.c}}>{main}w{wing}</span></div>
      {tone==="pro"
        ?<div style={S.rNames}><span style={S.rNm}>{mi.n}</span><span style={{color:"#ddd"}}>×</span><span style={S.rNm}>{ei.n}{wing}翼</span></div>
        :<div style={S.rNick}>{nick}</div>}
      <div style={{...S.synPill,background:sl.c+"18",color:sl.c}}>协同度 {sc} · {sl.t}</div>
    </div>

    <div style={S.tSwitch}>
      <button className={"sBtn"+(tone==="pro"?" sOn":"")} onClick={()=>setTone("pro")}>专业版</button>
      <button className={"sBtn"+(tone==="fun"?" sOn":"")} onClick={()=>setTone("fun")}>反差萌</button>
    </div>

    {tone==="fun"?<>
      <div style={S.card}>
        <h3 style={S.cH}>你的隐藏人设</h3>
        <div style={{...S.nickBig,color:ei.c}}>{nick}</div>
        <p style={S.funLine}>{EQUIRK[main]}，然后{MQUIRK[mbti]}。</p>
      </div>
      <div style={S.card}>
        <h3 style={S.cH}>反差点</h3>
        <div style={S.contrast}>
          <div style={S.cSide}><span style={S.cLab}>别人看到的</span><p style={S.cTxt}>{mi.n} — {mi.m}</p></div>
          <div style={S.cArrow}>≠</div>
          <div style={S.cSide}><span style={S.cLab}>实际驱动你的</span><p style={S.cTxt}>{ei.n}{wing}翼 — {ei.motive}</p></div>
        </div>
      </div>
      {tl.length>0&&<div style={S.card}><h3 style={S.cH}>最矛盾的地方</h3><p style={S.dP}>{tl[0]}</p></div>}
      <div style={S.card}>
        <h3 style={S.cH}>一句话总结</h3>
        <p style={S.funBig}>「{ei.desire}」的灵魂，装在「{mi.m}」的壳子里。</p>
      </div>
    </>:<>
      <div style={S.card}>
        <h3 style={S.cH}>外壳与内核</h3>
        <div style={S.shell}>
          <div style={{...S.shBox,borderColor:mi.c}}><span style={{...S.shTag,color:mi.c}}>外壳 · 怎么做</span><b style={S.shT}>{mbti} {mi.n}</b><p style={S.shP}>{mi.core}</p></div>
          <div style={{...S.shBox,borderColor:ei.c}}><span style={{...S.shTag,color:ei.c}}>内核 · 为什么</span><b style={S.shT}>{main}w{wing} {ei.n}</b><p style={S.shP}>核心恐惧是{ei.fear}；核心渴望是{ei.desire}。{wi.n}的{wing}翼给这个内核加上了「{wi.focus}」的偏向。</p></div>
        </div>
        <div style={{...S.fuseBox,borderLeft:`3px solid ${ei.c}`}}>
          <span style={S.fuseLab}>融合驱动</span>
          <p style={S.fuseTxt}>你用<b style={{color:mi.c}}>「{FNA[stack[0]]}」</b>的方式，去<b style={{color:ei.c}}>「{ei.motive}」</b>。</p>
        </div>
      </div>

      <div style={{...S.card,borderLeft:`3px solid ${sl.c}`}}>
        <h3 style={S.cH}>协同度 {sc}/100 · {sl.t}</h3>
        <div style={S.synBar}><div style={{height:"100%",width:`${sc}%`,background:sl.c,borderRadius:4,transition:"width .8s"}}/></div>
        <p style={S.dP}>{sl.d}</p>
      </div>

      {tl.length>0&&<div style={S.card}>
        <h3 style={S.cH}>内在张力（{tl.length} 处）</h3>
        <p style={S.hint}>这些是外壳和内核方向不一致的地方。单看MBTI或单看九型都发现不了。</p>
        {tl.map((t,i)=><div key={i} style={S.tenRow}><span style={S.tenNum}>{i+1}</span><p style={S.tenTxt}>{t}</p></div>)}
      </div>}

      <div style={S.card}>
        <h3 style={S.cH}>九型得分分布</h3>
        {eOrder.map((i,k)=>{const p=Math.round(es[i]/16*100);
          return(<div key={i} style={S.eRow}>
            <span style={{...S.eLab,fontWeight:k===0?700:(i===wing?600:400),color:k===0?ET[i].c:(i===wing?"#666":"#aaa")}}>
              {i}号 {ET[i].n}{k===0?" · 主型":(i===wing?" · 翼":"")}
            </span>
            <div style={S.eTrack}><div style={{height:"100%",width:`${p}%`,background:ET[i].c,opacity:k===0?1:(i===wing?.7:.3),borderRadius:4,transition:"width .6s"}}/></div>
            <span style={S.eScore}>{es[i]}</span>
          </div>);})}
        <p style={S.foot}>每型满分16。翼型 = 主型两侧相邻型中得分较高者。</p>
      </div>

      <div style={S.card}>
        <h3 style={S.cH}>MBTI 维度</h3>
        {DP.map(([a,b])=>{const sa=ms[a],sb=ms[b],t=sa+sb||1,pa=Math.round(sa/t*100);const w=sa>sb?a:b;
          return(<div key={a+b} style={{marginBottom:16}}>
            <div style={S.bL}>
              <span style={{fontSize:13,fontWeight:w===a?700:400,color:w===a?DC[a]:"#999"}}>{DSH[a]}({a}) <small>{sa}</small></span>
              <span style={{fontSize:13,fontWeight:w===b?700:400,color:w===b?DC[b]:"#999"}}><small>{sb}</small> ({b}){DSH[b]}</span>
            </div>
            <div style={S.bT}><div style={{height:"100%",width:`${pa}%`,background:DC[a],borderRadius:"4px 0 0 4px",transition:"width .6s"}}/><div style={{height:"100%",width:`${100-pa}%`,background:DC[b],borderRadius:"0 4px 4px 0",transition:"width .6s"}}/></div>
          </div>);})}
      </div>

      <div style={S.card}>
        <h3 style={S.cH}>认知功能栈</h3>
        <p style={S.hint}>四个字母背后，是八个认知功能的优先级排列。它决定了你如何获取信息、如何做出判断。</p>
        {stack.map((f,i)=>(<div key={f} style={S.fnRow}>
          <div style={{...S.fnB,background:FNC[i]}}>{["①","②","③","④"][i]}</div>
          <div style={{flex:1}}>
            <div style={S.fnH}><b style={{color:FNC[i]}}>{f}</b><span style={{fontSize:13,color:"#666"}}>{FNN[f]}</span><span style={{fontSize:11,color:"#aaa",marginLeft:"auto"}}>{FNR[i]}</span></div>
            <p style={S.fnD}>{FND[f]}</p>
          </div></div>))}
      </div>

      <div style={S.card}>
        <h3 style={S.cH}>压力与成长</h3>
        <div style={S.spRow}>
          <div style={{...S.spBox,background:"#fdf3f0"}}>
            <span style={{fontSize:18,color:"#e76f51"}}>↓</span>
            <h4 style={S.spH}>压力下走向 {ei.down}号</h4>
            <p style={S.spP}>{ei.downT}</p>
            <p style={S.spX}>叠加 MBTI 劣势功能 <b>{stack[3]}</b>（{FNN[stack[3]]}）失控，会表现为{FND[stack[3]].replace(/。$/,"")}的反面。</p>
          </div>
          <div style={{...S.spBox,background:"#f0f8f5"}}>
            <span style={{fontSize:18,color:"#2a9d8f"}}>↑</span>
            <h4 style={S.spH}>成长走向 {ei.up}号</h4>
            <p style={S.spP}>{ei.upT}</p>
            <p style={S.spX}>路径是刻意练习 MBTI 第三功能 <b>{stack[2]}</b>（{FNN[stack[2]]}）：{FND[stack[2]]}。</p>
          </div>
        </div>
      </div>

      <div style={S.card}>
        <h3 style={S.cH}>核心机制</h3>
        <div style={S.mechGrid}>
          {[["注意力焦点",ei.focus],["防御机制",ei.def],["核心执念",ei.pas],["核心恐惧",ei.fear],["核心渴望",ei.desire],["主导功能",`${stack[0]} ${FNN[stack[0]]}`]].map(([k,val])=>(
            <div key={k} style={S.mechItem}><span style={S.mechK}>{k}</span><span style={S.mechV}>{val}</span></div>))}
        </div>
      </div>

      <div style={S.card}>
        <h3 style={S.cH}>职业方向</h3>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {mi.car.split(" · ").map((c,i)=><span key={i} style={S.chip}>{c}</span>)}
        </div>
        <p style={S.foot}>以上基于 MBTI 外壳。九型内核决定的是：你在这些岗位上会因为什么而投入，又会因为什么而消耗。</p>
      </div>
    </>}

    <p style={S.disc}>本测评为自我探索工具，非临床诊断。人格是流动的，结果反映的是你当前的倾向。</p>
    <button className="mBtn" onClick={onReset} style={{display:"block",margin:"20px auto 48px"}}>重新测评</button>
  </div>);
}
