<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f0f;--surface:#1a1a1a;--border:#252525;--accent:#c8a96e;--accent-dim:#7a6040;--text:#e8e2d9;--dim:#6a6259;--red:#c0392b;--green:#27ae60;--orange:#e67e22;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:13px;font-weight:500;color:var(--accent);letter-spacing:2px;text-transform:uppercase}
.stats{display:flex;gap:14px;font-size:12px;color:var(--dim)}
.stats b{color:var(--accent)}
.tabs{width:100%;max-width:480px;display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
.tab{flex:1;padding:9px;font-size:12px;text-align:center;cursor:pointer;color:var(--dim);border:none;background:transparent;font-family:inherit;transition:all .15s}
.tab.on{background:rgba(200,169,110,.15);color:var(--accent);font-weight:600}
.alert{width:100%;max-width:480px;background:rgba(230,126,34,.1);border:1px solid #e67e2244;border-radius:8px;padding:9px 13px;font-size:12px;color:var(--orange);display:none;margin-bottom:8px}
.alert.on{display:block}
.range-row{width:100%;max-width:480px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;margin-bottom:4px;font-size:12px;color:var(--dim)}
.range-row input{flex:1;accent-color:var(--accent)}
.range-row span{color:var(--accent);font-weight:600;min-width:80px;text-align:right}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.meta{font-size:11px;color:var(--dim);letter-spacing:1px;text-align:center}
.progress{width:100%;height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.bar{height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:44px 28px 36px;text-align:center;position:relative;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:border-color .2s,background .2s}
.card.flipped{background:#1c1810;border-color:var(--accent-dim)}
.fc{position:absolute;top:13px;right:15px;font-size:11px;color:var(--dim)}
.fc.hot{color:var(--red);font-weight:700}
.rank{position:absolute;top:13px;left:15px;font-size:11px;color:var(--dim)}
.word{font-size:46px;font-weight:300;letter-spacing:-1px;cursor:pointer;line-height:1}
.word:hover{color:var(--accent)}
.meaning{margin-top:6px;opacity:0;transition:opacity .2s}
.meaning.on{opacity:1}
.pos{display:inline-block;font-size:11px;color:var(--accent);background:rgba(200,169,110,.12);border:1px solid rgba(200,169,110,.2);border-radius:4px;padding:1px 7px;margin-bottom:8px;font-style:italic}
.zh{font-size:30px;font-weight:400;color:var(--accent)}
.btns{width:100%;max-width:480px;display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:9px}
.btn{flex:1;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.reveal{border-color:var(--accent-dim);color:var(--accent);font-size:13px}
.btn.ok{background:rgba(39,174,96,.1);border-color:#27ae6055;color:var(--green)}
.btn.no{background:rgba(192,57,43,.1);border-color:#c0392b55;color:var(--red)}
.btn.sound{flex:0 0 48px;font-size:18px;color:var(--dim)}
.btn.sound:hover{color:var(--accent)}
.done{text-align:center;padding:36px 0;display:none}
.done.on{display:block}
.done h2{font-size:20px;color:var(--accent);margin-bottom:10px}
.done p{color:var(--dim);font-size:13px;line-height:1.8}
.hard-panel{width:100%;max-width:480px;background:var(--surface);border:1px solid #c0392b33;border-radius:10px;padding:14px;display:none}
.hard-panel.on{display:block}
.hard-panel h3{font-size:12px;color:var(--red);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}
.hw{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.hw:last-child{border-bottom:none}
.hw .m{color:var(--dim);font-size:12px}
.hw .n{color:var(--red);font-size:11px;font-weight:700}
</style>

const KEY='kaoyan_1341';
const EB=[1,2,4,7,15,30];
const today=()=>new Date().toISOString().split('T')[0];
let words,todayN;
const saved=(()=>{try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}})();
if(saved){const map={};saved.words.forEach(w=>map[w.word]=w);words=RAW.map(w=>map[w.word]||{...w});todayN=saved.lastDate===today()?(saved.todayN||0):0;}
else{words=RAW.map(w=>(({...w})));todayN=0;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({words,todayN,lastDate:today()}));}catch(e){}}
let mode='all',queue=[],idx=0,rStart=1,rEnd=1341;
function updateRange(){rStart=parseInt(document.getElementById('rangeStart').value);rEnd=parseInt(document.getElementById('rangeEnd').value);if(rStart>rEnd){const t=rStart;rStart=rEnd;rEnd=t;}document.getElementById('rangeLabel').textContent=rStart+'–'+rEnd;if(mode==='all'){build();show();}}
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['all','review','hard'][i]===m));const hp=document.getElementById('hardPanel');const mw=document.getElementById('mainWrap');const rr=document.getElementById('rangeRow');if(m==='hard'){hp.classList.add('on');mw.style.display='none';rr.style.display='none';renderHard();}else{hp.classList.remove('on');mw.style.display='flex';rr.style.display=m==='all'?'flex':'none';build();show();}}
function build(){let src;if(mode==='review')src=words.filter(w=>w.next_review&&w.next_review<=today());else src=words.filter(w=>w.rank>=rStart&&w.rank<=rEnd);queue=[...src];shuffle(queue);idx=0;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function show(){const done=document.getElementById('doneScreen');const card=document.getElementById('card');const btns=document.getElementById('btnArea');if(idx>=queue.length){done.classList.add('on');card.style.display='none';btns.style.display='none';document.getElementById('metaLine').textContent='';document.getElementById('progBar').style.width='100%';const hc=words.filter(w=>(w.forget_count||0)>=10).length;document.getElementById('doneMsg').textContent=`完成 ${queue.length} 词 · 今日 ${todayN} · 待攻克 ${hc}`;return;}done.classList.remove('on');card.style.display='flex';btns.style.display='flex';const w=queue[idx];document.getElementById('progBar').style.width=(idx/queue.length*100)+'%';document.getElementById('metaLine').textContent=`#${w.rank} · ${idx+1} / ${queue.length}`;document.getElementById('rankEl').textContent='#'+w.rank;document.getElementById('wordEl').textContent=w.word;document.getElementById('posEl').textContent=w.pos+'.';document.getElementById('zhEl').textContent=w.meaning;const fc=w.forget_count||0;const fcEl=document.getElementById('fcBadge');fcEl.textContent=fc>0?'✗'+fc:'';fcEl.className='fc'+(fc>=10?' hot':'');document.getElementById('meaningEl').classList.remove('on');document.getElementById('card').classList.remove('flipped');document.getElementById('revBtn').style.display='flex';document.getElementById('judgeRow').style.display='none';updateStats();}
function reveal(){document.getElementById('meaningEl').classList.add('on');document.getElementById('card').classList.add('flipped');document.getElementById('revBtn').style.display='none';document.getElementById('judgeRow').style.display='flex';}
function markOk(){const w=queue[idx];const days=EB[Math.min(Math.max((w.forget_count||0)-1,0),EB.length-1)];const d=new Date();d.setDate(d.getDate()+days);w.next_review=d.toISOString().split('T')[0];todayN++;idx++;save();show();}
function markNo(){const w=queue[idx];w.forget_count=(w.forget_count||0)+1;const d=new Date();d.setDate(d.getDate()+1);w.next_review=d.toISOString().split('T')[0];todayN++;idx++;save();show();}
function restart(){build();document.getElementById('doneScreen').classList.remove('on');document.getElementById('card').style.display='flex';document.getElementById('btnArea').style.display='flex';show();}
function speak(){const w=queue[idx];if(!w)return;const u=new SpeechSynthesisUtterance(w.word);u.lang='en-US';u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}
function renderHard(){const hard=words.filter(w=>(w.forget_count||0)>=10).sort((a,b)=>b.forget_count-a.forget_count);const el=document.getElementById('hardList');if(!hard.length){el.innerHTML='<div style="color:var(--dim);font-size:13px;padding:8px 0">暂无待攻克词汇</div>';return;}el.innerHTML=hard.map(w=>`<div class="hw"><span>${w.word} <span class="m">${w.pos}. ${w.meaning}</span></span><span class="n">✗${w.forget_count}</span></div>`).join('');}
function updateStats(){document.getElementById('tday').textContent=todayN;document.getElementById('hcnt').textContent=words.filter(w=>(w.forget_count||0)>=10).length;const due=words.filter(w=>w.next_review&&w.next_review<=today()).length;const a=document.getElementById('alertBox');if(due>0&&mode!=='review'){a.textContent=`📅 ${due} 个词今日到期复习`;a.classList.add('on');}else a.classList.remove('on');}
build();show();
